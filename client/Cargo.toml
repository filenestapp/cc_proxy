[workspace]
members = ["core", "cli", "desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
dirs = "5"
gethostname = "0.5"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true
