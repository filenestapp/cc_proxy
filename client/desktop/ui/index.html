<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CC Proxy</title>
<script>
  const appearance = (() => {
    const key = "ccproxy.appearance";
    const system = matchMedia("(prefers-color-scheme: dark)");
    let preference = "system";
    try {
      const saved = localStorage.getItem(key);
      if (saved === "dark" || saved === "light") preference = saved;
    } catch { /* Storage may be unavailable. */ }

    const apply = () => {
      document.documentElement.dataset.theme = preference === "system" ? (system.matches ? "dark" : "light") : preference;
    };
    system.addEventListener("change", apply);
    apply();

    return {
      bind() {
        const controls = Array.from(document.querySelectorAll(".appearance"));
        controls.forEach((control) => {
          control.value = preference;
          control.addEventListener("change", () => {
            preference = control.value;
            try { localStorage.setItem(key, preference); } catch { /* Keep the in-memory selection. */ }
            controls.forEach((item) => { item.value = preference; });
            apply();
          });
        });
      },
    };
  })();
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #f3f6fa; --panel: #fff; --ink: #172638; --muted: #52647a; --line: #cbd6e2;
    --accent: #146650; --accent-ink: #fff; --accent-soft: #e0f2eb; --accent-hover: #0c503e;
    --warn: #805412; --warn-soft: #faf0d9; --bad: #a52c46; --bad-soft: #fbe9ee;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d1522; --panel: #172333; --ink: #edf3f8; --muted: #a7b8cb; --line: #334559;
    --accent: #76dfb6; --accent-ink: #10291f; --accent-soft: #193a34; --accent-hover: #a5f0d3;
    --warn: #f5ca80; --warn-soft: #392f24; --bad: #ffa4ae; --bad-soft: #402630;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  ::selection { background: var(--accent); color: var(--accent-ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  main { padding: 0 22px 22px; max-width: 520px; margin-inline: auto; }
  .app-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; min-height: 66px; padding: 8px 0; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 680; }
  .brand svg { color: var(--accent); flex: none; }
  h1, h2, p, dl { margin: 0; }
  h1 { font-size: 25px; line-height: 1.15; letter-spacing: -.025em; }
  h2 { font-size: 15px; letter-spacing: -.01em; }
  input, button, select { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  input, select { padding: 7px 9px; }
  input { width: 100%; min-height: 40px; }
  input::placeholder { color: var(--muted); opacity: 1; }
  button { cursor: pointer; }
  button:disabled { opacity: .55; cursor: default; }
  button.primary { min-height: 43px; width: 100%; background: var(--accent); border-color: var(--accent); font-weight: 680; color: var(--accent-ink); }
  button.primary:not(:disabled):hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  button.primary.on { background: var(--accent-soft); color: var(--accent); }
  button.primary.on:not(:disabled):hover { background: var(--panel); border-color: var(--accent); }
  .preferences { display: flex; flex-wrap: wrap; gap: 8px; }
  .preference { display: grid; gap: 3px; color: var(--muted); font-size: 12px; }
  .preference select { min-height: 32px; color: var(--ink); }
  .fields { display: grid; gap: 12px; margin: 17px 0; }
  .field label { font-weight: 600; font-size: 13px; display: block; margin-bottom: 4px; }
  .field small { color: var(--muted); font-weight: 400; }
  .field-hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .password-field { position: relative; }
  .password-field input { padding-right: 45px; }
  .password-field button { position: absolute; inset: 3px 3px 3px auto; display: grid; place-items: center; width: 36px; border: 0; background: transparent; color: var(--muted); }
  .password-field button:hover { color: var(--accent); }
  .password-field button[aria-pressed=true] { color: var(--accent); }
  .detail, .note { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .note { margin-top: 12px; }
  .status { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 16px; }
  .status-icon { display: grid; place-items: center; width: 42px; height: 42px; flex: none; border: 1px solid var(--line); border-radius: 11px; background: var(--panel); color: var(--muted); }
  .status[data-state=running] .status-icon { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
  .status[data-state=connecting] .status-icon { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
  .status[data-state=failed] .status-icon { color: var(--bad); background: var(--bad-soft); border-color: transparent; }
  .status .detail { margin-top: 4px; }
  .exit-ip { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 21px; padding: 14px 0; border-block: 1px solid var(--line); }
  .exit-ip output { color: var(--muted); font-size: 13px; text-align: right; overflow-wrap: anywhere; }
  .exit-ip output[data-verified=true] { color: var(--accent); font: 13px/1.6 var(--mono); background: var(--accent-soft); border-radius: 6px; padding: 2px 7px; }
  .account { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 5px 8px; margin: 13px 0; }
  .account dt, .footer { color: var(--muted); font-size: 12px; }
  .account dd { margin: 0; overflow-wrap: anywhere; font-size: 13px; }
  .footer { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 11px; }
  .footer span { overflow-wrap: anywhere; }
  .footer button { border: 0; background: transparent; color: var(--accent); white-space: nowrap; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }
  .notice { margin-top: 12px; border-radius: 8px; padding: 8px 10px; font-size: 13px; background: var(--warn-soft); color: var(--warn); overflow-wrap: anywhere; }
  .notice.bad { background: var(--bad-soft); color: var(--bad); }
  .notice:empty { display: none; }
  .diagnostics { color: var(--muted); margin-top: 8px; font-size: 12px; }
  .diagnostics summary { cursor: pointer; }
  .diagnostics p { margin-top: 4px; font-family: var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header class="app-header">
    <div class="brand">
      <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a4 4 0 0 0 6 .4l3-3a4 4 0 0 0-5.7-5.7l-1.6 1.6M14 11a4 4 0 0 0-6-.4l-3 3a4 4 0 0 0 5.7 5.7l1.6-1.6"/></svg>
      CC Proxy
    </div>
    <div class="preferences">
      <label class="preference">
        <span data-i18n="language">Language</span>
        <select id="language">
          <option value="system" data-i18n="system">System</option>
          <option value="en" lang="en" data-i18n="english">English</option>
          <option value="zh-Hans" lang="zh-Hans" data-i18n="simplified_chinese"></option>
        </select>
      </label>
      <label class="preference">
        <span data-i18n="appearance">Appearance</span>
        <select class="appearance">
          <option value="system" data-i18n="system">System</option>
          <option value="light" data-i18n="light">Light</option>
          <option value="dark" data-i18n="dark">Dark</option>
        </select>
      </label>
    </div>
  </header>

  <p id="loading" class="detail" role="status">Loading session…</p>
  <form id="login" hidden novalidate>
    <h1 data-i18n="sign_in">Sign in</h1>
    <div class="fields">
      <div class="field">
        <label for="server" data-i18n="server">Control plane URL</label>
        <input id="server" name="server" type="url" placeholder="https://cp.example.com" required data-required-message="server_required">
      </div>
      <div class="field">
        <label for="username" data-i18n="username">Username</label>
        <input id="username" name="username" autocomplete="username" required data-required-message="username_required">
      </div>
      <div class="field">
        <label for="password" data-i18n="password">Password</label>
        <div class="password-field">
          <input id="password" name="password" type="password" autocomplete="current-password" required data-required-message="password_required">
          <button id="show-password" type="button" aria-label="Show password" aria-pressed="false" data-i18n-label="show_password">
            <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
          </button>
        </div>
      </div>
      <div class="field">
        <label for="device"><span data-i18n="device_name">Device name</span> <small data-i18n="optional">(optional)</small></label>
        <input id="device" name="device" placeholder="This computer" aria-describedby="device-hint">
        <p class="field-hint" id="device-hint" data-i18n="device_name_hint">Up to 64 characters without spaces or slashes.</p>
      </div>
    </div>
    <button class="primary" id="login-btn" type="submit">Sign in</button>
    <div class="notice" id="login-err" role="alert"></div>
    <details id="login-details" class="diagnostics" hidden>
      <summary data-i18n="technical_details">Technical details</summary>
      <p id="login-details-text"></p>
    </details>
    <p class="note" data-i18n="credential_note">This app saves a revocable device credential after sign-in.</p>
  </form>

  <section id="home" hidden>
    <div class="status" id="connection-status">
      <span class="status-icon">
        <svg aria-hidden="true" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a4 4 0 0 0 6 .4l3-3a4 4 0 0 0-5.7-5.7l-1.6 1.6M14 11a4 4 0 0 0-6-.4l-3 3a4 4 0 0 0 5.7 5.7l1.6-1.6"/></svg>
      </span>
      <div role="status"><h1 id="state-title">Disconnected</h1><p class="detail" id="state-sub"></p></div>
    </div>
    <button class="primary" id="toggle" type="button">Connect</button>
    <div class="notice" id="msg" role="status"></div>
    <details id="home-details" class="diagnostics" hidden>
      <summary data-i18n="technical_details">Technical details</summary>
      <p id="home-details-text"></p>
    </details>
    <section class="exit-ip" aria-labelledby="exit-ip-heading">
      <h2 id="exit-ip-heading" data-i18n="public_exit_ip">Public exit IP</h2>
      <output id="v-public-exit">—</output>
    </section>
    <dl class="account">
      <dt data-i18n="account">Account</dt><dd id="v-user">—</dd>
      <dt data-i18n="device">Device</dt><dd id="v-device">—</dd>
    </dl>
    <div class="footer"><span id="v-server"></span><button id="logout" type="button">Sign out</button></div>
  </section>
</main>
<script type="module">
import { messages, resolveLanguage } from "./locale.mjs";

(() => {
  const $ = (id) => document.getElementById(id);
  const invoke = (cmd, args) => window.__TAURI__.core.invoke(cmd, args || {});
  const language = $("language");
  const loginInputs = [$("server"), $("username"), $("password"), $("device")];
  const languageKey = "ccproxy.language";
  const webviewLanguages = () => navigator.languages?.length ? navigator.languages : [navigator.language];
  let systemLanguages = webviewLanguages();
  let activeLanguage, readingSystemLanguage = false;
  let view, pending = "", operationError = null, stopping = false, revision = 0;
  let loadingFailed = false;

  const STATES = {
    stopped: ["disconnected", "connect_help"],
    starting: ["connecting", "connect_wait"],
    connecting: ["connecting", "connect_wait"],
    running: ["connected", "connected_help"],
    failed: ["connection_failed", "connection_failed_help"],
  };

  const t = (key) => messages[activeLanguage][key] ?? messages.en.operation_failed;
  const text = (id, value) => {
    const el = $(id);
    if (el.textContent !== value) el.textContent = value;
  };

  function applyLanguage() {
    const next = resolveLanguage(language.value, systemLanguages);
    if (next === activeLanguage) return;
    activeLanguage = next;
    document.documentElement.lang = next;
    invoke("set_tray_language", { language: next }).catch(() => {});
    for (const element of document.querySelectorAll("[data-i18n]")) {
      element.textContent = t(element.dataset.i18n);
    }
    for (const element of document.querySelectorAll("[data-i18n-label]")) {
      element.setAttribute("aria-label", t(element.dataset.i18nLabel));
    }
    for (const input of loginInputs) {
      if (input.dataset.validationError) input.setCustomValidity(t(input.dataset.validationError));
    }
    render();
  }

  async function readSystemLanguages() {
    if (language.value !== "system" || readingSystemLanguage) return;
    readingSystemLanguage = true;
    try {
      const preferred = await invoke("system_languages");
      systemLanguages = preferred.length ? preferred : webviewLanguages();
    } catch {
      systemLanguages = webviewLanguages();
    } finally {
      readingSystemLanguage = false;
    }
    applyLanguage();
  }

  function showNotice(id, detailsId, notice, tunnelDetails = "") {
    const key = notice?.key || "operation_failed";
    text(id, notice ? t(key) : "");
    const details = $(detailsId);
    const diagnostic = notice?.detail || notice?.message || (typeof notice === "string" ? notice : "") || tunnelDetails;
    text(detailsId + "-text", diagnostic);
    details.hidden = !diagnostic;
    if (details.hidden) details.open = false;
  }

  function render() {
    text("loading", t(loadingFailed ? "loading_failed" : "loading"));
    if (!view) return;
    const v = view;
    const state = v.tunnel;
    const on = v.want_connected || state === "running";
    if (!on) stopping = false;
    $("loading").hidden = true;
    $("login").hidden = v.signed_in;
    $("home").hidden = !v.signed_in;
    $("login-btn").disabled = Boolean(pending);
    text("login-btn", t(pending === "login" ? "signing_in" : "sign_in"));
    if (!v.signed_in) {
      $("device").placeholder = v.device || t("this_computer");
      const notice = operationError || v.message;
      showNotice("login-err", "login-details", notice);
      $("login-err").classList.toggle("bad", Boolean(notice && notice.key !== "signed_out"));
      return;
    }

    const [title, sub] = STATES[state] || STATES.stopped;
    const connecting = pending === "connect";
    const disconnecting = pending === "disconnect" || stopping;
    $("connection-status").dataset.state = connecting ? "connecting" : state;
    text("state-title", t(connecting ? "connecting" : disconnecting ? "disconnecting" : title));
    text("state-sub", t(connecting ? "connect_wait" : disconnecting ? "disconnect_wait" : sub));
    $("toggle").classList.toggle("on", on || disconnecting);
    text("toggle", t(connecting ? "connecting" : disconnecting ? "disconnecting" : on ? "disconnect" : "connect"));
    $("toggle").disabled = Boolean(pending || stopping || (!v.has_assignment && !on));
    $("logout").disabled = Boolean(pending);
    text("logout", t(pending === "logout" ? "signing_out" : "sign_out"));

    text("v-user", v.user || "—");
    text("v-device", v.device || "—");
    const exit = disconnecting || pending === "logout" ? null : v.public_exit;
    $("v-public-exit").dataset.verified = String(exit?.state === "verified");
    const exitText = {
      verified: exit?.ip,
      checking: t("exit_ip_checking"),
      unavailable: t("exit_ip_unavailable"),
    };
    text("v-public-exit", exitText[exit?.state] ?? "—");
    text("v-server", v.server || "");
    if (v.server) $("server").value = v.server;
    const notice = operationError || v.message || (!v.has_assignment ? { key: "no_egress_assigned" } : null);
    showNotice("msg", "home-details", notice, connecting || disconnecting ? "" : v.tunnel_message);
    $("msg").classList.toggle("bad", Boolean(operationError));
  }

  async function refresh(online) {
    if (pending) return;
    const startedAt = revision;
    try {
      const result = await invoke("get_state", { refresh: online });
      if (revision !== startedAt || pending) return;
      view = result;
      render();
    } catch (error) {
      if (!view) {
        loadingFailed = true;
        render();
      }
      console.error(error);
    }
  }

  async function run(command, args) {
    if (pending) return;
    revision++;
    pending = command;
    operationError = null;
    render();
    try {
      view = await invoke(command, args);
      if (command === "login") {
        $("password").value = "";
        showPassword(false);
      }
      if (command === "disconnect") stopping = true;
    } catch (error) {
      operationError = error;
    } finally {
      pending = "";
      render();
    }
  }

  function showPassword(show) {
    $("password").type = show ? "text" : "password";
    $("show-password").setAttribute("aria-pressed", String(show));
  }

  function checkLoginInput(input) {
    if (input.validity.valueMissing || (input.id === "username" && !input.value.trim())) {
      return input.dataset.requiredMessage;
    }
    if (input.id === "server" && (input.validity.typeMismatch || !/^https?:\/\//.test(input.value))) {
      return "invalid_server";
    }
    if (input.id === "device") {
      const name = input.value.trim();
      if (Array.from(name).length > 64 || /[\/ \t\n]/.test(name)) return "invalid_device";
    }
    return "";
  }

  try {
    const stored = localStorage.getItem(languageKey);
    if (stored === "en" || stored === "zh-Hans") language.value = stored;
  } catch { /* Storage may be unavailable. */ }
  language.addEventListener("change", () => {
    try { localStorage.setItem(languageKey, language.value); } catch { /* Keep the in-memory selection. */ }
    applyLanguage();
    readSystemLanguages();
  });
  window.addEventListener("languagechange", readSystemLanguages);
  window.addEventListener("focus", readSystemLanguages);
  applyLanguage();
  readSystemLanguages();

  appearance.bind();
  $("show-password").addEventListener("click", () => showPassword($("password").type === "password"));
  for (const input of loginInputs) {
    input.addEventListener("input", () => {
      delete input.dataset.validationError;
      input.setCustomValidity("");
    });
  }
  $("login").addEventListener("submit", (event) => {
    event.preventDefault();
    for (const input of loginInputs) {
      const key = checkLoginInput(input);
      input.dataset.validationError = key;
      input.setCustomValidity(key ? t(key) : "");
      if (!input.reportValidity()) return;
    }
    run("login", {
      server: $("server").value,
      username: $("username").value,
      password: $("password").value,
      device: $("device").value.trim(),
    });
  });
  $("toggle").addEventListener("click", () => run(view.want_connected || view.tunnel === "running" ? "disconnect" : "connect"));
  $("logout").addEventListener("click", () => run("logout"));

  refresh(true);
  setInterval(() => refresh(false), 1500);
  setInterval(() => refresh(true), 60000);
})();
</script>
</body>
</html>
