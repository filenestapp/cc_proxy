<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CC Proxy</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --ink: #1b2230; --muted: #6b7486; --line: #dde1e8;
    --accent: #2f5bea; --accent-ink: #ffffff; --ok: #17803d; --ok-soft: #e4f4e9; --bad: #c8322b; --bad-soft: #fbe9e7;
    --warn: #a86400; --warn-soft: #fdf1dc;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #13161c; --panel: #1c2129; --ink: #e7eaf0; --muted: #98a1b2; --line: #2e3542;
      --accent: #5b82ff; --ok: #4cc27a; --ok-soft: #173323; --bad: #ff6b62; --bad-soft: #3a1d1c;
      --warn: #f0b24a; --warn-soft: #3a2c13;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
         -webkit-user-select: none; user-select: none; }
  main { padding: 20px 18px; max-width: 460px; margin: 0 auto; }
  h1 { font-size: 17px; margin: 0 0 16px; }
  label { display: block; color: var(--muted); font-size: 12px; margin: 12px 0 4px; }
  input { width: 100%; font: inherit; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line);
          background: var(--panel); color: var(--ink); -webkit-user-select: text; user-select: text; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
           padding: 8px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); width: 100%;
                   padding: 10px; margin-top: 18px; font-weight: 600; }
  button:disabled { opacity: .55; cursor: default; }
  .err { color: var(--bad); font-size: 13px; min-height: 1.4em; margin-top: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .state { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 4px var(--ok-soft); }
  .dot.busy { background: var(--warn); box-shadow: 0 0 0 4px var(--warn-soft); }
  .dot.bad { background: var(--bad); box-shadow: 0 0 0 4px var(--bad-soft); }
  .state b { font-size: 16px; }
  .state span { color: var(--muted); font-size: 12px; }
  .toggle { width: 100%; padding: 14px; font-size: 15px; font-weight: 600; border-radius: 10px; }
  .toggle.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  dl { margin: 16px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; }
  dt { color: var(--muted); font-size: 12px; padding-top: 1px; }
  dd { margin: 0; font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; }
  .note { color: var(--muted); font-size: 12px; margin-top: 14px; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; color: var(--muted); font-size: 12px; }
  .msg { margin-top: 12px; font-size: 13px; padding: 8px 10px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); }
  .msg.bad { background: var(--bad-soft); color: var(--bad); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <form id="login" hidden autocomplete="on">
    <h1>登录 CC Proxy</h1>
    <label for="server">控制端地址</label>
    <input id="server" name="server" type="url" placeholder="https://cp.example.com" required>
    <label for="username">用户名</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <label for="device">设备名称</label>
    <input id="device" name="device" placeholder="默认为本机名称">
    <button class="primary" id="login-btn" type="submit">登录</button>
    <div class="err" id="login-err" role="alert"></div>
    <p class="note">登录后客户端只保存一个可随时吊销的设备凭证，不保存密码。</p>
  </form>

  <section id="home" hidden>
    <div class="card">
      <div class="state"><div class="dot" id="dot"></div><div><b id="state-title">未连接</b><br><span id="state-sub"></span></div></div>
      <button class="toggle" id="toggle" type="button">连接</button>
      <div class="msg" id="msg" role="status" hidden></div>
      <dl>
        <dt>用户</dt><dd id="v-user">—</dd>
        <dt>设备</dt><dd id="v-device">—</dd>
        <dt>出口 IP</dt><dd id="v-egress">—</dd>
        <dt>入口</dt><dd id="v-entry">—</dd>
        <dt>出口机</dt><dd id="v-host">—</dd>
      </dl>
      <p class="note">只有控制端配置的域名经由出口 IP 访问，其他流量保持本机网络。连接时系统会请求一次管理员授权。</p>
    </div>
    <div class="foot"><span id="v-server"></span><button id="logout" type="button">退出登录</button></div>
  </section>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const invoke = (cmd, args) => window.__TAURI__.core.invoke(cmd, args || {});
  let busy = false;

  const TITLES = {
    idle: ["未连接", ""], stopped: ["未连接", ""], connecting: ["正在连接…", "等待授权与隧道启动"],
    running: ["已连接", "命中规则的域名经由出口 IP 访问"], failed: ["连接失败", ""],
  };

  function render(v) {
    $("login").hidden = v.signed_in;
    $("home").hidden = !v.signed_in;
    if (!v.signed_in) {
      if (v.server) $("server").value = v.server;
      $("device").placeholder = "默认为 " + v.device;
      if (v.message) $("login-err").textContent = v.message;
      return;
    }
    const state = v.tunnel;
    const [title, sub] = TITLES[state] || [state, ""];
    $("state-title").textContent = title;
    $("state-sub").textContent = state === "failed" || (state === "stopped" && v.tunnel_message)
      ? v.tunnel_message : sub;
    $("dot").className = "dot " + ({ running: "on", connecting: "busy", failed: "bad" }[state] || "");
    const on = v.want_connected || state === "running";
    $("toggle").textContent = on ? "断开" : "连接";
    $("toggle").classList.toggle("on", on);
    $("toggle").disabled = busy || (!v.entry && !on);
    $("v-user").textContent = v.user || "—";
    $("v-device").textContent = v.device || "—";
    $("v-egress").textContent = v.egress_ip || "未分配";
    $("v-entry").textContent = v.entry ? v.entry.host + ":" + v.entry.port : "—";
    $("v-host").textContent = v.host || "—";
    $("v-server").textContent = v.server || "";
    const msg = v.message || (!v.entry ? "管理员还没有给这个账号分配出口 IP，暂时无法连接。" : "");
    $("msg").hidden = !msg;
    $("msg").textContent = msg;
    $("msg").classList.toggle("bad", /失效|失败|停用|收回/.test(msg));
  }

  async function refresh(online) {
    try { render(await invoke("get_state", { refresh: !!online })); } catch (e) { console.error(e); }
  }

  function fail(where, e) {
    const text = String(e && e.message || e);
    if (where === "login") $("login-err").textContent = text;
    else { $("msg").hidden = false; $("msg").textContent = text; $("msg").classList.add("bad"); }
  }

  $("login").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    $("login-err").textContent = "";
    $("login-btn").disabled = true;
    $("login-btn").textContent = "正在登录…";
    try {
      render(await invoke("login", { server: $("server").value, username: $("username").value,
                                     password: $("password").value, device: $("device").value }));
      $("password").value = "";
    } catch (e) { fail("login", e); }
    $("login-btn").disabled = false;
    $("login-btn").textContent = "登录";
  });

  $("toggle").addEventListener("click", async () => {
    busy = true;
    $("toggle").disabled = true;
    try {
      const on = $("toggle").classList.contains("on");
      render(await invoke(on ? "disconnect" : "connect"));
    } catch (e) { fail("home", e); }
    busy = false;
    refresh(false);
  });

  $("logout").addEventListener("click", async () => {
    try { render(await invoke("logout")); } catch (e) { fail("home", e); }
  });

  refresh(true);
  setInterval(() => refresh(false), 1500);   // tunnel status from local files
  setInterval(() => refresh(true), 60000);    // exit IP and entry from the control plane
})();
</script>
</body>
</html>
