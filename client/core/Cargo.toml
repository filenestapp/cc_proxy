[package]
name = "ccproxy-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sign-in, config sync and sing-box supervision shared by the cc_proxy CLI and desktop app"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
dirs.workspace = true
gethostname.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }
