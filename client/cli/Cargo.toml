[package]
name = "aifree-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "aifree command-line client; also the privileged tunnel helper the desktop app launches"

[[bin]]
name = "aifree"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
ccproxy-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
rpassword = "7"

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true
