<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CC Proxy Console</title>
<script>
  const appearance = (() => {
    const key = "ccproxy.appearance";
    const system = matchMedia("(prefers-color-scheme: dark)");
    let preference = "system";
    try {
      const saved = localStorage.getItem(key);
      if (saved === "dark" || saved === "light") preference = saved;
    } catch { /* Storage may be unavailable. */ }

    const apply = () => {
      document.documentElement.dataset.theme = preference === "system" ? (system.matches ? "dark" : "light") : preference;
    };
    system.addEventListener("change", apply);
    apply();

    return {
      bind() {
        const controls = Array.from(document.querySelectorAll(".appearance"));
        controls.forEach((control) => {
          control.value = preference;
          control.addEventListener("change", () => {
            preference = control.value;
            try { localStorage.setItem(key, preference); } catch { /* Keep the in-memory selection. */ }
            controls.forEach((item) => { item.value = preference; });
            apply();
          });
        });
      },
    };
  })();
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #f3f6fa; --panel: #fff; --sidebar: #eaf0f6; --canvas: #f4f8fb;
    --ink: #172638; --muted: #52647a; --line: #cbd6e2; --hover: #e9f0f6;
    --accent: #146650; --accent-ink: #fff; --accent-soft: #e0f2eb; --accent-hover: #0c503e;
    --ok: #146650; --ok-soft: #e0f2eb; --bad: #a52c46; --bad-soft: #fbe9ee;
    --warn: #805412; --warn-soft: #faf0d9; --idle: #52647a; --idle-soft: #e8eef4;
    --node-ok: #84b5a6; --node-warn: #c7a266; --node-bad: #c9909d;
    --wire: #567f75; --canvas-dot: #ccd8e4;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --side: 190px;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d1522; --panel: #172333; --sidebar: #101b29; --canvas: #101c2a;
    --ink: #edf3f8; --muted: #a7b8cb; --line: #334559; --hover: #223448;
    --accent: #76dfb6; --accent-ink: #10291f; --accent-soft: #193a34; --accent-hover: #a5f0d3;
    --ok: #76dfb6; --ok-soft: #193a34; --bad: #ffa4ae; --bad-soft: #402630;
    --warn: #f5ca80; --warn-soft: #392f24; --idle: #a7b8cb; --idle-soft: #263447;
    --node-ok: #46786b; --node-warn: #8b734a; --node-bad: #94586a;
    --wire: #5e9083; --canvas-dot: #2a3e52;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  ::selection { background: var(--accent); color: var(--accent-ink); }
  a { color: var(--accent); text-decoration: none; text-underline-offset: 3px; }
  a:hover { text-decoration: underline; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
  button:hover { background: var(--hover); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 650; }
  button.primary:hover { background: var(--accent-hover); }
  button.danger { color: var(--bad); border-color: var(--bad); }
  button.link { border: 0; background: none; color: var(--accent); padding: 4px 6px; }
  button.link:hover { text-decoration: underline; }
  button.link.danger { color: var(--bad); }
  button:disabled { opacity: .55; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
  input::placeholder, textarea::placeholder { color: var(--muted); }
  textarea { min-height: 96px; font-family: var(--mono); font-size: 13px; }
  input[type=checkbox] { width: auto; accent-color: var(--accent); }
  .mono { font-family: var(--mono); }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .icon { width: 16px; height: 16px; flex: none; vertical-align: middle; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--ink); font-size: 17px; font-weight: 700; letter-spacing: -.02em; }
  .brand:hover { text-decoration: none; }
  .brand-mark { width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid var(--node-ok); border-radius: 9px; color: var(--accent); background: var(--accent-soft); flex: none; }
  .brand-mark .icon { width: 18px; height: 18px; }

  /* Application shell */
  .shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; }
  nav.side { background: var(--sidebar); border-right: 1px solid var(--line); padding: 21px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  nav.side .brand { margin: 0 8px 24px; width: fit-content; }
  .nav-links { display: flex; flex-direction: column; gap: 3px; }
  .nav-links a { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 9px 10px; border: 1px solid transparent; border-radius: 8px; white-space: nowrap; }
  .nav-links a:hover { background: var(--hover); color: var(--ink); text-decoration: none; }
  .nav-links a.active { background: var(--accent-soft); border-color: var(--node-ok); color: var(--accent); font-weight: 650; }
  .nav-links .count { margin-left: auto; font-size: 11px; background: var(--bad-soft); color: var(--bad); border-radius: 20px; padding: 0 6px; }
  .nav-divider { height: 1px; border: 0; margin: 10px 8px; background: var(--line); }
  header.top { display: flex; align-items: center; gap: 14px; padding: 17px 28px; border-bottom: 1px solid var(--line); background: var(--bg); }
  header.top h1 { font-size: 24px; letter-spacing: -.025em; margin: 0; flex: 1; min-width: 0; overflow-wrap: anywhere; line-height: 1.2; }
  #who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 20vw; }
  .content { padding: 23px 28px 44px; max-width: 1950px; margin-inline: auto; }

  /* blocks */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .section { margin-bottom: 20px; }
  .section > h2, .card > h2 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .section > h2 .spacer, .toolbar .spacer { flex: 1; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar input, .toolbar select { width: auto; min-width: 160px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--bg); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--hover); }
  td.actions { white-space: nowrap; text-align: right; }
  .empty { color: var(--muted); padding: 18px; text-align: center; }
  .badge { font-size: 11px; border-radius: 999px; padding: 1px 8px; white-space: nowrap; background: var(--idle-soft); color: var(--idle); display: inline-block; }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.bad { background: var(--bad-soft); color: var(--bad); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 16px; }
  .form-row { margin-bottom: 12px; }
  .form-row label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .form-row .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .form-row.check label { display: flex; gap: 8px; align-items: center; color: var(--ink); font-size: 14px; }

  /* Network topology */
  .summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 12px; background: var(--panel); margin-bottom: 20px; }
  .stat { padding: 12px 16px; min-width: 0; }
  .stat + .stat { border-left: 1px solid var(--line); }
  .stat b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; letter-spacing: -.025em; margin-block: 1px; }
  .stat span { display: block; color: var(--muted); font-size: 12px; }
  .stat .metric-bad { color: var(--bad); }
  .topology { border: 1px solid var(--line); border-radius: 14px; background: var(--canvas); }
  .map-header { display: flex; gap: 10px 18px; align-items: center; flex-wrap: wrap; padding: 13px 16px; border-bottom: 1px solid var(--line); }
  .map-header h2 { font-size: 16px; margin: 0 auto 0 0; }
  .map-controls { display: flex; flex-wrap: wrap; gap: 8px; }
  .map-controls input, .map-controls select { width: auto; min-width: 0; }
  .map-controls input { width: 178px; }
  .map-controls button { display: inline-flex; gap: 7px; align-items: center; }
  .map-canvas {
    position: relative; display: grid; justify-items: center; gap: 28px; padding: 22px 16px 17px;
    background-image: radial-gradient(var(--canvas-dot) 1px, transparent 1px); background-size: 18px 18px;
  }
  .map-wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .map-wires path { fill: none; stroke: var(--wire); stroke-width: 1.3; stroke-dasharray: 4 4; }
  .map-wires path.ok { stroke: var(--ok); }
  .map-wires path.warn { stroke: var(--warn); }
  .map-wires path.bad { stroke: var(--bad); }
  .map-root { position: relative; z-index: 1; min-width: 210px; padding: 11px 15px; display: flex; gap: 10px; align-items: center; border-radius: 12px; border: 1px solid var(--node-ok); background: var(--accent-soft); }
  .map-root b, .map-root small { display: block; }
  .map-root small { color: var(--muted); }
  .map-grid { position: relative; display: grid; width: 100%; gap: 25px 12px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .map-grid.single { width: min(270px, 100%); grid-template-columns: minmax(0, 1fr); padding: 0; }
  .map-node { position: relative; text-align: left; padding: 11px 12px 9px; min-width: 0; border-radius: 11px; border-color: var(--line); white-space: normal; }
  .map-node.ok { border-color: var(--node-ok); }
  .map-node.warn { border-color: var(--node-warn); }
  .map-node.bad { border-color: var(--node-bad); }
  .map-node[aria-expanded=true] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
  .map-node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .node-top { display: flex; gap: 6px; justify-content: space-between; align-items: flex-start; }
  .node-top b { overflow-wrap: anywhere; }
  .node-address { display: block; color: var(--muted); font-size: 11px; margin: 2px 0 7px; overflow-wrap: anywhere; }
  .node-metric { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; min-height: 23px; }
  .node-metric strong { color: var(--ok); font-family: var(--mono); font-size: 15px; }
  .node-metric span { color: var(--muted); font-size: 11px; }
  .node-footer { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 6px; display: flex; flex-wrap: wrap; gap: 2px 10px; color: var(--muted); font-size: 11px; }
  .node-top .badge, .map-legend span { display: inline-flex; gap: 5px; align-items: center; }
  .node-top .badge::before, .map-legend span::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .node-footer b { color: var(--ink); font-weight: 600; }
  .map-footer { display: flex; justify-content: space-between; gap: 6px 18px; flex-wrap: wrap; padding: 9px 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .map-legend { display: flex; flex-wrap: wrap; gap: 4px 13px; }
  .map-legend .ok { color: var(--ok); }
  .map-legend .warn { color: var(--warn); }
  .map-legend .bad, .map-update.bad { color: var(--bad); }
  .map-update { font-variant-numeric: tabular-nums; }
  .probe-details summary { cursor: pointer; white-space: nowrap; }
  .probe-details ul { margin: 6px 0 0; padding-left: 17px; min-width: 180px; }
  .probe-table td:first-child { min-width: 115px; }
  .probe-table td:last-child { min-width: 130px; }
  .table-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
  .table-toolbar input, .table-toolbar select { width: auto; max-width: 100%; }
  .pool-stats { display: flex; flex-wrap: wrap; }
  .pool-stats .stat { flex: 1 0 115px; }
  .pool-stats .stat + .stat { border-left: 0; }
  .pool-stats .stat:not(:last-child) { border-right: 1px solid var(--line); }
  .pool-stats .stat:nth-child(n+3) { border-top: 0; }
  .map-empty { position: relative; width: 100%; background: var(--panel); border-radius: 8px; }
  .inspector { margin: 20px 0; padding: 14px 16px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--canvas); }
  .inspector-head { display: flex; flex-wrap: wrap; gap: 7px 12px; align-items: center; margin-bottom: 12px; }
  .inspector-head h2 { margin: 0 auto 0 0; font-size: 17px; overflow-wrap: anywhere; }
  .inspector-head .badge { vertical-align: middle; margin-left: 5px; }
  .inspector .tcard h3 { margin-top: 0; }
  .inspector .ip-heading { margin: 14px 0 8px; justify-content: space-between; }
  .inspector .ip-heading h3 { margin: 0; }
  .map-controls button[aria-busy=true] { color: var(--muted); cursor: progress; }
  .inspector h3 { margin: 15px 0 8px; font-size: 14px; }
  .tcard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
  .tcard.ok { border-color: var(--node-ok); }
  .tcard.bad { border-color: var(--node-bad); }
  .tcard.warn { border-color: var(--node-warn); }
  .tgrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(200px, 100%), 1fr)); }
  .thead { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); }
  .ttitle { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .ttitle b { font-family: var(--mono); overflow-wrap: anywhere; }
  .line { color: var(--muted); font-size: 12px; margin-top: 3px; overflow-wrap: anywhere; }
  .probe { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line); }
  .target { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; margin-top: 0; }
  .hist { display: flex; gap: 2px; margin-top: 4px; flex-wrap: wrap; }
  .hist i { width: 6px; height: 9px; border-radius: 1px; background: var(--ok); }
  .hist i.f { background: var(--bad); }
  .alerts { display: grid; gap: 6px; padding-top: 10px; }
  .alert-box { margin-top: 20px; }
  .alert-box summary { cursor: pointer; font-weight: 650; }
  .alert a { display: inline-block; margin-left: 6px; }
  .stat a { color: inherit; text-decoration: underline; }
  #inspector-title:focus { outline-offset: 4px; }
  .alert { border-radius: 8px; padding: 8px 12px; border: 1px solid var(--line); background: var(--warn-soft); }
  .alert.critical { background: var(--bad-soft); }
  .extra { margin-top: 21px; }

  @media (min-width: 1600px) {
    .map-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  }
  @media (max-width: 1100px) {
    .map-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 820px) {
    .shell { grid-template-columns: minmax(0, 1fr); }
    nav.side { position: static; height: auto; overflow: visible; border-right: 0; border-bottom: 1px solid var(--line); padding: 10px 12px; }
    nav.side .brand { margin: 0 4px 8px; }
    .nav-links { flex-direction: row; overflow-x: auto; padding: 2px; }
    .nav-divider { display: none; }
    header.top, .content { padding-inline: 14px; }
  }
  @media (max-width: 540px) {
    .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stat:nth-child(3) { border-left: 0; }
    .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
    .map-controls { display: grid; grid-template-columns: minmax(0, 1fr) auto; width: 100%; }
    .map-controls input { width: 100%; grid-column: 1 / -1; }
    .map-grid { grid-template-columns: minmax(0, 1fr); padding-left: 18px; gap: 12px; }
    .node-top .badge { white-space: normal; }
    .map-canvas { padding-inline: 12px; }
    header.top h1 { font-size: 20px; }
  }

  /* overlays */
  .overlay { position: fixed; inset: 0; background: rgba(15, 20, 30, .45); display: flex; align-items: flex-start; justify-content: center; padding: 8vh 16px 16px; z-index: 20; overflow-y: auto; }
  .modal { background: var(--panel); border-radius: 12px; width: 100%; max-width: 520px; padding: 18px 20px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .modal h3 { margin: 0 0 14px; font-size: 16px; }
  .modal .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .modal .err { color: var(--bad); font-size: 13px; min-height: 1.3em; }
  .secret { font-family: var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 10px; overflow-wrap: anywhere; user-select: all; }
  .os-tabs { display: flex; gap: 6px; margin: 10px 0 4px; }
  .os-tabs button[aria-selected="true"] { background: var(--accent, #2563eb); color: #fff; border-color: transparent; }
  .install-row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
  .install-row .form-row { flex: 1 1 200px; margin: 0; }
  .install-cmd { display: flex; gap: 6px; align-items: flex-start; }
  .install-cmd pre { flex: 1; min-width: 0; }
  pre.snippet { font-family: var(--mono); font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 10px; white-space: pre-wrap; overflow-wrap: anywhere; user-select: all; margin: 8px 0 0; }
  .toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 30; max-width: calc(100vw - 32px); }
  .toast { background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.2); max-width: 420px; }
  .toast.bad { background: var(--bad-soft); color: var(--bad); border: 1px solid var(--node-bad); }

  /* login */
  .login { max-width: 360px; margin: 14vh auto; padding: 0 16px; }
  .login .card { padding: 22px; }
  .login h1 { font-size: 22px; margin: 0 0 4px; }
  .login .brand-mark { margin-bottom: 14px; }
  .appearance { flex: none; width: auto; font-size: 12px; }
  .login .appearance { float: right; }
  .badge.info { background: var(--idle-soft); color: var(--ink); }
  .badge { font-weight: 550; }
  .actions button:focus-visible { outline-offset: 0; }
  @media (max-width: 540px) {
    header.top { flex-wrap: wrap; gap: 8px; }
    header.top h1 { flex-basis: 100%; }
    #who { max-width: none; flex: 1; }
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="login" class="login" hidden>
  <form class="card" id="login-form">
    <select class="appearance" aria-label="Appearance"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select>
    <span class="brand-mark" data-icon="topology"></span><h1>CC Proxy Console</h1>
    <p class="muted small" style="margin:0 0 16px">Sign in with an administrator account.</p>
    <div class="form-row"><label for="l-user">Username</label><input id="l-user" autocomplete="username" required></div>
    <div class="form-row"><label for="l-pass">Password</label><input id="l-pass" type="password" autocomplete="current-password" required></div>
    <div class="err small" id="l-err" role="alert" style="color:var(--bad);min-height:1.4em"></div>
    <button class="primary" style="width:100%;margin-top:6px" type="submit">Sign in</button>
  </form>
</div>

<div id="app" class="shell" hidden>
  <nav class="side" aria-label="Main navigation">
    <a class="brand" href="#/"><span class="brand-mark" data-icon="topology"></span>CC Proxy</a>
    <div class="nav-links">
      <a href="#/" data-nav="overview"><span data-icon="topology"></span>Topology</a>
      <a href="#/hosts" data-nav="hosts"><span data-icon="server"></span>Hosts</a>
      <a href="#/ips" data-nav="ips"><span data-icon="ips"></span>Egress IPs</a>
      <a href="#/users" data-nav="users"><span data-icon="users"></span>Users</a>
      <a href="#/alerts" data-nav="alerts"><span data-icon="bell"></span>Alerts <span class="count" id="alert-count" hidden></span></a>
      <hr class="nav-divider">
      <a href="#/settings" data-nav="settings"><span data-icon="settings"></span>Settings</a>
      <a href="#/audit" data-nav="audit"><span data-icon="log"></span>Audit log</a>
      <a href="#/admins" data-nav="admins"><span data-icon="shield"></span>Administrators</a>
    </div>
  </nav>
  <main class="main">
    <header class="top">
      <h1 id="title">Network topology</h1>
      <span class="muted small" id="who"></span>
      <select class="appearance" aria-label="Appearance"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select>
      <button id="logout" type="button">Sign out</button>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(() => {
  "use strict";
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const STALE = 180;
  let csrf = null, me = null, timer = null, routeToken = 0, stopObserving = null;
  const ICONS = {
    topology: '<rect x="9" y="2" width="6" height="5" rx="1"/><path d="M12 7v5M5 17v-5h14v5"/><rect x="2" y="17" width="6" height="5" rx="1"/><rect x="16" y="17" width="6" height="5" rx="1"/>',
    server: '<rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01"/>',
    ips: '<rect x="3" y="7" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/>',
    users: '<circle cx="9" cy="7" r="3"/><path d="M2 21v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2M17 4a3 3 0 0 1 0 6m2 4a5 5 0 0 1 3 5v2"/>',
    bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 12a2 2 0 0 0 4 0"/>',
    settings: '<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.5" fill="var(--sidebar)"/><circle cx="15" cy="17" r="2.5" fill="var(--sidebar)"/>',
    log: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6m-6 4h6m-6 4h4"/>',
    shield: '<path d="m12 2 8 3v6c0 6-4 9-8 11-4-2-8-5-8-11V5z"/><path d="m9 12 2 2 4-4"/>',
    refresh: '<path d="M20 10a8 8 0 1 0-1 7M20 4v6h-6"/>',
  };
  const icon = (name) => '<svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">' + ICONS[name] + "</svg>";
  $$("[data-icon]").forEach((item) => { item.innerHTML = icon(item.dataset.icon); });
  appearance.bind();

  function stopUpdates() {
    clearInterval(timer);
    stopObserving?.();
    stopObserving = null;
  }

  // ---- helpers --------------------------------------------------------------------------------------------
  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  const enc = encodeURIComponent;
  const fmtTime = (t) => (t ? new Date(t * 1000).toLocaleString(undefined, { hour12: false }) : "—");
  function ago(sec) {
    if (sec == null) return "—";
    sec = Math.max(0, Math.round(sec));
    if (sec < 60) return sec + " s ago";
    if (sec < 3600) return Math.round(sec / 60) + " min ago";
    if (sec < 86400) return Math.round(sec / 3600) + " h ago";
    return Math.round(sec / 86400) + " d ago";
  }
  const ms = (v) => (v == null ? "—" : v < 1 ? "<1 ms" : Math.round(v) + " ms");
  const hist = (h) => '<div class="hist" title="Last ' + h.length + ' samples">' + h.map((ok) => '<i class="' + (ok ? "" : "f") + '"></i>').join("") + "</div>";
  const IP_STATUS = { assigned: ["Assigned", "info"], available: ["Available", ""], cooldown: ["Cooling down", "warn"], banned: ["Banned", "bad"] };
  const ipBadge = (s) => '<span class="badge ' + (IP_STATUS[s] || ["", ""])[1] + '">' + esc((IP_STATUS[s] || [s])[0]) + "</span>";
  const now = () => Date.now() / 1000;

  function toast(text, bad) {
    const el = document.createElement("div");
    el.className = "toast" + (bad ? " bad" : "");
    el.textContent = text;
    $("#toasts").appendChild(el);
    setTimeout(() => el.remove(), bad ? 6000 : 3000);
  }

  class ApiError extends Error {}

  async function api(method, path, body) {
    const opts = { method, headers: {}, credentials: "same-origin", cache: "no-store" };
    if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
    if (method !== "GET" && csrf) opts.headers["X-CSRF-Token"] = csrf;
    let resp;
    try { resp = await fetch(path, opts); } catch (e) { throw new ApiError("Could not reach the control plane: " + e.message); }
    let data = null;
    try { data = await resp.json(); } catch (e) { /* empty body */ }
    if (resp.status === 401 && path !== "/admin/session") { showLogin("Your session expired. Sign in again."); throw new ApiError("Signed out"); }
    if (!resp.ok) throw new ApiError((data && data.error) || "HTTP " + resp.status);
    return data;
  }

  // Wrap an action: report errors as toasts, success optionally.
  async function act(fn, okText) {
    try { const r = await fn(); if (okText) toast(okText); return r; }
    catch (e) { if (e.message !== "Signed out") toast(e.message, true); return undefined; }
  }

  // ---- modals ---------------------------------------------------------------------------------------------
  function overlay(html) {
    const ov = document.createElement("div");
    ov.className = "overlay";
    ov.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + "</div>";
    document.body.appendChild(ov);
    const close = () => ov.remove();
    ov.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
    return { ov, close };
  }

  /* fields: [{name, label, type: text|password|number|select|textarea|checkbox, value, options:[[v,label]], hint, placeholder, required}]
     onSubmit(values) may throw; its return value resolves the promise. */
  function form(title, fields, onSubmit, submitText = "Save") {
    return new Promise((resolve) => {
      const rows = fields.map((f, i) => {
        const id = "f" + i, req = f.required ? " required" : "";
        let input;
        if (f.type === "select") {
          input = '<select id="' + id + '" name="' + f.name + '">' + f.options.map(([v, l]) =>
            '<option value="' + esc(v) + '"' + (String(v) === String(f.value ?? "") ? " selected" : "") + ">" + esc(l) + "</option>").join("") + "</select>";
        } else if (f.type === "textarea") {
          input = '<textarea id="' + id + '" name="' + f.name + '" placeholder="' + esc(f.placeholder || "") + '"' + req + ">" + esc(f.value ?? "") + "</textarea>";
        } else if (f.type === "checkbox") {
          return '<div class="form-row check"><label><input type="checkbox" id="' + id + '" name="' + f.name + '"' + (f.value ? " checked" : "") + "> " + esc(f.label) + "</label>" + (f.hint ? '<div class="hint">' + esc(f.hint) + "</div>" : "") + "</div>";
        } else {
          input = '<input id="' + id + '" name="' + f.name + '" type="' + (f.type || "text") + '" value="' + esc(f.value ?? "") + '" placeholder="' + esc(f.placeholder || "") + '"' + req + (f.type === "password" ? ' autocomplete="new-password"' : "") + ">";
        }
        return '<div class="form-row"><label for="' + id + '">' + esc(f.label) + "</label>" + input + (f.hint ? '<div class="hint">' + esc(f.hint) + "</div>" : "") + "</div>";
      }).join("");
      const { ov, close } = overlay('<h3>' + esc(title) + '</h3><form novalidate>' + rows + '<div class="err" role="alert"></div><div class="buttons"><button type="button" data-cancel>Cancel</button><button class="primary" type="submit">' + esc(submitText) + "</button></div></form>");
      const formEl = $("form", ov);
      $("[data-cancel]", ov).onclick = () => { close(); resolve(undefined); };
      formEl.onsubmit = async (e) => {
        e.preventDefault();
        if (!formEl.reportValidity()) return;
        const values = {};
        fields.forEach((f, i) => {
          const el = $("#f" + i, ov);
          values[f.name] = f.type === "checkbox" ? el.checked : el.value.trim();
        });
        const btn = $("button[type=submit]", ov);
        btn.disabled = true;
        try { const r = await onSubmit(values); close(); resolve(r === undefined ? true : r); }
        catch (err) { $(".err", ov).textContent = err.message; btn.disabled = false; }
      };
      const first = $("input,select,textarea", ov); if (first) first.focus();
    });
  }

  function confirmBox(title, text, okText = "Confirm", danger = true) {
    return new Promise((resolve) => {
      const { ov, close } = overlay("<h3>" + esc(title) + "</h3><p>" + text + '</p><div class="buttons"><button type="button" data-no>Cancel</button><button type="button" class="' + (danger ? "danger" : "primary") + '" data-yes>' + esc(okText) + "</button></div>");
      $("[data-no]", ov).onclick = () => { close(); resolve(false); };
      $("[data-yes]", ov).onclick = () => { close(); resolve(true); };
      $("[data-yes]", ov).focus();
    });
  }

  // Show a credential exactly once (it cannot be retrieved later).
  function reveal(title, label, secret, extraHtml = "") {
    const { ov, close } = overlay("<h3>" + esc(title) + '</h3><p class="small muted">' + esc(label) + ' (shown once. Save it now.)</p><div class="secret" id="secret">' + esc(secret) + "</div>" + extraHtml +
      '<div class="buttons"><button type="button" data-copy>Copy</button><button type="button" class="primary" data-ok>Done</button></div>');
    $("[data-copy]", ov).onclick = async () => {
      try { await navigator.clipboard.writeText(secret); toast("Copied"); } catch (e) { toast("Could not copy. Select the value and copy it manually.", true); }
    };
    $("[data-ok]", ov).onclick = close;
    return ov;
  }

  // ---- auth -----------------------------------------------------------------------------------------------
  function showLogin(msg) {
    stopUpdates();
    routeToken++;
    csrf = null; me = null;
    $("#app").hidden = true;
    $("#login").hidden = false;
    $("#l-err").textContent = msg || "";
    $("#l-user").focus();
  }

  async function boot() {
    try {
      const s = await api("GET", "/admin/session");
      csrf = s.csrf; me = s.admin;
      start();
    } catch (e) { showLogin(); }
  }

  function start() {
    $("#login").hidden = true;
    $("#app").hidden = false;
    $("#who").textContent = me;
    route();
  }

  $("#login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("#l-err").textContent = "";
    try {
      const s = await api("POST", "/admin/session", { username: $("#l-user").value.trim(), password: $("#l-pass").value });
      csrf = s.csrf; me = s.admin;
      $("#l-pass").value = "";
      start();
    } catch (err) { $("#l-err").textContent = err.message === "wrong username or password" ? "Incorrect username or password." : err.message; }
  });
  $("#logout").onclick = async () => { await act(() => api("DELETE", "/admin/session")); showLogin("Signed out."); };

  // ---- router ---------------------------------------------------------------------------------------------
  const PAGES = {};
  function route() {
    stopUpdates();
    const parts = (location.hash.split("?")[0].replace(/^#\/?/, "")).split("/").map(decodeURIComponent);
    const page = parts[0] || "overview";
    const fn = PAGES[page] || PAGES.overview;
    $$("[data-nav]").forEach((link) => {
      const active = link.dataset.nav === (PAGES[page] ? page : "overview");
      link.classList.toggle("active", active);
      if (active) link.setAttribute("aria-current", "page");
      else link.removeAttribute("aria-current");
    });
    const token = ++routeToken;
    $("#view").innerHTML = '<div class="empty">Loading…</div>';
    fn(parts.slice(1), token).catch((e) => { if (token === routeToken && e.message !== "Signed out") $("#view").innerHTML = '<div class="empty">Could not load: ' + esc(e.message) + "</div>"; });
  }
  window.addEventListener("hashchange", () => { if (me) route(); });
  const setTitle = (t) => { $("#title").textContent = t; document.title = t + " · CC Proxy"; };
  const current = (token) => token === routeToken;
  function refreshEvery(sec, fn, token) { timer = setInterval(() => { if (current(token)) fn(); }, sec * 1000); }

  function updateAlertCount(alerts) {
    const n = alerts.filter((a) => a.state === "firing").length;
    $("#alert-count").hidden = !n;
    $("#alert-count").textContent = n;
  }

  // Entry and exit probe status use the same freshness window as the console.
  function probeHealth(probes, time) {
    const recent = probes.filter((probe) => time - probe.at <= STALE);
    const reachable = recent.filter((probe) => probe.ok);
    const best = reachable.reduce((fastest, probe) => {
      if (probe.latency_ms == null) return fastest;
      return !fastest || probe.latency_ms < fastest.latency_ms ? probe : fastest;
    }, null);
    if (!probes.length) return { tone: "", label: "No data", best };
    if (!recent.length) return { tone: "warn", label: "Stale probes", best };
    if (!reachable.length) return { tone: "bad", label: "Unreachable", best };
    if (reachable.length !== probes.length) return { tone: "warn", label: "Partial coverage", best };
    return { tone: "ok", label: "Reachable", best };
  }

  function agentHealth(agent) {
    if (!agent) return { tone: "", label: "No heartbeat" };
    if (agent.age >= STALE) return { tone: "bad", label: "Agent offline" };
    if (agent.singbox_running === false) return { tone: "bad", label: "sing-box stopped" };
    if (!agent.in_sync && agent.apply_state === "unknown") return { tone: "warn", label: "Apply unconfirmed" };
    if (agent.apply_error && !agent.in_sync) return { tone: "bad", label: "Apply failed" };
    return agent.in_sync ? { tone: "ok", label: "Synced" } : { tone: "warn", label: "Sync pending" };
  }

  function hostHealth(agent, entry, failedIps) {
    if (agent.tone === "bad") return agent;
    if (entry.tone === "bad") return entry;
    if (failedIps) return { tone: "bad", label: "Egress failure" };
    if (agent.tone === "warn") return agent;
    if (entry.tone === "warn") return entry;
    if (!agent.tone) return agent;
    return entry.tone === "ok" ? { tone: "ok", label: "Healthy" } : { tone: "", label: "No probes" };
  }

  const statusBadge = ({ tone, label }) => `<span class="badge ${tone}">${label}</span>`;
  const endpoint = (host, port) => port ? `${host.includes(":") ? "[" + host + "]" : host}:${port}` : host;
  const metric = (label, value, detail = "", color = "") => `<div class="stat"><span>${label}</span><b class="${color}">${value}</b>${detail ? "<span>" + detail + "</span>" : ""}</div>`;

  function entryProbes(entry, time) {
    if (!entry) return '<p class="line">This host has no active entry port. Assign a user to start probing the entry.</p>';
    const health = probeHealth(entry.probes, time);
    const rows = entry.probes.map((probe) => {
      const status = time - probe.at > STALE ? { tone: "warn", label: "Stale" } :
        probe.ok ? { tone: "ok", label: "Reachable" } : { tone: "bad", label: "Unreachable" };
      return `<tr><td>${esc(probe.source)}</td><td>${probe.ok ? ms(probe.latency_ms) : "—"}</td>
        <td>${statusBadge(status)}${probe.ok || !probe.detail ? "" : '<div class="line">' + esc(probe.detail) + "</div>"}</td>
        <td>${ago(time - probe.at)}</td><td>${hist(probe.history)}</td></tr>`;
    });
    return `<p class="line mono">${esc(endpoint(entry.host, entry.port))} ${statusBadge(health)}</p>` + (rows.length ?
      '<div class="table-wrap"><table class="probe-table"><thead><tr><th>Location</th><th>Latency</th><th>Status</th><th>Last probe</th><th>History</th></tr></thead><tbody>' +
      rows.join("") + '</tbody></table></div>' : '<p class="line">No probes have reported yet.</p>');
  }

  function ipCard(ip, time) {
    const health = ipProbeHealth(ip.probes, time);
    const users = ip.users.map((user) => `<a href="#/users/${enc(user)}">${esc(user)}</a> <span class="mono">:${esc(ip.ports[user])}</span>`).join(", ");
    const rows = ip.probes.map((probe) => {
      const tone = time - probe.at > STALE ? "warn" : probe.ok ? "ok" : "bad";
      const delay = probe.ok ? ms(probe.latency_ms) : "Failed";
      const label = tone === "warn" ? delay + " · stale" : delay;
      return `<div class="probe"><div class="ttitle"><span class="line mono target" title="${esc(probe.target)}">${esc(probe.target.replace(/^https?:\/\//, ""))}</span>
        ${statusBadge({ tone, label })}</div>
        ${probe.ok || !probe.detail ? "" : '<div class="line">' + esc(probe.detail) + "</div>"}
        <div class="line">${ago(time - probe.at)}${hist(probe.history)}</div></div>`;
    });
    return `<article class="tcard ${health.tone}"><div class="ttitle"><b>${esc(ip.ip)}</b>${ipBadge(ip.status)}</div>
      <div class="line">${users || "No users"}${ip.users.length > 1 ? " (shared)" : ""} · ${ip.devices} ${ip.devices === 1 ? "device" : "devices"}</div>
      ${ip.note ? '<div class="line">' + esc(ip.note) + "</div>" : ""}
      ${rows.join("") || '<div class="line">No probe results yet.</div>'}</article>`;
  }

  function ipProbeHealth(probes, time) {
    if (probes.some((probe) => !probe.ok && time - probe.at <= STALE)) return { tone: "bad", label: "Failed" };
    const health = probeHealth(probes, time);
    return health.tone === "ok" ? { tone: "ok", label: "Healthy" } : health;
  }

  function topologyHosts(topology) {
    const agents = new Map(topology.agents.map((agent) => [agent.name, agent]));
    const entries = new Map(topology.entries.filter((entry) => entry.kind === "host").map((entry) => [entry.name, entry]));
    const ipsByHost = new Map();
    for (const ip of topology.ips) {
      if (!ipsByHost.has(ip.host)) ipsByHost.set(ip.host, []);
      ipsByHost.get(ip.host).push(ip);
    }
    return topology.hosts.map((host) => {
      const ips = ipsByHost.get(host.name) || [];
      const entry = entries.get(host.name);
      const agent = agents.get(host.name);
      const entryState = probeHealth(entry?.probes || [], topology.now);
      const failedIps = ips.filter((ip) => ipProbeHealth(ip.probes, topology.now).tone === "bad").length;
      return {
        host, ips, entry, entryState, agent, failedIps,
        devices: ips.reduce((total, ip) => total + ip.devices, 0),
        health: hostHealth(agentHealth(agent), entryState, failedIps),
      };
    });
  }

  function nodeCard(node, selected) {
    const { host, entry, entryState, health } = node;
    const best = entryState.best;
    return `<button class="map-node ${health.tone}" data-node="${esc(host.name)}" data-tone="${health.tone}"
      type="button" aria-controls="host-inspector" aria-expanded="${host.name === selected}">
      <span class="node-top"><b>${esc(host.name)}</b>${statusBadge(health)}</span>
      <span class="node-address mono">${esc(publicEntryLabel(host, entry?.port))}</span>
      <span class="node-metric">${best ? '<strong>' + ms(best.latency_ms) + '</strong><span>' + esc(best.source) + '</span>' :
        '<span>No current latency</span>'}</span>
      <span class="node-footer"><span><b>${node.ips.length}</b> ${node.ips.length === 1 ? "IP" : "IPs"}</span>
        <span><b>${host.users}</b> ${host.users === 1 ? "user" : "users"}</span>
        <span><b>${node.devices}</b> ${node.devices === 1 ? "device" : "devices"}</span></span>
    </button>`;
  }

  // Draw a bus across each rendered row. Recompute it when the grid reflows.
  function drawWires(canvas, root, grid, wires) {
    const rect = canvas.getBoundingClientRect();
    const rootRect = root.getBoundingClientRect();
    const center = (bounds) => Math.round(bounds.left - rect.left + bounds.width / 2);
    const rootX = center(rootRect);
    const rows = new Map();
    for (const node of grid.querySelectorAll(".map-node")) {
      const bounds = node.getBoundingClientRect();
      const y = Math.round(bounds.top - rect.top);
      if (!rows.has(y)) rows.set(y, []);
      rows.get(y).push({ x: center(bounds), tone: node.dataset.tone });
    }
    if (!rows.size) { wires.replaceChildren(); return; }
    const tracks = Array.from(rows.keys());
    const rootY = Math.round(rootRect.bottom - rect.top);
    const oneColumn = rows.size > 1 && rows.size === grid.children.length;
    const trunkX = oneColumn ? 15 : rootX;
    const rise = oneColumn ? 8 : 14;
    const firstBus = tracks[0] - rise;
    const lastBus = tracks.at(-1) - rise;
    const stem = `M ${rootX} ${rootY} V ${firstBus} H ${trunkX} V ${lastBus}`;
    const paths = [`<path d="${stem}"></path>`];
    for (const [y, row] of rows) {
      const busY = y - rise;
      const positions = [trunkX, ...row.map((node) => node.x)];
      paths.push(`<path d="M ${Math.min(...positions)} ${busY} H ${Math.max(...positions)}"></path>`);
      for (const node of row) paths.push(`<path class="${node.tone}" d="M ${node.x} ${busY} V ${y}"></path>`);
    }
    wires.innerHTML = paths.join("");
  }

  function inspector(node, time) {
    const { host, agent, health } = node;
    return `<div class="inspector-head">
      <h2 id="inspector-title" tabindex="-1">${esc(host.name)} ${statusBadge(health)}</h2>
      <a href="#/hosts/${enc(host.name)}">Manage host</a><button type="button" id="close-inspector">Close</button>
      </div><div class="thead">
        <section class="tcard"><h3>Agent status</h3>
          <dl class="kv"><dt>Status</dt><dd>${statusBadge(agentHealth(agent))}</dd>
            <dt>Last heartbeat</dt><dd>${agent ? ago(agent.age) : "—"}</dd>
            <dt>Installed config</dt><dd class="mono small">${esc(agent?.config_etag || "—")}</dd></dl>
          ${agent?.apply_error && !agent.in_sync ? '<p class="line">' + esc(agent.apply_error) + "</p>" : ""}
        </section>
        <section class="tcard"><h3>Entry probes</h3>${entryProbes(node.entry, time)}</section>
      </div>
      <div class="inspector-head ip-heading"><h3>Egress IPs (${node.ips.length})</h3><a href="#/ips?host=${enc(host.name)}">Open IP inventory</a></div>
      ${node.ips.length ? '<div class="tgrid">' + node.ips.map((ip) => ipCard(ip, time)).join("") + "</div>" :
        '<p class="line">This host has no egress IPs.</p>'}`;
  }

  PAGES.overview = async (_, token) => {
    setTitle("Network topology");
    $("#view").innerHTML = `
      <div id="topology-stats" class="summary" aria-label="Network summary" hidden></div>
      <section class="topology" aria-labelledby="map-title">
        <div class="map-header">
          <h2 id="map-title">Egress hosts</h2>
          <div class="map-controls">
            <input id="host-search" type="search" aria-label="Find a host" placeholder="Find a host">
            <select id="health-filter" aria-label="Host health">
              <option value="all">All states</option><option value="attention">Needs attention</option>
              <option value="bad">Failed</option><option value="warn">Warning</option>
              <option value="ok">Healthy</option><option value="unknown">No data</option>
            </select>
            <button id="refresh-map" type="button">${icon("refresh")} Refresh</button>
          </div>
        </div>
        <div class="map-canvas">
          <svg class="map-wires" aria-hidden="true"></svg>
          <div class="map-root" hidden><span class="brand-mark">${icon("topology")}</span><div><b>Control plane</b><small id="host-count"></small></div></div>
          <div id="node-grid" class="map-grid" role="group" aria-label="Egress hosts"></div>
          <div id="map-empty" class="map-empty empty" role="status">Loading topology…</div>
        </div>
        <div class="map-footer">
          <div class="map-legend"><span class="ok">Healthy</span><span class="warn">Warning</span><span class="bad">Failed</span><span>No data</span></div>
          <span id="map-update" class="map-update"></span>
        </div>
      </section>
      <section id="host-inspector" class="inspector" aria-labelledby="inspector-title" hidden></section>
      <details id="alert-box" class="card alert-box" hidden>
        <summary id="alert-summary">Active alerts</summary><div id="topology-alerts" class="alerts"></div>
      </details>

    const canvas = $(".map-canvas"), root = $(".map-root"), grid = $("#node-grid"), wires = $(".map-wires");

    const panel = $("#host-inspector"), empty = $("#map-empty"), updated = $("#map-update");
    let topology, hosts = [], selected = "", renderedNodes = "", renderedInspector = "", lastUpdate = "", loading = false;
    const observer = new ResizeObserver(() => drawWires(canvas, root, grid, wires));

    const nodeButton = (name) => Array.from(grid.children).find((button) => button.dataset.node === name);
    const syncSelection = () => {
      const node = hosts.find(({ host }) => host.name === selected);

      panel.hidden = !node;
      if (!node) {
        if (focused) search.focus({ preventScroll: true });
        return;
      }
      const markup = inspector(node, topology.now);
      if (renderedInspector === markup) return;
      panel.innerHTML = markup;
      renderedInspector = markup;
      if (focused) {
        const match = Array.from(panel.querySelectorAll("[id], a")).find((item) =>

    const select = (name) => {

    const draw = () => {
      if (!topology) return;
      const query = search.value.trim().toLowerCase();
      const state = filter.value;
      const visible = hosts.filter(({ host, ips, health }) => {
        const matchesState = state === "all" || state === (health.tone || "unknown") ||
          (state === "attention" && (health.tone === "bad" || health.tone === "warn"));
        return matchesState && (!query || host.name.toLowerCase().includes(query) ||
          host.public_host.toLowerCase().includes(query) || ips.some((ip) => ip.ip.includes(query)));
      });
      if (!visible.some(({ host }) => host.name === selected)) selected = "";
      const focused = grid.contains(document.activeElement) ? document.activeElement.dataset.node : null;
      const html = visible.map((node) => nodeCard(node, selected)).join("");
      grid.hidden = !visible.length;
      grid.classList.toggle("single", visible.length === 1);
      if (renderedNodes !== html) {
        grid.innerHTML = html;
        renderedNodes = html;
        if (focused) (nodeButton(focused) || search).focus({ preventScroll: true });
      }
      root.hidden = false;
      $("#host-count").textContent = `${visible.length} of ${hosts.length} hosts`;
      empty.hidden = !!visible.length;
      empty.innerHTML = hosts.length ? "No hosts match these filters." : 'No egress hosts yet. <a href="#/hosts">Add a host</a>';

    const load = async () => {
      if (loading || !current(token)) return;

        const alertsPanel = $("#topology-alerts");

        $("#alert-summary").textContent = `Active alerts (${alerts.length})`;
        alertsPanel.innerHTML = alerts.map((alert) => `<div class="alert ${alert.severity === "critical" ? "critical" : ""}">

        $("#topology-stats").hidden = false;
        $("#topology-stats").innerHTML = [
          metric("Egress hosts", hosts.length, hosts.filter((node) => node.health.tone === "ok").length + " healthy"),
          metric("Egress IPs", data.ips.length, data.ips.filter((ip) => ip.status === "assigned").length + " assigned"),
          metric("Reachable entries", data.entries.length ? reachable + " / " + data.entries.length : "—", "Recent successful probes"),
          metric("Active alerts", alerts.length ? '<a href="#/alerts" aria-label="View ' + alerts.length + ' active alerts">' + alerts.length + '</a>' : 0,
            "", alerts.length ? "metric-bad" : ""),
        ].join("");
        const others = data.entries.filter((entry) => entry.kind === "extra");
        const otherEntries = $("#other-entries");
        const open = new Set($$("details[open]", otherEntries).map((detail) => detail.dataset.entry));
        const focusedEntry = document.activeElement.closest("details[data-entry]")?.dataset.entry;
        otherEntries.hidden = !others.length;
        $(".tgrid", otherEntries).innerHTML = others.map((entry) => `<details class="tcard" data-entry="${esc(entry.name)}" ${open.has(entry.name) ? "open" : ""}>
          <summary>${esc(entry.name)} ${statusBadge(probeHealth(entry.probes, data.now))}</summary>
          ${entryProbes(entry, data.now)}</details>`).join("");
        if (focusedEntry) $$("details", otherEntries).find((detail) => detail.dataset.entry === focusedEntry)?.querySelector("summary")?.focus({ preventScroll: true });
        draw();
        lastUpdate = new Date().toLocaleTimeString();
        updated.classList.remove("bad");
        updated.textContent = "Updated " + lastUpdate;
      } catch (error) {
        if (!current(token)) return;
        updated.classList.add("bad");
        updated.textContent = lastUpdate ? "Refresh failed · showing data from " + lastUpdate : "Refresh failed";
        if (!topology) empty.textContent = error.message + " Try Refresh.";

  // Install / uninstall commands for an exit host. The token is never part of a command: the installer asks for it
  // with hidden input. Commands come from /admin/install-commands, which accepts only an https control plane URL.
  const INSTALL_OS = [["macos", "macOS"], ["linux", "Linux"], ["windows", "Windows"]];
  // transport: the host's /admin/hosts/{name}/xtcp view ({transport: "public"} for a new host). reuseToken: the host
  // may already have an installed token (the Install command dialog; not after a rotation, where it no longer works).
  function installHelp(transport, reuseToken) {
    const token = reuseToken
      ? "then the installer asks for the agent token (hidden; press Enter to reuse the token already installed on this host)"
      : "then the installer asks for the agent token (hidden)";
    if (transport && transport.transport === "xtcp") {
      const x = transport;
      const frpc = `This host uses XTCP: the installer also downloads the pinned frpc and starts it at boot. frpc registers proxy ${x.proxy_name} with frps ${x.server_addr}:${x.server_port} (TLS verified) and forwards it to sing-box on 127.0.0.1:${x.local_port}. Clients connect directly through their XTCP visitor, so no inbound port forwarding is needed.`;
      return {
        macos: `Run in Terminal on the Mac. sudo asks for the Mac password, ${token}. ${frpc} The Mac Agent registers its default interface's IPv4 when the egress pool is empty.`,
        linux: `Run on the host. sudo asks for your password, ${token}. ${frpc} Name an interface only when the provider routes extra egress IPs to this host.`,
        windows: `Run in PowerShell started with "Run as administrator"; ${token.replace("then the installer", "the installer")}. ${frpc} frpc runs as the CCProxyExitFrpc task, with a firewall rule for its UDP hole punching.`,
      };
    }
    return {
      macos: `Run in Terminal on the Mac. sudo asks for the Mac password, ${token}. The Mac Agent registers its default interface's IPv4 when the egress pool is empty. Forward the TCP entry port range to the Mac.`,
      linux: `Run on the host. sudo asks for your password, ${token}. Name an interface only when the provider routes extra egress IPs to this host; otherwise its existing address is the egress IP.`,
      windows: `Run in PowerShell started with "Run as administrator"; ${token.replace("then the installer", "the installer")}.`,
    };

  function installPanel(root, transport = { transport: "public" }, reuseToken = false) {
    let os = "macos";
    root.innerHTML = `
      <div class="install-row">
        <div class="form-row"><label for="inst-cp">Control plane URL the host uses</label>
          <input id="inst-cp" value="${esc(location.origin)}" placeholder="https://cp.example:8443"></div>
        <div class="form-row" id="inst-iface-row" hidden><label for="inst-iface">Interface for routed egress IPs (optional)</label>
          <input id="inst-iface" placeholder="eth0"></div>

        `<button type="button" role="tab" data-os="${k}" aria-selected="${k === os}">${l}</button>`).join("")}</div>
      <p class="small muted" id="inst-how"></p>
      <div class="install-cmd"><pre class="snippet" id="inst-cmd"></pre><button type="button" data-copy-cmd="inst-cmd">Copy</button></div>
      <p class="small muted" style="margin:10px 0 0">Uninstall (stops the services and removes the files and the stored token):</p>
      <div class="install-cmd"><pre class="snippet" id="inst-uninstall"></pre><button type="button" data-copy-cmd="inst-uninstall">Copy</button></div>
      <p class="small muted" id="inst-note"></p>`;
    const how = installHelp(transport, reuseToken);
    let timer;
    let seq = 0;  // only the response to the latest request may fill the commands
    // Any change makes the shown commands stale at once: clear them and disable Copy until the new ones arrive, so a
    // quick Copy after switching OS or editing the URL can never copy the previous command.
    function invalidate() {
      seq++;
      $("#inst-cmd", root).textContent = $("#inst-uninstall", root).textContent = "";
      root.querySelectorAll("[data-copy-cmd]").forEach((b) => { b.disabled = true; });
      $("#inst-note", root).textContent = "Loading the command…";
      $("#inst-iface-row", root).hidden = os !== "linux";
      $("#inst-how", root).textContent = how[os];
      return seq;
    }
    async function refresh() {
      const mine = invalidate(), want = os;
      const q = "cp=" + encodeURIComponent($("#inst-cp", root).value.trim()) +
        (want === "linux" && $("#inst-iface", root).value.trim() ? "&iface=" + encodeURIComponent($("#inst-iface", root).value.trim()) : "");
      let cmds, error;
      try { cmds = await api("GET", "/admin/install-commands?" + q); } catch (e) { error = e; }
      if (mine !== seq || want !== os) return;  // a newer tab or input superseded this response
      if (error) { $("#inst-note", root).textContent = error.message; return; }
      $("#inst-cmd", root).textContent = cmds[want].install;
      $("#inst-uninstall", root).textContent = cmds[want].uninstall;
      $("#inst-note", root).textContent = "";
      root.querySelectorAll("[data-copy-cmd]").forEach((b) => { b.disabled = false; });
    }
    root.addEventListener("click", async (e) => {
      const tab = e.target.closest("[data-os]");
      if (tab) {
        os = tab.dataset.os;
        root.querySelectorAll("[data-os]").forEach((b) => b.setAttribute("aria-selected", String(b === tab)));
        refresh();
      }
      const copy = e.target.closest("[data-copy-cmd]");
      if (copy) {
        const text = $("#" + copy.dataset.copyCmd, root).textContent;
        if (copy.disabled || !text) return;
        try { await navigator.clipboard.writeText(text); toast("Command copied"); } catch (err) { toast("Could not copy. Select the command and copy it manually.", true); }
      }
    });
    root.addEventListener("input", () => { invalidate(); clearTimeout(timer); timer = setTimeout(refresh, 300); });
    refresh();
  }

  // Expand "a.b.c.d", "a.b.c.d-e", "a.b.c.d-a.b.c.e" and "a.b.c.d/n" (n >= 22) into addresses.
  function expandIps(text) {
    const toInt = (s) => { const p = s.split(".").map(Number); if (p.length !== 4 || p.some((x) => !(x >= 0 && x <= 255) || isNaN(x))) throw new Error("Invalid IPv4 address: " + s); return ((p[0] << 24) >>> 0) + (p[1] << 16) + (p[2] << 8) + p[3]; };
    const toStr = (n) => [n >>> 24, (n >> 16) & 255, (n >> 8) & 255, n & 255].join(".");
    const out = [];
    for (const raw of text.split(/[\s,]+/).filter(Boolean)) {
      let lo, hi;
      if (raw.includes("/")) {
        const [ip, bits] = raw.split("/"); const b = Number(bits);
        if (!(b >= 22 && b <= 32)) throw new Error("CIDR prefix must be between /22 and /32: " + raw);
        const size = 2 ** (32 - b); lo = Math.floor(toInt(ip) / size) * size; hi = lo + size - 1;
      } else if (raw.includes("-")) {
        const [a, b] = raw.split("-"); lo = toInt(a); hi = b.includes(".") ? toInt(b) : (lo - (lo & 255)) + Number(b);
        if (!(hi >= lo)) throw new Error("Invalid range: " + raw);
      } else { lo = hi = toInt(raw); }
      for (let n = lo; n <= hi; n++) { out.push(toStr(n)); if (out.length > 1024) throw new Error("Add up to 1024 addresses at a time."); }
    }
    return out;
  }
  async function addIps(host) {
    const r = await form("Add egress IPs to " + host, [{ name: "ips", label: "IP addresses", type: "textarea", required: true, placeholder: "192.0.2.3\n192.0.2.10-20\n192.0.2.64/28",
      hint: "Enter one address, last-octet range (.10-20), full range, or /22–/32 subnet per line. These addresses must already route to the host. The agent adds them to its interface." }],
    (v) => api("POST", "/admin/hosts/" + enc(host) + "/ips", { ips: expandIps(v.ips) }), "Add");
    if (r) { toast("Added " + r.added.length + " IP addresses"); route(); }
  }

  function ipTable(ips, probes, time, withHost) {
    const rows = ips.map((ip) => {
      const results = probes.get(ip.ip) || [];
      const status = ipProbeHealth(results, time);
      const probeDetails = results.map((probe) => {
        const outcome = probe.ok ? ms(probe.latency_ms) : probe.detail || "Failed";
        return `<li class="line">${esc(probe.target)} · ${esc(outcome)} · ${ago(time - probe.at)}</li>`;
      }).join("");
      const health = probeDetails ? `<details class="probe-details"><summary>${statusBadge(status)}</summary><ul>${probeDetails}</ul></details>` :
        statusBadge(status);
      const list = ip.holders || ip.users.map((user) => ({ user, port: ip.ports[user] }));
      const holders = (list.map((h) => `<a href="#/users/${enc(h.user)}">${esc(h.user)}</a><span class="mono">:${esc(h.port)}</span>`).join(", ") || "—") +
        (list.length > 1 ? ` <span class="badge info">Shared · ${list.length} users</span>` : "");
      const sharable = ip.status === "available" || (ip.status === "assigned" && list.every((h) => h.mode === "shared"));
      const actions = [
        sharable ? `<button class="link" data-ip-share="${esc(ip.ip)}" data-ip-host="${esc(ip.host)}">${ip.status === "available" ? "Assign user" : "Add holder"}</button>` : "",
        ip.status === "banned" || ip.status === "cooldown" ?
          `<button class="link" data-ip-available="${esc(ip.ip)}">${ip.status === "banned" ? "Unban" : "End cooldown"}</button>` : "",
        ip.status !== "banned" ? `<button class="link danger" data-ip-ban="${esc(ip.ip)}">Ban</button>` : "",
        !ip.users.length ? `<button class="link danger" data-ip-del="${esc(ip.ip)}">Delete</button>` : "",
      ].join("");
      const cooldown = ip.status === "cooldown" && ip.cooldown_until ? `<div class="line">Until ${fmtTime(ip.cooldown_until)}</div>` : "";
      return `<tr><td class="mono">${esc(ip.ip)}</td>
        ${withHost ? `<td><a href="#/hosts/${enc(ip.host)}">${esc(ip.host)}</a></td>` : ""}
        <td>${ipBadge(ip.status)}${cooldown}</td>
        <td>${health}</td>
        <td>${holders}</td><td class="small">${esc(ip.note)}</td><td class="actions">${actions}</td></tr>`;
    });
    return `<div class="table-wrap"><table><thead><tr><th>IP address</th>${withHost ? "<th>Host</th>" : ""}
      <th>Allocation</th><th>Probe health</th><th>Users / entry ports</th><th>Note</th><th scope="col">Actions</th>
      </tr></thead><tbody>${rows.join("") || `<tr><td colspan="${withHost ? 7 : 6}" class="empty">No egress IPs match this view.</td></tr>`}
      </tbody></table></div>`;
  }
  // Assign another user to an IP: any user for an available IP, Shared users for a shared one. A user already
  // bound elsewhere moves in one step. The entry port is chosen automatically unless one is given.
  async function addHolder(ip, hostName, onChange) {
    const [users, ips, hosts] = await act(() => Promise.all([api("GET", "/admin/users"), api("GET", "/admin/ips?host=" + enc(hostName)), api("GET", "/admin/hosts")])) || [];
    if (!users) return;
    const row = ips.find((e) => e.ip === ip) || { holders: [] };
    const h = hosts.find((x) => x.name === hostName) || { port_range: ["?", "?"], free_ports: 0 };
    const holding = new Set((row.holders || []).map((x) => x.user));
    const eligible = users.filter((u) => !holding.has(u.name) && (row.status === "available" || u.mode === "shared"));
    if (!eligible.length) {
      toast(row.status === "available" ? "No users to assign." : "No eligible users: switch a user to Shared mode first.", true);
      return;
    }
    const r = await form((row.status === "available" ? "Assign " : "Share ") + ip, [
      { name: "user", label: "User", type: "select", value: eligible[0].name, options: eligible.map((u) => [u.name, u.name + " · " + (u.mode === "shared" ? "Shared" : "Exclusive") + (u.egress_ip ? " · moves from " + u.egress_ip + ":" + u.port : "")]),
        hint: row.status === "available" ? "" : "Only Shared users can join a shared IP. Change a user's egress mode on the user page." },
      { name: "port", label: "Entry port (optional)", type: "number", placeholder: "Automatic: lowest free port", hint: "Each user needs a distinct port in " + h.port_range[0] + "–" + h.port_range[1] + " on " + hostName + " (" + h.free_ports + " free)." },
    ], (v) => {
      const u = users.find((x) => x.name === v.user);
      const body = { ip };
      if (v.port) body.port = Number(v.port);
      return api("POST", "/admin/users/" + enc(v.user) + (u && u.egress_ip ? "/reassign" : "/assign"), body);
    }, "Assign");
    if (r) { toast("Assigned " + r.user + " to " + r.egress_ip + " on entry port " + r.port + "."); await onChange(); }
  }
  function bindIpActions(onChange = route) {
    $$("[data-ip-share]").forEach((b) => b.onclick = () => addHolder(b.dataset.ipShare, b.dataset.ipHost, onChange));
    $$("[data-ip-ban]").forEach((b) => b.onclick = async () => {
      const ip = b.dataset.ipBan;

      if (r) { toast(r.released_users.length ? "Banned and released assignments for " + r.released_users.join(", ") + "." : "IP banned."); await onChange(); }
    });
    $$("[data-ip-available]").forEach((b) => b.onclick = async () => {
      if (await act(() => api("POST", "/admin/ips/" + enc(b.dataset.ipAvailable) + "/available"), "Marked available.")) await onChange();
    });
    $$("[data-ip-del]").forEach((b) => b.onclick = async () => {
      const ip = b.dataset.ipDel;
      if (!(await confirmBox("Delete " + ip, "Remove this IP from the pool. It remains on the host network interface.", "Delete"))) return;
      if (await act(() => api("DELETE", "/admin/ips/" + enc(ip)), "Deleted.")) await onChange();
    });
  }

        { name: "password", label: "New password (optional)", type: "password", hint: "Leave blank to generate a password. Use at least 8 characters." },
        { name: "revoke", label: "Revoke all devices", type: "checkbox", value: true, hint: "Devices must sign in again with the new password." },
      ], (v) => api("POST", "/admin/users/" + enc(name) + "/password", Object.assign({ revoke_devices: v.revoke }, v.password ? { password: v.password } : {})), "Reset");
      if (!r) return;
      if (r.password) reveal("New password", "New password for " + name, r.password); else toast("Password updated.");
      route();
    };
    $("#mode").onclick = async () => {
      const others = [];
      if (u.egress_ip) {
        const ips = await act(() => api("GET", "/admin/ips?host=" + enc(u.host)));
        if (!ips) return;
        const row = ips.find((e) => e.ip === u.egress_ip);
        (row ? row.holders || [] : []).forEach((h) => { if (h.user !== name) others.push(h.user + ":" + h.port); });
      }
      const hint = u.mode === "shared"
        ? (others.length ? "Exclusive is unavailable while " + others.join(", ") + " share " + u.egress_ip + ". Move or release them first." : "Exclusive keeps the current IP, entry port, and devices.")
        : "Shared keeps the current IP, entry port, and devices, and lets other Shared users join " + (u.egress_ip || "the IP this user gets") + " on their own entry ports.";
      const r = await form("Egress mode for " + name, [
        { name: "mode", label: "Egress mode", type: "select", value: u.mode, options: [["exclusive", "Exclusive: dedicated egress IP"], ["shared", "Shared: other Shared users may use the same egress IP"]], hint },
      ], (v) => v.mode === u.mode ? true : api("PUT", "/admin/users/" + enc(name), { mode: v.mode }));
      if (r) { toast("Saved."); route(); }
    };
    $("#limit").onclick = async () => {
      if (await form("Device limit", [{ name: "max", label: "Maximum active devices", type: "number", value: u.max_devices, required: true }],
        (v) => api("PUT", "/admin/users/" + enc(name), { max_devices: Number(v.max) }))) { toast("Saved."); route(); }
    };
    $("#del").onclick = async () => {
      if (!(await confirmBox("Delete user " + name, "This permanently removes the user and all devices, revokes client access immediately, and puts the egress IP into cooldown.", "Delete"))) return;
      if (await act(() => api("DELETE", "/admin/users/" + enc(name)), "Deleted.")) location.hash = "#/users";
    };
    $("#add-dev").onclick = async () => {
      const r = await form("Add headless device", [{ name: "name", label: "Device name", required: true, hint: "For scripts and servers. The token authenticates config requests." }],
        (v) => api("POST", "/admin/users/" + enc(name) + "/devices", { name: v.name }), "Add");
      if (r) { reveal("Token for " + r.device, "Send this token as Authorization: Bearer when calling GET /v1/config.", r.token); route(); }
    };
    $$("[data-revoke]").forEach((b) => b.onclick = async () => {
      if (!(await confirmBox("Revoke " + b.dataset.revoke, "The device credential expires immediately and the client disconnects and signs out.", "Revoke"))) return;
      if (await act(() => api("POST", "/admin/users/" + enc(name) + "/devices/" + enc(b.dataset.revoke) + "/revoke"), "Revoked")) route();
    });
  }

  // ---- alerts ---------------------------------------------------------------------------------------------
  const RULES = { egress_probe_failing: "Egress probe failed", entry_unreachable: "Entry unreachable", agent_stale: "Egress host offline", singbox_down: "sing-box stopped", agent_out_of_sync: "Config out of sync" };
  PAGES.alerts = async (_, token) => {
    setTitle("Alerts");
    const all = await api("GET", "/admin/alerts?all=1");
    if (!current(token)) return;
    updateAlertCount(all);
    const firing = all.filter((a) => a.state === "firing");
    const row = (a) => "<tr><td>" + (a.severity === "critical" ? '<span class="badge bad">Critical</span>' : '<span class="badge warn">Warning</span>') + "</td><td>" + esc(RULES[a.rule] || a.rule) + '</td><td class="mono">' + esc(a.subject) + "</td><td>" + esc(a.summary) +
      (a.notify_error ? '<div class="line" style="color:var(--bad)">Notification failed: ' + esc(a.notify_error) + "</div>" : "") + "</td><td>" + fmtTime(a.fired_at || a.started_at) + "</td><td>" + (a.state === "resolved" ? fmtTime(a.resolved_at) : a.state === "pending" ? '<span class="badge">Pending</span>' : '<span class="badge bad">Active</span>') + "</td></tr>";
    const head = "<thead><tr><th>Severity</th><th>Rule</th><th>Subject</th><th>Details</th><th>Started</th><th>Resolved</th></tr></thead>";
    $("#view").innerHTML = '<div class="toolbar"><span class="muted">' + firing.length + ' active alerts</span><span class="spacer"></span><a href="#/settings">Alert settings</a><button id="test">Send test notification</button></div>' +
      '<div class="section"><h2>Active</h2><div class="table-wrap"><table>' + head + "<tbody>" + (firing.map(row).join("") || '<tr><td colspan="6" class="empty">No active alerts.</td></tr>') + "</tbody></table></div></div>" +
      '<div class="section"><h2>History (30 days)</h2><div class="table-wrap"><table>' + head + "<tbody>" + (all.filter((a) => a.state !== "firing").map(row).join("") || '<tr><td colspan="6" class="empty">No records.</td></tr>') + "</tbody></table></div></div>";
    $("#test").onclick = async () => {
      const r = await act(() => api("POST", "/admin/alerts/test"));
      if (!r) return;
      if (!r.webhooks.length) return toast("No webhooks configured.", true);
      const bad = r.webhooks.filter((w) => !w.ok);
      toast(bad.length ? bad.length + " webhooks failed: " + bad.map((w) => w.error).join("；") : "Sent to " + r.webhooks.length + " webhooks", !!bad.length);
    };
    refreshEvery(15, () => { if (current(token)) api("GET", "/admin/alerts?all=1").then(updateAlertCount).catch(() => {}); }, token);
  };

  // ---- settings -------------------------------------------------------------------------------------------
  const lines = (t) => t.split("\n").map((s) => s.trim()).filter(Boolean);
  PAGES.settings = async (_, token) => {
    setTitle("Settings");
    const s = await api("GET", "/admin/settings");
    if (!current(token)) return;
    const cp = s.client_policy || {}, mon = s.monitor || {}, al = s.alerts || {};
    const field = (id, label, value, opts = {}) => '<div class="form-row"><label for="' + id + '">' + label + "</label>" +
      (opts.area ? '<textarea id="' + id + '" placeholder="' + esc(opts.ph || "") + '">' + esc(value) + "</textarea>" : '<input id="' + id + '" type="' + (opts.type || "text") + '" value="' + esc(value) + '" placeholder="' + esc(opts.ph || "") + '">') +
      (opts.hint ? '<div class="hint">' + opts.hint + "</div>" : "") + "</div>";
    $("#view").innerHTML = '<div class="grid2">' +
      '<form class="card" id="s-policy"><h2>Client routing policy</h2>' +
      field("domains", "Proxied domains", (cp.domain_suffix || []).join("\n"), { area: true, ph: "example.com", hint: "Enter one domain or web URL per line. A URL adds its hostname and subdomains." }) +
      field("direct_dns", "DNS for other domains", cp.direct_dns || "dhcp", { hint: "Use dhcp for the DNS assigned by the local network, or enter an IP such as 223.5.5.5." }) +
      '<div class="form-row check"><label><input type="checkbox" id="block_quic"' + (cp.block_quic === false ? "" : " checked") + "> Block QUIC (UDP 443) for proxied domains so apps use TCP.</label></div>" +
      '<button class="primary" type="submit">Save routing policy</button><p class="small muted">Clients check for and apply updates every 30 seconds.</p></form>' +
      '<form class="card" id="s-ip"><h2>Egress IPs</h2>' + field("cooldown", "Cooldown after release (days)", Math.round((s.cooldown_seconds || 0) / 86400 * 10) / 10, { type: "number", hint: "Released IPs stay out of the available pool during cooldown." }) +
      '<button class="primary" type="submit">Save</button></form>' +
      '<form class="card" id="s-monitor"><h2>Health probes</h2>' +
      field("targets", "Egress probe targets", (mon.egress_targets || []).join("\n"), { area: true, ph: "https://www.example.com/", hint: "One URL per line. The agent probes each URL from every egress IP on its configured interval. HTTP 403 and 429 count as failures." }) +
      field("entries", "Additional entries", (mon.entries || []).map((e) => e.name + " " + e.host + ":" + e.port).join("\n"), { area: true, ph: "hk-relay 192.0.2.1:443", hint: "Enter one name and address:port per line. Egress hosts are included automatically." }) +
      '<button class="primary" type="submit">Save probe settings</button></form>' +
      '<form class="card" id="s-alerts"><h2>Alerts</h2>' +
      field("hooks", "Webhook", (al.webhooks || []).map((w) => (w.format || "generic") + " " + w.url).join("\n"), { area: true, ph: "feishu https://open.feishu.cn/open-apis/bot/v2/hook/...", hint: "Enter one format and URL per line. Formats: generic, feishu, dingtalk, wecom, slack. Alerts include IPs and usernames." }) +
      field("fails", "Alert after consecutive failures", al.consecutive_failures ?? 3, { type: "number" }) +
      field("stale", "Host offline threshold (seconds)", al.agent_stale_seconds ?? 120, { type: "number" }) +
      field("sync", "Config sync threshold (seconds)", al.out_of_sync_seconds ?? 300, { type: "number" }) +
      field("repeat", "Alert repeat interval (seconds, 0 disables repeats)", al.repeat_seconds ?? 0, { type: "number" }) +
      '<button class="primary" type="submit">Save alert settings</button></form></div>';
    const save = (id, build, text) => { $(id).onsubmit = async (e) => { e.preventDefault(); let body; try { body = build(); } catch (err) { return toast(err.message, true); } if (await act(() => api("PUT", "/admin/settings", body), text)) route(); }; };
    save("#s-policy", () => ({ client_policy: Object.assign({}, cp, { domain_suffix: lines($("#domains").value).map((d) => d.replace(/^\./, "").toLowerCase()), direct_dns: $("#direct_dns").value.trim() || "dhcp", block_quic: $("#block_quic").checked }) }), "Routing policy saved.");
    save("#s-ip", () => ({ cooldown_seconds: Math.round(Number($("#cooldown").value) * 86400) }), "Saved.");
    save("#s-monitor", () => ({ monitor: { egress_targets: lines($("#targets").value), entries: lines($("#entries").value).map((l) => {
      const m = l.match(/^(\S+)\s+(\S+):(\d+)$/); if (!m) throw new Error("Invalid additional entry: " + l); return { name: m[1], host: m[2], port: Number(m[3]) }; }) } }), "Probe settings saved.");
    save("#s-alerts", () => ({ alerts: Object.assign({}, al, {
      webhooks: lines($("#hooks").value).map((l) => { const [f, ...rest] = l.split(/\s+/); const url = rest.join(" "); if (!url) return { url: f, format: "generic" }; return { format: f, url }; }),
      consecutive_failures: Number($("#fails").value), agent_stale_seconds: Number($("#stale").value), out_of_sync_seconds: Number($("#sync").value), repeat_seconds: Number($("#repeat").value) }) }), "Alert settings saved.");
  };

  // ---- audit ----------------------------------------------------------------------------------------------
  PAGES.audit = async (_, token) => {
    setTitle("Audit log");
    let rows = [], done = false;
    $("#view").innerHTML = '<div class="toolbar"><input id="actor" placeholder="Filter by actor" type="search"><button id="apply">Filter</button><span class="spacer"></span><span class="muted small">Retained for 180 days. Sensitive values are omitted.</span></div><div id="a-table"></div><div class="toolbar" style="margin-top:12px"><button id="more">Load more</button></div>';
    const draw = () => {
      $("#a-table").innerHTML = '<div class="table-wrap"><table><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Subject</th><th>Details</th><th>Source</th></tr></thead><tbody>' +
        (rows.map((r) => "<tr><td>" + fmtTime(r.at) + "</td><td>" + esc(r.actor) + '</td><td class="mono small">' + esc(r.action) + '</td><td class="mono small">' + esc(r.target) + '</td><td class="mono small" style="max-width:360px;overflow-wrap:anywhere">' + esc(r.detail) + '</td><td class="mono small">' + esc(r.address) + "</td></tr>").join("") ||
          '<tr><td colspan="6" class="empty">No records.</td></tr>') + "</tbody></table></div>";
      $("#more").hidden = done;
    };
    const load = async (reset) => {
      const actor = $("#actor").value.trim();
      const before = !reset && rows.length ? rows[rows.length - 1].id : "";
      const page = await api("GET", "/admin/audit?limit=100" + (before ? "&before=" + before : "") + (actor ? "&actor=" + enc(actor) : ""));
      if (!current(token)) return;
      rows = reset ? page : rows.concat(page);
      done = page.length < 100;
      draw();
    };
    $("#apply").onclick = () => act(() => load(true));
    $("#actor").onkeydown = (e) => { if (e.key === "Enter") act(() => load(true)); };
    $("#more").onclick = () => act(() => load(false));
    await load(true);
  };

  // ---- admins ---------------------------------------------------------------------------------------------
  PAGES.admins = async (_, token) => {
    setTitle("Administrators");
    const admins = await api("GET", "/admin/admins");
    if (!current(token)) return;
    $("#view").innerHTML = '<div class="toolbar"><span class="muted">Signed in as ' + esc(me) + '</span><span class="spacer"></span><button id="mypw">Change my password</button><button class="primary" id="add">Add administrator</button></div>' +
      '<div class="table-wrap"><table><thead><tr><th>Administrator</th><th>Created</th><th>Last sign-in</th><th>Active sessions</th><th></th></tr></thead><tbody>' +
      admins.map((a) => "<tr><td><b>" + esc(a.name) + "</b>" + (a.name === me ? ' <span class="badge info">You</span>' : "") + "</td><td>" + fmtTime(a.created_at) + "</td><td>" + fmtTime(a.last_login) + "</td><td>" + a.sessions + '</td><td class="actions">' +
        (a.name !== me ? '<button class="link" data-reset="' + esc(a.name) + '">Reset password</button><button class="link danger" data-del="' + esc(a.name) + '">Delete</button>' : "") + "</td></tr>").join("") + "</tbody></table></div>" +
      '<p class="small muted">CLI tools and scripts can authenticate with CP_ADMIN_TOKEN. The audit log records them as api-token.</p>';
    $("#add").onclick = async () => {
      const r = await form("Add administrator", [{ name: "name", label: "Username", required: true }, { name: "password", label: "Password (optional)", type: "password", hint: "Leave blank to generate a password. Use at least 8 characters." }],
        (v) => api("POST", "/admin/admins", Object.assign({ name: v.name }, v.password ? { password: v.password } : {})), "Add");
      if (!r) return;
      if (r.password) reveal("Created administrator " + r.name, "Initial password", r.password); else toast("Added.");
      route();
    };
    $("#mypw").onclick = async () => {
      const r = await form("Change my password", [{ name: "password", label: "New password", type: "password", required: true, hint: "Use at least 8 characters. Sign in again after changing it." }],
        (v) => api("POST", "/admin/admins/" + enc(me) + "/password", { password: v.password }));
      if (r) showLogin("Password changed. Sign in again.");
    };
    $$("[data-reset]").forEach((b) => b.onclick = async () => {
      if (!(await confirmBox("Reset " + b.dataset.reset + " password", "Generate a new password and immediately revoke all of the administrator's sessions.", "Reset"))) return;
      const r = await act(() => api("POST", "/admin/admins/" + enc(b.dataset.reset) + "/password"));
      if (r) reveal("New password", "New password for " + b.dataset.reset, r.password);
    });
    $$("[data-del]").forEach((b) => b.onclick = async () => {
      if (!(await confirmBox("Delete administrator " + b.dataset.del, "This administrator loses access immediately.", "Delete"))) return;
      if (await act(() => api("DELETE", "/admin/admins/" + enc(b.dataset.del)), "Deleted.")) route();
    });
  };

  boot();
})();
</script>
</body>
</html>
