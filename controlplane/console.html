<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aifree Console</title>
<script>
  const appearance = (() => {
    const key = "aifree.appearance";
    const system = matchMedia("(prefers-color-scheme: dark)");
    let preference = "system";
    try {
      const saved = localStorage.getItem(key);
      if (saved === "dark" || saved === "light") preference = saved;
    } catch { /* Storage may be unavailable. */ }

    const apply = () => {
      document.documentElement.dataset.theme = preference === "system" ? (system.matches ? "dark" : "light") : preference;
    };
    system.addEventListener("change", apply);
    apply();

    return {
      bind() {
        const controls = Array.from(document.querySelectorAll(".appearance"));
        controls.forEach((control) => {
          control.value = preference;
          control.addEventListener("change", () => {
            preference = control.value;
            try { localStorage.setItem(key, preference); } catch { /* Keep the in-memory selection. */ }
            controls.forEach((item) => { item.value = preference; });
            apply();
          });
        });
      },
    };
  })();
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #f3f6fa; --panel: #fff; --sidebar: #eaf0f6; --canvas: #f4f8fb;
    --ink: #172638; --muted: #52647a; --line: #cbd6e2; --hover: #e9f0f6;
    --accent: #146650; --accent-ink: #fff; --accent-soft: #e0f2eb; --accent-hover: #0c503e;
    --ok: #146650; --ok-soft: #e0f2eb; --bad: #a52c46; --bad-soft: #fbe9ee;
    --warn: #805412; --warn-soft: #faf0d9; --idle: #52647a; --idle-soft: #e8eef4;
    --node-ok: #84b5a6; --node-warn: #c7a266; --node-bad: #c9909d;
    --wire: #567f75; --canvas-dot: #ccd8e4;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --side: 190px;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d1522; --panel: #172333; --sidebar: #101b29; --canvas: #101c2a;
    --ink: #edf3f8; --muted: #a7b8cb; --line: #334559; --hover: #223448;
    --accent: #76dfb6; --accent-ink: #10291f; --accent-soft: #193a34; --accent-hover: #a5f0d3;
    --ok: #76dfb6; --ok-soft: #193a34; --bad: #ffa4ae; --bad-soft: #402630;
    --warn: #f5ca80; --warn-soft: #392f24; --idle: #a7b8cb; --idle-soft: #263447;
    --node-ok: #46786b; --node-warn: #8b734a; --node-bad: #94586a;
    --wire: #5e9083; --canvas-dot: #2a3e52;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  ::selection { background: var(--accent); color: var(--accent-ink); }
  a { color: var(--accent); text-decoration: none; text-underline-offset: 3px; }
  a:hover { text-decoration: underline; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
  button:hover { background: var(--hover); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 650; }
  button.primary:hover { background: var(--accent-hover); }
  button.danger { color: var(--bad); border-color: var(--bad); }
  button.link { border: 0; background: none; color: var(--accent); padding: 4px 6px; }
  button.link:hover { text-decoration: underline; }
  button.link.danger { color: var(--bad); }
  button:disabled { opacity: .55; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
  input::placeholder, textarea::placeholder { color: var(--muted); }
  textarea { min-height: 96px; font-family: var(--mono); font-size: 13px; }
  input[type=checkbox] { width: auto; accent-color: var(--accent); }
  .mono { font-family: var(--mono); }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .icon { width: 16px; height: 16px; flex: none; vertical-align: middle; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--ink); font-size: 17px; font-weight: 700; letter-spacing: -.02em; }
  .brand:hover { text-decoration: none; }
  .brand-mark { width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid var(--node-ok); border-radius: 9px; color: var(--accent); background: var(--accent-soft); flex: none; }
  .brand-mark .icon { width: 18px; height: 18px; }

  /* Application shell */
  .shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; }
  nav.side { background: var(--sidebar); border-right: 1px solid var(--line); padding: 21px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  nav.side .brand { margin: 0 8px 24px; width: fit-content; }
  .nav-links { display: flex; flex-direction: column; gap: 3px; }
  .nav-links a { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 9px 10px; border: 1px solid transparent; border-radius: 8px; white-space: nowrap; }
  .nav-links a:hover { background: var(--hover); color: var(--ink); text-decoration: none; }
  .nav-links a.active { background: var(--accent-soft); border-color: var(--node-ok); color: var(--accent); font-weight: 650; }
  .nav-links .count { margin-left: auto; font-size: 11px; background: var(--bad-soft); color: var(--bad); border-radius: 20px; padding: 0 6px; }
  .nav-divider { height: 1px; border: 0; margin: 10px 8px; background: var(--line); }
  header.top { display: flex; align-items: center; gap: 14px; padding: 17px 28px; border-bottom: 1px solid var(--line); background: var(--bg); }
  header.top h1 { font-size: 24px; letter-spacing: -.025em; margin: 0; flex: 1; min-width: 0; overflow-wrap: anywhere; line-height: 1.2; }
  #who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 20vw; }
  .content { padding: 23px 28px 44px; max-width: 1950px; margin-inline: auto; }

  /* blocks */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .section { margin-bottom: 20px; }
  .section > h2, .card > h2 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .section > h2 .spacer, .toolbar .spacer { flex: 1; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar input, .toolbar select { width: auto; min-width: 160px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--bg); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--hover); }
  td.actions { white-space: nowrap; text-align: right; }
  .empty { color: var(--muted); padding: 18px; text-align: center; }
  .badge { font-size: 11px; border-radius: 999px; padding: 1px 8px; white-space: nowrap; background: var(--idle-soft); color: var(--idle); display: inline-block; }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.bad { background: var(--bad-soft); color: var(--bad); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 16px; }
  .form-row { margin-bottom: 12px; }
  .form-row label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .form-row .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .form-row.check label { display: flex; gap: 8px; align-items: center; color: var(--ink); font-size: 14px; }

  /* Network topology */
  .summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 12px; background: var(--panel); margin-bottom: 20px; }
  .stat { padding: 12px 16px; min-width: 0; }
  .stat + .stat { border-left: 1px solid var(--line); }
  .stat b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; letter-spacing: -.025em; margin-block: 1px; }
  .stat span { display: block; color: var(--muted); font-size: 12px; }
  .stat .metric-bad { color: var(--bad); }
  .topology { border: 1px solid var(--line); border-radius: 14px; background: var(--canvas); }
  .map-header { display: flex; gap: 10px 18px; align-items: center; flex-wrap: wrap; padding: 13px 16px; border-bottom: 1px solid var(--line); }
  .map-header h2 { font-size: 16px; margin: 0 auto 0 0; }
  .map-controls { display: flex; flex-wrap: wrap; gap: 8px; }
  .map-controls input, .map-controls select { width: auto; min-width: 0; }
  .map-controls input { width: 178px; }
  .map-controls button { display: inline-flex; gap: 7px; align-items: center; }
  .map-canvas {
    position: relative; display: grid; justify-items: center; gap: 28px; padding: 22px 16px 17px;
    background-image: radial-gradient(var(--canvas-dot) 1px, transparent 1px); background-size: 18px 18px;
  }
  .map-wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .map-wires path { fill: none; stroke: var(--wire); stroke-width: 1.3; stroke-dasharray: 4 4; }
  .map-wires path.ok { stroke: var(--ok); }
  .map-wires path.warn { stroke: var(--warn); }
  .map-wires path.bad { stroke: var(--bad); }
  .map-root { position: relative; z-index: 1; min-width: 210px; padding: 11px 15px; display: flex; gap: 10px; align-items: center; border-radius: 12px; border: 1px solid var(--node-ok); background: var(--accent-soft); }
  .map-root b, .map-root small { display: block; }
  .map-root small { color: var(--muted); }
  .map-grid { position: relative; display: grid; width: 100%; gap: 25px 12px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .map-grid.single { width: min(270px, 100%); grid-template-columns: minmax(0, 1fr); padding: 0; }
  .map-node { position: relative; text-align: left; padding: 11px 12px 9px; min-width: 0; border-radius: 11px; border-color: var(--line); white-space: normal; }
  .map-node.ok { border-color: var(--node-ok); }
  .map-node.warn { border-color: var(--node-warn); }
  .map-node.bad { border-color: var(--node-bad); }
  .map-node[aria-expanded=true] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
  .map-node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .node-top { display: flex; gap: 6px; justify-content: space-between; align-items: flex-start; }
  .node-top b { overflow-wrap: anywhere; }
  .node-address { display: block; color: var(--muted); font-size: 11px; margin: 2px 0 7px; overflow-wrap: anywhere; }
  .node-metric { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; min-height: 23px; }
  .node-metric strong { color: var(--ok); font-family: var(--mono); font-size: 15px; }
  .node-metric span { color: var(--muted); font-size: 11px; }
  .node-footer { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 6px; display: flex; flex-wrap: wrap; gap: 2px 10px; color: var(--muted); font-size: 11px; }
  .node-top .badge, .map-legend span { display: inline-flex; gap: 5px; align-items: center; }
  .node-top .badge::before, .map-legend span::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .node-footer b { color: var(--ink); font-weight: 600; }
  .map-footer { display: flex; justify-content: space-between; gap: 6px 18px; flex-wrap: wrap; padding: 9px 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .map-legend { display: flex; flex-wrap: wrap; gap: 4px 13px; }
  .map-legend .ok { color: var(--ok); }
  .map-legend .warn { color: var(--warn); }
  .map-legend .bad, .map-update.bad { color: var(--bad); }
  .map-update { font-variant-numeric: tabular-nums; }
  .probe-details summary { cursor: pointer; white-space: nowrap; }
  .probe-details ul { margin: 6px 0 0; padding-left: 17px; min-width: 180px; }
  .probe-table td:first-child { min-width: 115px; }
  .probe-table td:last-child { min-width: 130px; }
  .table-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
  .table-toolbar input, .table-toolbar select { width: auto; max-width: 100%; }
  .pool-stats { display: flex; flex-wrap: wrap; }
  .pool-stats .stat { flex: 1 0 115px; }
  .pool-stats .stat + .stat { border-left: 0; }
  .pool-stats .stat:not(:last-child) { border-right: 1px solid var(--line); }
  .pool-stats .stat:nth-child(n+3) { border-top: 0; }
  .map-empty { position: relative; width: 100%; background: var(--panel); border-radius: 8px; }
  .inspector { margin: 20px 0; padding: 14px 16px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--canvas); }
  .inspector-head { display: flex; flex-wrap: wrap; gap: 7px 12px; align-items: center; margin-bottom: 12px; }
  .inspector-head h2 { margin: 0 auto 0 0; font-size: 17px; overflow-wrap: anywhere; }
  .inspector-head .badge { vertical-align: middle; margin-left: 5px; }
  .inspector .tcard h3 { margin-top: 0; }
  .inspector .ip-heading { margin: 14px 0 8px; justify-content: space-between; }
  .inspector .ip-heading h3 { margin: 0; }
  .map-controls button[aria-busy=true] { color: var(--muted); cursor: progress; }
  .inspector h3 { margin: 15px 0 8px; font-size: 14px; }
  .tcard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
  .tcard.ok { border-color: var(--node-ok); }
  .tcard.bad { border-color: var(--node-bad); }
  .tcard.warn { border-color: var(--node-warn); }
  .tgrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(200px, 100%), 1fr)); }
  .thead { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); }
  .ttitle { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .ttitle b { font-family: var(--mono); overflow-wrap: anywhere; }
  .line { color: var(--muted); font-size: 12px; margin-top: 3px; overflow-wrap: anywhere; }
  .probe { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line); }
  .target { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; margin-top: 0; }
  .hist { display: flex; gap: 2px; margin-top: 4px; flex-wrap: wrap; }
  .hist i { width: 6px; height: 9px; border-radius: 1px; background: var(--ok); }
  .hist i.f { background: var(--bad); }
  .alerts { display: grid; gap: 6px; padding-top: 10px; }
  .alert-box { margin-top: 20px; }
  .alert-box summary { cursor: pointer; font-weight: 650; }
  .alert a { display: inline-block; margin-left: 6px; }
  .stat a { color: inherit; text-decoration: underline; }
  #inspector-title:focus { outline-offset: 4px; }
  .alert { border-radius: 8px; padding: 8px 12px; border: 1px solid var(--line); background: var(--warn-soft); }
  .alert.critical { background: var(--bad-soft); }
  .extra { margin-top: 21px; }

  @media (min-width: 1600px) {
    .map-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  }
  @media (max-width: 1100px) {
    .map-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 820px) {
    .shell { grid-template-columns: minmax(0, 1fr); }
    nav.side { position: static; height: auto; overflow: visible; border-right: 0; border-bottom: 1px solid var(--line); padding: 10px 12px; }
    nav.side .brand { margin: 0 4px 8px; }
    .nav-links { flex-direction: row; overflow-x: auto; padding: 2px; }
    .nav-divider { display: none; }
    header.top, .content { padding-inline: 14px; }
  }
  @media (max-width: 540px) {
    .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stat:nth-child(3) { border-left: 0; }
    .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
    .map-controls { display: grid; grid-template-columns: minmax(0, 1fr) auto; width: 100%; }
    .map-controls input { width: 100%; grid-column: 1 / -1; }
    .map-grid { grid-template-columns: minmax(0, 1fr); padding-left: 18px; gap: 12px; }
    .node-top .badge { white-space: normal; }
    .map-canvas { padding-inline: 12px; }
    header.top h1 { font-size: 20px; }
  }

  /* overlays */
  .overlay { position: fixed; inset: 0; background: rgba(15, 20, 30, .45); display: flex; align-items: flex-start; justify-content: center; padding: 8vh 16px 16px; z-index: 20; overflow-y: auto; }
  .modal { background: var(--panel); border-radius: 12px; width: 100%; max-width: 520px; padding: 18px 20px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .modal h3 { margin: 0 0 14px; font-size: 16px; }
  .modal .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .modal .err { color: var(--bad); font-size: 13px; min-height: 1.3em; }
  .secret { font-family: var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 10px; overflow-wrap: anywhere; user-select: all; }
  .os-tabs { display: flex; gap: 6px; margin: 10px 0 4px; }
  .os-tabs button[aria-selected="true"] { background: var(--accent, #2563eb); color: #fff; border-color: transparent; }
  .install-row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
  .install-row .form-row { flex: 1 1 200px; margin: 0; }
  .install-cmd { display: flex; gap: 6px; align-items: flex-start; }
  .install-cmd pre { flex: 1; min-width: 0; }
  pre.snippet { font-family: var(--mono); font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 10px; white-space: pre-wrap; overflow-wrap: anywhere; user-select: all; margin: 8px 0 0; }
  .toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 30; max-width: calc(100vw - 32px); }
  .toast { background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.2); max-width: 420px; }
  .toast.bad { background: var(--bad-soft); color: var(--bad); border: 1px solid var(--node-bad); }

  /* login */
  .login { max-width: 360px; margin: 14vh auto; padding: 0 16px; }
  .login .card { padding: 22px; }
  .login h1 { font-size: 22px; margin: 0 0 4px; }
  .login .brand-mark { margin-bottom: 14px; }
  .console-controls { display: flex; flex-wrap: wrap; gap: 6px; }
  .console-controls select { width: auto; font-size: 12px; }
  .login .console-controls { justify-content: flex-end; margin-bottom: 12px; }
  .badge.info { background: var(--idle-soft); color: var(--ink); }
  .usage-nav { display: flex; align-items: center; gap: 6px; }
  .usage-nav b { min-width: 13ch; text-align: center; font-variant-numeric: tabular-nums; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .usage-why { color: var(--muted); font-size: 12px; margin-top: 3px; max-width: 420px; }
  td.nowrap { white-space: nowrap; }
  .badge { font-weight: 550; }
  .actions button:focus-visible { outline-offset: 0; }
  @media (max-width: 540px) {
    header.top { flex-wrap: wrap; gap: 8px; }
    header.top h1 { flex-basis: 100%; }
    #who { max-width: none; flex: 1; }
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="login" class="login" hidden>
  <form class="card" id="login-form" novalidate>
    <div class="console-controls">
      <select class="language" data-l10n-label="Language" aria-label="Language"><option value="system" data-l10n="Browser language">Browser language</option><option value="en" lang="en">English</option><option value="zh-Hans" lang="zh-Hans">Simplified Chinese</option></select>
      <select class="appearance" data-l10n-label="Appearance" aria-label="Appearance"><option value="system" data-l10n="System appearance">System appearance</option><option value="light" data-l10n="Light">Light</option><option value="dark" data-l10n="Dark">Dark</option></select>
    </div>
    <span class="brand-mark" data-icon="topology"></span><h1 data-l10n="aifree Console">aifree Console</h1>
    <p class="muted small" style="margin:0 0 16px" data-l10n="Sign in with an administrator account.">Sign in with an administrator account.</p>
    <div class="form-row"><label for="l-user" data-l10n="Username">Username</label><input id="l-user" autocomplete="username" required></div>
    <div class="form-row"><label for="l-pass" data-l10n="Password">Password</label><input id="l-pass" type="password" autocomplete="current-password" required></div>
    <div class="err small" id="l-err" role="alert" style="color:var(--bad);min-height:1.4em"></div>
    <button class="primary" style="width:100%;margin-top:6px" type="submit" data-l10n="Sign in">Sign in</button>
  </form>
</div>

<div id="app" class="shell" hidden>
  <nav class="side" data-l10n-label="Main navigation" aria-label="Main navigation">
    <a class="brand" href="#/"><span class="brand-mark" data-icon="topology"></span>aifree</a>
    <div class="nav-links">
      <a href="#/" data-nav="overview"><span data-icon="topology"></span><span data-l10n="Topology">Topology</span></a>
      <a href="#/hosts" data-nav="hosts"><span data-icon="server"></span><span data-l10n="Hosts">Hosts</span></a>
      <a href="#/ips" data-nav="ips"><span data-icon="ips"></span><span data-l10n="Egress IPs">Egress IPs</span></a>
      <a href="#/users" data-nav="users"><span data-icon="users"></span><span data-l10n="Users">Users</span></a>
      <a href="#/customers" data-nav="customers"><span data-icon="users"></span><span data-l10n="Customers">Customers</span></a>
      <a href="#/mailboxes" data-nav="mailboxes"><span data-icon="mail"></span><span data-l10n="Mailboxes">Mailboxes</span></a>
      <a href="#/usage" data-nav="usage"><span data-icon="chart"></span><span data-l10n="Usage">Usage</span></a>
      <a href="#/plans" data-nav="plans"><span data-icon="card"></span><span data-l10n="Plans">Plans</span></a>
      <a href="#/subscriptions" data-nav="subscriptions"><span data-icon="card"></span><span data-l10n="Subscriptions">Subscriptions</span></a>
      <a href="#/orders" data-nav="orders"><span data-icon="receipt"></span><span data-l10n="Orders">Orders</span></a>
      <a href="#/provisioning" data-nav="provisioning"><span data-icon="queue"></span><span data-l10n="Provisioning">Provisioning</span></a>
      <a href="#/alerts" data-nav="alerts"><span data-icon="bell"></span><span data-l10n="Alerts">Alerts</span><span class="count" id="alert-count" hidden></span></a>

  <main class="main">
    <header class="top">
      <h1 id="title">Network topology</h1>
      <span class="muted small" id="who"></span>
      <div class="console-controls">
        <select class="language" data-l10n-label="Language" aria-label="Language"><option value="system" data-l10n="Browser language">Browser language</option><option value="en" lang="en">English</option><option value="zh-Hans" lang="zh-Hans">Simplified Chinese</option></select>
        <select class="appearance" data-l10n-label="Appearance" aria-label="Appearance"><option value="system" data-l10n="System appearance">System appearance</option><option value="light" data-l10n="Light">Light</option><option value="dark" data-l10n="Dark">Dark</option></select>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script id="console-zh-hans" type="application/json">{}</script>
<script>
(() => {
  "use strict";
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const STALE = 180;
  let csrf = null, me = null, timer = null, routeToken = 0, stopObserving = null;
  const chinese = JSON.parse($("#console-zh-hans").textContent);
  const languageKey = "aifree-console-language";
  let language = "en", preference = "system", loginMessage = "", languageDraft = null;
  try {
    const saved = localStorage.getItem(languageKey);
    if (saved === "en" || saved === "zh-Hans") preference = saved;
  } catch { /* Storage may be blocked. */ }

  function interpolate(text, params) {
    if (!params) return text;
    return text.replace(/\{(\w+)\}/g, (slot, key) => Object.hasOwn(params, key) ? String(params[key]) : slot);
  }
  function tr(message, params) {
    const messages = language === "zh-Hans" ? chinese.messages : undefined;
    const text = messages && Object.hasOwn(messages, message) ? messages[message] : message;
    return interpolate(text, params);
  }
  const trHTML = (message, params) => esc(tr(message, params));

  // Keep API response text stable for other clients. Known console messages
  // are localized at display time, with parameters captured from the response.
  const serverMessages = Object.entries(chinese.serverMessages || {}).map(([message, translation]) => {
    const pattern = message.split(/(\{\w+\})/).map((part, index) => index % 2
      ? "(?<" + part.slice(1, -1) + ">.*?)"
      : part.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("");
    return { translation, pattern: new RegExp("^" + pattern + "$", "s") };
  });
  function consoleMessage(message) {
    if (!message || language !== "zh-Hans") return message || "";
    if (Object.hasOwn(chinese.messages || {}, message)) return tr(message);
    for (const entry of serverMessages) {
      const match = entry.pattern.exec(message);
      if (match) return interpolate(entry.translation, match.groups);
    }
    return message;
  }

  function resolvedLanguage() {
    if (preference !== "system") return preference;
    for (const locale of navigator.languages || [navigator.language]) {
      const base = (locale || "").split(/[-_]/, 1)[0].toLowerCase();
      if (base === "zh") return "zh-Hans";
      if (base === "en") return "en";
    }
    return "en";
  }

  function applyLanguage() {
    const next = resolvedLanguage();
    const changed = language !== next;
    language = next;
    document.documentElement.lang = language;
    $$("[data-l10n]").forEach((el) => { el.textContent = tr(el.dataset.l10n); });
    $$("[data-l10n-label]").forEach((el) => { el.setAttribute("aria-label", tr(el.dataset.l10nLabel)); });
    $$(".language").forEach((select) => {
      select.value = preference;
      $('option[value="zh-Hans"]', select).textContent = chinese.name || "Simplified Chinese";
    });
    if (me) {
      if (changed) refreshLanguageView();
    } else {
      document.title = tr("aifree Console");
      $("#l-err").textContent = consoleMessage(loginMessage);
    }
  }

  function refreshLanguageView() {
    const fields = $$("#view form input[id], #view form textarea[id]");
    if (fields.length) {
      languageDraft = { hash: location.hash, fields: fields.flatMap((el) => {
        const property = el.type === "checkbox" ? "checked" : "value";
        const initial = property === "checked" ? el.defaultChecked : el.defaultValue;
        return el[property] === initial ? [] : [{ id: el.id, property, value: el[property] }];
      }) };
    }
    const token = routeToken + 1;
    route().then(() => {
      if (!current(token)) return;
      if (languageDraft?.hash === location.hash) {
        for (const { id, property, value } of languageDraft.fields) {
          const element = document.getElementById(id);
          if (element?.closest("#view form")) element[property] = value;
        }
      }
      languageDraft = null;
    });
  }

  function bindLanguage() {
    $$(".language").forEach((select) => select.addEventListener("change", () => {
      preference = select.value;
      try { localStorage.setItem(languageKey, preference); } catch { /* Keep the in-page preference. */ }
      applyLanguage();
    }));
    window.addEventListener("languagechange", applyLanguage);
    applyLanguage();
  }
  const ICONS = {
    topology: '<rect x="9" y="2" width="6" height="5" rx="1"/><path d="M12 7v5M5 17v-5h14v5"/><rect x="2" y="17" width="6" height="5" rx="1"/><rect x="16" y="17" width="6" height="5" rx="1"/>',
    server: '<rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01"/>',
    ips: '<rect x="3" y="7" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/>',
    users: '<circle cx="9" cy="7" r="3"/><path d="M2 21v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2M17 4a3 3 0 0 1 0 6m2 4a5 5 0 0 1 3 5v2"/>',
    mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
    bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 12a2 2 0 0 0 4 0"/>',
    settings: '<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.5" fill="var(--sidebar)"/><circle cx="15" cy="17" r="2.5" fill="var(--sidebar)"/>',
    log: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6m-6 4h6m-6 4h4"/>',
    shield: '<path d="m12 2 8 3v6c0 6-4 9-8 11-4-2-8-5-8-11V5z"/><path d="m9 12 2 2 4-4"/>',
    refresh: '<path d="M20 10a8 8 0 1 0-1 7M20 4v6h-6"/>',
    chart: '<path d="M4 20V4M4 20h16"/><path d="M8 16v-5m4 5V8m4 8v-3"/>',
    card: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h3"/>',
    receipt: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6m-6 4h6m-6 4h4"/>',
    queue: '<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3" cy="6" r="1"/><circle cx="3" cy="12" r="1"/><circle cx="3" cy="18" r="1"/>',
  };
  const icon = (name) => '<svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">' + ICONS[name] + "</svg>";
  $$("[data-icon]").forEach((item) => { item.innerHTML = icon(item.dataset.icon); });
  appearance.bind();

  function stopUpdates() {
    clearInterval(timer);
    stopObserving?.();
    stopObserving = null;
  }

  // ---- helpers --------------------------------------------------------------------------------------------
  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  const enc = encodeURIComponent;
  const fmtTime = (time) => (time ? new Date(time * 1000).toLocaleString(language, { hour12: false }) : "—");
  function ago(sec) {
    if (sec == null) return "—";
    sec = Math.max(0, Math.round(sec));
    if (sec < 60) return tr("{count} s ago", { count: sec });
    if (sec < 3600) return tr("{count} min ago", { count: Math.round(sec / 60) });
    if (sec < 86400) return tr("{count} h ago", { count: Math.round(sec / 3600) });
    return tr("{count} d ago", { count: Math.round(sec / 86400) });
  }
  const ms = (v) => (v == null ? "—" : v < 1 ? "<1 ms" : Math.round(v) + " ms");
  const hist = (h) => '<div class="hist" title="' + trHTML("Last {count} samples", { count: h.length }) + '">' + h.map((ok) => '<i class="' + (ok ? "" : "f") + '"></i>').join("") + "</div>";
  const IP_STATUS = { assigned: ["Assigned", "info"], available: ["Available", ""], cooldown: ["Cooling down", "warn"], banned: ["Banned", "bad"] };
  const ipBadge = (s) => '<span class="badge ' + (IP_STATUS[s] || ["", ""])[1] + '">' + trHTML((IP_STATUS[s] || [s])[0]) + "</span>";
  const now = () => Date.now() / 1000;

  function toast(text, bad) {
    const el = document.createElement("div");
    el.className = "toast" + (bad ? " bad" : "");
    el.textContent = bad ? consoleMessage(text) : text;
    $("#toasts").appendChild(el);
    setTimeout(() => el.remove(), bad ? 6000 : 3000);
  }

  class ApiError extends Error {}

  async function api(method, path, body) {
    const opts = { method, headers: {}, credentials: "same-origin", cache: "no-store" };
    if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
    if (method !== "GET" && csrf) opts.headers["X-CSRF-Token"] = csrf;
    let resp;
    try { resp = await fetch(path, opts); } catch (e) { throw new ApiError("Could not reach the control plane: " + e.message); }
    let data = null;
    try { data = await resp.json(); } catch (e) { /* empty body */ }
    if (resp.status === 401 && path !== "/admin/session") { showLogin("Your session expired. Sign in again."); throw new ApiError("Signed out"); }
    if (!resp.ok) throw new ApiError((data && data.error) || "HTTP " + resp.status);
    return data;
  }

  // Wrap an action: report errors as toasts, success optionally.
  async function act(fn, okText) {
    try { const r = await fn(); if (okText) toast(okText); return r; }
    catch (e) { if (e.message !== "Signed out") toast(e.message, true); return undefined; }
  }

  // Keep the browser's input constraints and render their feedback in the console language.
  function validateForm(form, showError) {
    const invalid = Array.from(form.elements).find((field) => field.willValidate && !field.validity.valid);
    if (!invalid) return true;
    showError(invalid.validity.valueMissing ? "Complete this required field." : "Enter a valid value.");
    invalid.focus();
    return false;
  }

  // ---- modals ---------------------------------------------------------------------------------------------
  function overlay(html) {
    const ov = document.createElement("div");
    ov.className = "overlay";
    ov.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + "</div>";
    document.body.appendChild(ov);
    const close = () => ov.remove();
    ov.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
    return { ov, close };
  }

  /* fields: [{name, label, type: text|password|number|select|textarea|checkbox, value, options:[[v,label]], hint, placeholder, required}]
     onSubmit(values) may throw; its return value resolves the promise. */
  function form(title, fields, onSubmit, submitText = tr("Save")) {
    return new Promise((resolve) => {
      const rows = fields.map((f, i) => {
        const id = "f" + i, req = f.required ? " required" : "";
        let input;
        if (f.type === "select") {
          input = '<select id="' + id + '" name="' + f.name + '">' + f.options.map(([v, l]) =>
            '<option value="' + esc(v) + '"' + (String(v) === String(f.value ?? "") ? " selected" : "") + ">" + esc(l) + "</option>").join("") + "</select>";
        } else if (f.type === "textarea") {
          input = '<textarea id="' + id + '" name="' + f.name + '" placeholder="' + esc(f.placeholder || "") + '"' + req + ">" + esc(f.value ?? "") + "</textarea>";
        } else if (f.type === "checkbox") {
          return '<div class="form-row check"><label><input type="checkbox" id="' + id + '" name="' + f.name + '"' + (f.value ? " checked" : "") + "> " + esc(f.label) + "</label>" + (f.hint ? '<div class="hint">' + esc(f.hint) + "</div>" : "") + "</div>";
        } else {
          input = '<input id="' + id + '" name="' + f.name + '" type="' + (f.type || "text") + '" value="' + esc(f.value ?? "") + '" placeholder="' + esc(f.placeholder || "") + '"' + req + (f.type === "password" ? ' autocomplete="new-password"' : "") + ">";
        }
        return '<div class="form-row"><label for="' + id + '">' + esc(f.label) + "</label>" + input + (f.hint ? '<div class="hint">' + esc(f.hint) + "</div>" : "") + "</div>";
      }).join("");
      const { ov, close } = overlay('<h3>' + esc(title) + '</h3><form novalidate>' + rows + `<div class="err" role="alert"></div><div class="buttons"><button type="button" data-cancel>${trHTML("Cancel")}</button><button class="primary" type="submit">` + esc(submitText) + "</button></div></form>");
      const formEl = $("form", ov);
      const error = $(".err", ov);
      $("[data-cancel]", ov).onclick = () => { close(); resolve(undefined); };
      formEl.onsubmit = async (e) => {
        e.preventDefault();
        error.textContent = "";
        if (!validateForm(formEl, (message) => { error.textContent = tr(message); })) return;
        const values = {};
        fields.forEach((f, i) => {
          const el = $("#f" + i, ov);
          values[f.name] = f.type === "checkbox" ? el.checked : el.value.trim();
        });
        const btn = $("button[type=submit]", ov);
        btn.disabled = true;
        try { const r = await onSubmit(values); close(); resolve(r === undefined ? true : r); }
        catch (err) { error.textContent = consoleMessage(err.message); btn.disabled = false; }
      };
      const first = $("input,select,textarea", ov); if (first) first.focus();
    });
  }

  function confirmBox(title, text, okText = tr("Confirm"), danger = true) {
    return new Promise((resolve) => {
      const { ov, close } = overlay("<h3>" + esc(title) + "</h3><p>" + text + `</p><div class="buttons"><button type="button" data-no>${trHTML("Cancel")}</button><button type="button" class="` + (danger ? "danger" : "primary") + '" data-yes>' + esc(okText) + "</button></div>");
      $("[data-no]", ov).onclick = () => { close(); resolve(false); };
      $("[data-yes]", ov).onclick = () => { close(); resolve(true); };
      $("[data-yes]", ov).focus();
    });
  }

  // Show a credential exactly once (it cannot be retrieved later).
  function reveal(title, label, secret, extraHtml = "") {
    const { ov, close } = overlay("<h3>" + esc(title) + '</h3><p class="small muted">' + trHTML("{label} (shown once. Save it now.)", { label }) + '</p><div class="secret" id="secret">' + esc(secret) + "</div>" + extraHtml +
      `<div class="buttons"><button type="button" data-copy>${trHTML("Copy")}</button><button type="button" class="primary" data-ok>${trHTML("Done")}</button></div>`);
    $("[data-copy]", ov).onclick = async () => {
      try { await navigator.clipboard.writeText(secret); toast(tr("Copied")); } catch (e) { toast(tr("Could not copy. Select the value and copy it manually."), true); }
    };
    $("[data-ok]", ov).onclick = close;
    return ov;
  }

  // ---- auth -----------------------------------------------------------------------------------------------
  function setLoginMessage(message) {
    loginMessage = message;
    $("#l-err").textContent = consoleMessage(message);
  }

  function showLogin(msg) {
    stopUpdates();
    routeToken++;
    csrf = null; me = null;
    languageDraft = null;
    $("#app").hidden = true;
    $("#login").hidden = false;
    setLoginMessage(msg || "");
    document.title = tr("aifree Console");
    $("#l-user").focus();
  }

  async function boot() {
    try {
      const s = await api("GET", "/admin/session");
      csrf = s.csrf; me = s.admin;
      start();
    } catch (e) { showLogin(); }
  }

  function start() {
    $("#login").hidden = true;
    $("#app").hidden = false;
    $("#who").textContent = me;
    route();
  }

  $("#login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    setLoginMessage("");
    if (!validateForm(e.currentTarget, setLoginMessage)) return;
    try {
      const s = await api("POST", "/admin/session", { username: $("#l-user").value.trim(), password: $("#l-pass").value });
      csrf = s.csrf; me = s.admin;
      $("#l-pass").value = "";
      start();
    } catch (err) {
      setLoginMessage(err.message === "wrong username or password" ? "Incorrect username or password." : err.message);
    }
  });
  $("#logout").onclick = async () => { await act(() => api("DELETE", "/admin/session")); showLogin("Signed out."); };

  // ---- router ---------------------------------------------------------------------------------------------
  const PAGES = {};
  function route() {
    stopUpdates();
    const parts = (location.hash.split("?")[0].replace(/^#\/?/, "")).split("/").map(decodeURIComponent);
    const page = parts[0] || "overview";
    const fn = PAGES[page] || PAGES.overview;
    $$("[data-nav]").forEach((link) => {
      const active = link.dataset.nav === (PAGES[page] ? page : "overview");
      link.classList.toggle("active", active);
      if (active) link.setAttribute("aria-current", "page");
      else link.removeAttribute("aria-current");
    });
    const token = ++routeToken;
    $("#view").innerHTML = `<div class="empty">${trHTML("Loading…")}</div>`;
    return fn(parts.slice(1), token).catch((e) => {
      if (token === routeToken && e.message !== "Signed out") {
        $("#view").innerHTML = `<div class="empty">${trHTML("Could not load: {detail}", { detail: consoleMessage(e.message) })}</div>`;
      }
    });
  }
  window.addEventListener("hashchange", () => {
    languageDraft = null;
    if (me) route();
  });
  const setTitle = (t) => { $("#title").textContent = t; document.title = t + " · aifree"; };
  const current = (token) => token === routeToken;
  function refreshEvery(sec, fn, token) { timer = setInterval(() => { if (current(token)) fn(); }, sec * 1000); }

  function updateAlertCount(alerts) {
    const n = alerts.filter((a) => a.state === "firing").length;
    $("#alert-count").hidden = !n;
    $("#alert-count").textContent = n;
  }

  // Entry and exit probe status use the same freshness window as the console.
  function probeHealth(probes, time) {
    const recent = probes.filter((probe) => time - probe.at <= STALE);
    const reachable = recent.filter((probe) => probe.ok);
    const best = reachable.reduce((fastest, probe) => {
      if (probe.latency_ms == null) return fastest;
      return !fastest || probe.latency_ms < fastest.latency_ms ? probe : fastest;
    }, null);
    if (!probes.length) return { tone: "", label: tr("No data"), best };
    if (!recent.length) return { tone: "warn", label: tr("Stale probes"), best };
    if (!reachable.length) return { tone: "bad", label: tr("Unreachable"), best };
    if (reachable.length !== probes.length) return { tone: "warn", label: tr("Partial coverage"), best };
    return { tone: "ok", label: tr("Reachable"), best };
  }

  function agentHealth(agent) {
    if (!agent) return { tone: "", label: tr("No heartbeat") };
    if (agent.age >= STALE) return { tone: "bad", label: tr("Agent offline") };
    if (agent.singbox_running === false) return { tone: "bad", label: tr("sing-box stopped") };
    if (!agent.in_sync && agent.apply_state === "unknown") return { tone: "warn", label: tr("Apply unconfirmed") };
    if (agent.apply_error && !agent.in_sync) return { tone: "bad", label: tr("Apply failed") };
    return agent.in_sync ? { tone: "ok", label: tr("Synced") } : { tone: "warn", label: tr("Sync pending") };
  }

  function hostHealth(agent, entry, failedIps) {
    if (agent.tone === "bad") return agent;
    if (entry.tone === "bad") return entry;
    if (failedIps) return { tone: "bad", label: tr("Egress failure") };
    if (agent.tone === "warn") return agent;
    if (entry.tone === "warn") return entry;
    if (!agent.tone) return agent;
    return entry.tone === "ok" ? { tone: "ok", label: tr("Healthy") } : { tone: "", label: tr("No probes") };
  }

  const statusBadge = ({ tone, label }) => `<span class="badge ${tone}">${esc(label)}</span>`;
  const endpoint = (host, port) => port ? `${host.includes(":") ? "[" + host + "]" : host}:${port}` : host;
  const metric = (label, value, detail = "", color = "") => `<div class="stat"><span>${esc(label)}</span><b class="${color}">${value}</b>${detail ? "<span>" + esc(detail) + "</span>" : ""}</div>`;

  function entryProbes(entry, time) {
    if (!entry) return `<p class="line">${trHTML("This host has no active entry port. Assign a user to start probing the entry.")}</p>`;
    const health = probeHealth(entry.probes, time);
    const rows = entry.probes.map((probe) => {
      const status = time - probe.at > STALE ? { tone: "warn", label: tr("Stale") } :
        probe.ok ? { tone: "ok", label: tr("Reachable") } : { tone: "bad", label: tr("Unreachable") };
      return `<tr><td>${esc(probe.source)}</td><td>${probe.ok ? ms(probe.latency_ms) : "—"}</td>
        <td>${statusBadge(status)}${probe.ok || !probe.detail ? "" : '<div class="line">' + esc(probe.detail) + "</div>"}</td>
        <td>${ago(time - probe.at)}</td><td>${hist(probe.history)}</td></tr>`;
    });
    return `<p class="line mono">${esc(endpoint(entry.host, entry.port))} ${statusBadge(health)}</p>` + (rows.length ?
      `<div class="table-wrap"><table class="probe-table"><thead><tr><th>${trHTML("Location")}</th><th>${trHTML("Latency")}</th><th>${trHTML("Status")}</th><th>${trHTML("Last probe")}</th><th>${trHTML("History")}</th></tr></thead><tbody>` +
      rows.join("") + '</tbody></table></div>' : `<p class="line">${trHTML("No probes have reported yet.")}</p>`);
  }

  function ipCard(ip, time) {
    const health = ipProbeHealth(ip.probes, time);
    const users = ip.users.map((user) => `<a href="#/users/${enc(user)}">${esc(user)}</a> <span class="mono">:${esc(ip.ports[user])}</span>`).join(", ");
    const rows = ip.probes.map((probe) => {
      const tone = time - probe.at > STALE ? "warn" : probe.ok ? "ok" : "bad";
      const delay = probe.ok ? ms(probe.latency_ms) : tr("Failed");
      const label = tone === "warn" ? tr("{delay} · stale", { delay }) : delay;
      return `<div class="probe"><div class="ttitle"><span class="line mono target" title="${esc(probe.target)}">${esc(probe.target.replace(/^https?:\/\//, ""))}</span>
        ${statusBadge({ tone, label })}</div>
        ${probe.ok || !probe.detail ? "" : '<div class="line">' + esc(probe.detail) + "</div>"}
        <div class="line">${ago(time - probe.at)}${hist(probe.history)}</div></div>`;
    });
    return `<article class="tcard ${health.tone}"><div class="ttitle"><b>${esc(ip.ip)}</b>${ipBadge(ip.status)}</div>
      <div class="line">${users || trHTML("No users")}${ip.users.length > 1 ? " " + trHTML("(shared)") : ""} · ${ip.devices} ${trHTML(ip.devices === 1 ? "device" : "devices")}</div>
      ${ip.note ? '<div class="line">' + esc(ip.note) + "</div>" : ""}
      ${rows.join("") || `<div class="line">${trHTML("No probe results yet.")}</div>`}</article>`;
  }

  function ipProbeHealth(probes, time) {
    if (probes.some((probe) => !probe.ok && time - probe.at <= STALE)) return { tone: "bad", label: tr("Failed") };
    const health = probeHealth(probes, time);
    return health.tone === "ok" ? { tone: "ok", label: tr("Healthy") } : health;
  }

  function topologyHosts(topology) {
    const agents = new Map(topology.agents.map((agent) => [agent.name, agent]));
    const entries = new Map(topology.entries.filter((entry) => entry.kind === "host").map((entry) => [entry.name, entry]));
    const ipsByHost = new Map();
    for (const ip of topology.ips) {
      if (!ipsByHost.has(ip.host)) ipsByHost.set(ip.host, []);
      ipsByHost.get(ip.host).push(ip);
    }
    return topology.hosts.map((host) => {
      const ips = ipsByHost.get(host.name) || [];
      const entry = entries.get(host.name);
      const agent = agents.get(host.name);
      const entryState = probeHealth(entry?.probes || [], topology.now);
      const failedIps = ips.filter((ip) => ipProbeHealth(ip.probes, topology.now).tone === "bad").length;
      return {
        host, ips, entry, entryState, agent, failedIps,
        devices: ips.reduce((total, ip) => total + ip.devices, 0),
        health: hostHealth(agentHealth(agent), entryState, failedIps),
      };
    });
  }

  function nodeCard(node, selected) {
    const { host, entry, entryState, health } = node;
    const best = entryState.best;
    return `<button class="map-node ${health.tone}" data-node="${esc(host.name)}" data-tone="${health.tone}"
      type="button" aria-controls="host-inspector" aria-expanded="${host.name === selected}">
      <span class="node-top"><b>${esc(host.name)}</b>${statusBadge(health)}</span>
      <span class="node-address mono">${esc(publicEntryLabel(host, entry?.port))}</span>
      <span class="node-metric">${best ? '<strong>' + ms(best.latency_ms) + '</strong><span>' + esc(best.source) + '</span>' :
        `<span>${trHTML("No current latency")}</span>`}</span>
      <span class="node-footer"><span><b>${node.ips.length}</b> ${trHTML(node.ips.length === 1 ? "IP" : "IPs")}</span>
        <span><b>${host.users}</b> ${trHTML(host.users === 1 ? "user" : "users")}</span>
        <span><b>${node.devices}</b> ${trHTML(node.devices === 1 ? "device" : "devices")}</span></span>
    </button>`;
  }

  // Draw a bus across each rendered row. Recompute it when the grid reflows.
  function drawWires(canvas, root, grid, wires) {
    const rect = canvas.getBoundingClientRect();
    const rootRect = root.getBoundingClientRect();
    const center = (bounds) => Math.round(bounds.left - rect.left + bounds.width / 2);
    const rootX = center(rootRect);
    const rows = new Map();
    for (const node of grid.querySelectorAll(".map-node")) {
      const bounds = node.getBoundingClientRect();
      const y = Math.round(bounds.top - rect.top);
      if (!rows.has(y)) rows.set(y, []);
      rows.get(y).push({ x: center(bounds), tone: node.dataset.tone });
    }
    if (!rows.size) { wires.replaceChildren(); return; }
    const tracks = Array.from(rows.keys());
    const rootY = Math.round(rootRect.bottom - rect.top);
    const oneColumn = rows.size > 1 && rows.size === grid.children.length;
    const trunkX = oneColumn ? 15 : rootX;
    const rise = oneColumn ? 8 : 14;
    const firstBus = tracks[0] - rise;
    const lastBus = tracks.at(-1) - rise;
    const stem = `M ${rootX} ${rootY} V ${firstBus} H ${trunkX} V ${lastBus}`;
    const paths = [`<path d="${stem}"></path>`];
    for (const [y, row] of rows) {
      const busY = y - rise;
      const positions = [trunkX, ...row.map((node) => node.x)];
      paths.push(`<path d="M ${Math.min(...positions)} ${busY} H ${Math.max(...positions)}"></path>`);
      for (const node of row) paths.push(`<path class="${node.tone}" d="M ${node.x} ${busY} V ${y}"></path>`);
    }
    wires.innerHTML = paths.join("");
  }

        const alertsPanel = $("#topology-alerts");
        updateAlertCount(alerts);

        $("#alert-summary").textContent = tr("Active alerts ({count})", { count: alerts.length });
        alertsPanel.innerHTML = alerts.map((alert) => `<div class="alert ${alert.severity === "critical" ? "critical" : ""}">
          <b>${trHTML(alert.severity === "critical" ? "Critical" : "Warning")}</b> ${esc(consoleMessage(alert.summary))}

  // Install / uninstall commands for an exit host. The token is never part of a command: the installer asks for it

  const INSTALL_OS = [["macos", "macOS"], ["linux", "Linux"], ["windows", "Windows"]];
  // transport: the host's /admin/hosts/{name}/xtcp view ({transport: "public"} for a new host). reuseToken: the host
  // may already have an installed token (the Install command dialog; not after a rotation, where it no longer works).
  function installHelp(transport, reuseToken) {

      ? tr("When prompted for the Agent token, press Enter to reuse the token already installed on this host.")

    const x = transport?.transport === "xtcp" ? transport : null;
    const frpc = x ? tr("On XTCP hosts the installer also downloads the pinned frpc and starts it at boot. It registers {proxy} with frps at {server} using verified TLS and forwards to sing-box on 127.0.0.1:{port}. XTCP visitors connect directly, so no inbound port forwarding is needed.", {
      proxy: x.proxy_name, server: endpoint(x.server_addr, x.server_port), port: x.local_port,
    }) : "";
    return {
      macos: [tr("Run in Terminal on the Mac. sudo asks for the Mac password."), token, frpc,
        tr("The Mac Agent registers its default interface's IPv4 when the egress pool is empty."),
        x ? "" : tr("Forward the TCP entry port range to the Mac.")].filter(Boolean).join(" "),
      linux: [tr("Run on the host. sudo asks for your password."), token, frpc,

        x ? "" : tr("The host otherwise uses its existing address as the egress IP.")].filter(Boolean).join(" "),
      windows: [tr('Run PowerShell with "Run as administrator".'), token, frpc,
        x ? tr("The CCProxyExitFrpc task runs frpc with a firewall rule for UDP hole punching.") : ""].filter(Boolean).join(" "),

  function installPanel(root, transport = { transport: "public" }, reuseToken = false) {
    let os = "macos";

        <div class="form-row" id="inst-iface-row" hidden><label for="inst-iface">${trHTML("Interface for routed egress IPs (optional)")}</label>

        `<button type="button" role="tab" data-os="${k}" aria-selected="${k === os}">${l}</button>`).join("")}</div>
      <p class="small muted" id="inst-how"></p>

      <p class="small muted" style="margin:10px 0 0">${trHTML("Uninstall (stops the services and removes the files and the stored token):")}</p>
      <div class="install-cmd"><pre class="snippet" id="inst-uninstall"></pre><button type="button" data-copy-cmd="inst-uninstall">${trHTML("Copy")}</button></div>
      <p class="small muted" id="inst-note"></p>`;
    const how = installHelp(transport, reuseToken);
    let timer;
    let seq = 0;  // only the response to the latest request may fill the commands
    // Any change makes the shown commands stale at once: clear them and disable Copy until the new ones arrive, so a
    // quick Copy after switching OS or editing the URL can never copy the previous command.
    function invalidate() {
      seq++;
      $("#inst-cmd", root).textContent = $("#inst-uninstall", root).textContent = "";
      root.querySelectorAll("[data-copy-cmd]").forEach((b) => { b.disabled = true; });
      $("#inst-note", root).textContent = tr("Loading the command…");
      $("#inst-iface-row", root).hidden = os !== "linux";
      $("#inst-how", root).textContent = how[os];
      return seq;
    }
    async function refresh() {
      const mine = invalidate(), want = os;
      const q = new URLSearchParams({ cp: $("#inst-cp", root).value.trim() });
      if (want === "linux" && $("#inst-iface", root).value.trim()) q.set("iface", $("#inst-iface", root).value.trim());
      let cmds, error;
      try { cmds = await api("GET", "/admin/install-commands?" + q); } catch (e) { error = e; }
      if (mine !== seq || want !== os) return;  // a newer tab or input superseded this response
      if (error) { $("#inst-note", root).textContent = consoleMessage(error.message); return; }
      $("#inst-cmd", root).textContent = cmds[want].install;
      $("#inst-uninstall", root).textContent = cmds[want].uninstall;
      $("#inst-note", root).textContent = "";
      root.querySelectorAll("[data-copy-cmd]").forEach((b) => { b.disabled = false; });
    }
    root.addEventListener("click", async (e) => {
      const tab = e.target.closest("[data-os]");
      if (tab) {
        os = tab.dataset.os;
        root.querySelectorAll("[data-os]").forEach((b) => b.setAttribute("aria-selected", String(b === tab)));
        refresh();
      }
      const copy = e.target.closest("[data-copy-cmd]");
      if (copy) {
        const text = $("#" + copy.dataset.copyCmd, root).textContent;
        if (copy.disabled || !text) return;
        try { await navigator.clipboard.writeText(text); toast(tr("Command copied")); } catch (err) { toast(tr("Could not copy. Select the command and copy it manually."), true); }
      }
    });
    root.addEventListener("input", () => { invalidate(); clearTimeout(timer); timer = setTimeout(refresh, 300); });
    (async () => {
      const mine = invalidate();
      let config, error;
      try { config = await api("GET", "/admin/install-url"); } catch (e) { error = e; }
      if (mine !== seq) return;
      if (error) { $("#inst-note", root).textContent = consoleMessage(error.message); return; }
      $("#inst-cp", root).value = config.public_url;
      refresh();
    })();
  }

  // Expand "a.b.c.d", "a.b.c.d-e", "a.b.c.d-a.b.c.e" and "a.b.c.d/n" (n >= 22) into addresses.
  function expandIps(text) {
    const toInt = (s) => { const p = s.split(".").map(Number); if (p.length !== 4 || p.some((x) => !(x >= 0 && x <= 255) || isNaN(x))) throw new Error(tr("Invalid IPv4 address: {ip}", { ip: s })); return ((p[0] << 24) >>> 0) + (p[1] << 16) + (p[2] << 8) + p[3]; };
    const toStr = (n) => [n >>> 24, (n >> 16) & 255, (n >> 8) & 255, n & 255].join(".");
    const out = [];
    for (const raw of text.split(/[\s,]+/).filter(Boolean)) {
      let lo, hi;
      if (raw.includes("/")) {
        const [ip, bits] = raw.split("/"); const b = Number(bits);
        if (!(b >= 22 && b <= 32)) throw new Error(tr("CIDR prefix must be between /22 and /32: {cidr}", { cidr: raw }));
        const size = 2 ** (32 - b); lo = Math.floor(toInt(ip) / size) * size; hi = lo + size - 1;
      } else if (raw.includes("-")) {
        const [a, b] = raw.split("-"); lo = toInt(a); hi = b.includes(".") ? toInt(b) : (lo - (lo & 255)) + Number(b);
        if (!(hi >= lo)) throw new Error(tr("Invalid range: {range}", { range: raw }));
      } else { lo = hi = toInt(raw); }
      for (let n = lo; n <= hi; n++) { out.push(toStr(n)); if (out.length > 1024) throw new Error(tr("Add up to 1024 addresses at a time.")); }
    }
    return out;
  }
  async function addIps(host) {

    (v) => api("POST", "/admin/hosts/" + enc(host) + "/ips", { ips: expandIps(v.ips) }), tr("Add"));

  function ipTable(ips, probes, time, withHost) {

  // Assign another user to an IP: any user for an available IP, Shared users for a shared one. A user already

      ]),
        hint: row.status === "available" ? "" : tr("Only Shared users can join a shared IP. Change a user's egress mode on the user page.") },
      { name: "port", label: tr("Entry port (optional)"), type: "number", placeholder: tr("Automatic: lowest free port"), hint: tr("Each user needs a distinct port in {min}–{max} on {host} ({free} free).", { min: h.port_range[0], max: h.port_range[1], host: hostName, free: h.free_ports }) },
    ], (v) => {
      const u = users.find((x) => x.name === v.user);
      const body = { ip };
      if (v.port) body.port = Number(v.port);
      return api("POST", "/admin/users/" + enc(v.user) + (u && u.egress_ip ? "/reassign" : "/assign"), body);
    }, tr("Assign"));
    if (r) { toast(tr("Assigned {user} to {ip} on entry port {port}.", { user: r.user, ip: r.egress_ip, port: r.port })); await onChange(); }
  }
  function bindIpActions(onChange = route) {
    $$("[data-ip-share]").forEach((b) => b.onclick = () => addHolder(b.dataset.ipShare, b.dataset.ipHost, onChange));
    $$("[data-ip-ban]").forEach((b) => b.onclick = async () => {
      const ip = b.dataset.ipBan;
      const r = await form(tr("Ban {ip}", { ip }), [{ name: "note", label: tr("Reason (optional)"), placeholder: tr("Example: target returned HTTP 403") }],
        (v) => api("POST", "/admin/ips/" + enc(ip) + "/ban", { note: v.note }), tr("Ban"));
      if (r) { toast(r.released_users.length ? tr("Banned and released assignments for {users}.", { users: r.released_users.join(", ") }) : tr("IP banned.")); await onChange(); }
    });
    $$("[data-ip-available]").forEach((b) => b.onclick = async () => {
      if (await act(() => api("POST", "/admin/ips/" + enc(b.dataset.ipAvailable) + "/available"), tr("Marked available."))) await onChange();

      const ip = b.dataset.ipDel;
      if (!(await confirmBox(tr("Delete {ip}", { ip }), trHTML("Remove this IP from the pool. It remains on the host network interface."), tr("Delete")))) return;
      if (await act(() => api("DELETE", "/admin/ips/" + enc(ip)), tr("Deleted."))) await onChange();

  }

  // ---- IPs ------------------------------------------------------------------------------------------------
  PAGES.ips = async (_, token) => {
    setTitle(tr("Egress IPs"));
    const [initialIps, hosts, initialTopology] = await Promise.all([api("GET", "/admin/ips"), api("GET", "/admin/hosts"), api("GET", "/admin/topology")]);
    if (!current(token)) return;
    let ips = initialIps, topology = initialTopology;
    let refreshToken = 0;
    updateAlertCount(topology.alerts || []);
    const params = new URLSearchParams(location.hash.split("?")[1] || "");
    $("#view").innerHTML = `
      <div id="pool-stats" class="summary pool-stats" aria-label="${trHTML("IP inventory summary")}"></div>
      <div class="table-toolbar">
        <input id="ip-search" type="search" placeholder="${trHTML("Find an IP or user")}" aria-label="${trHTML("Find an IP or user")}">
        <select id="f-host" aria-label="${trHTML("Egress host")}"><option value="">${trHTML("All hosts")}</option>
          ${hosts.map((host) => `<option>${esc(host.name)}</option>`).join("")}</select>
        <select id="f-status" aria-label="${trHTML("Allocation state")}"><option value="">${trHTML("All states")}</option>
          ${Object.entries(IP_STATUS).map(([key, [label]]) => `<option value="${key}">${trHTML(label)}</option>`).join("")}</select>
        <span class="muted small" id="ip-count"></span>
      </div><div id="ip-table"></div>`;
    const hostFilter = $("#f-host"), stateFilter = $("#f-status"), search = $("#ip-search");
    const draw = () => {
      const query = search.value.trim().toLowerCase();
      const scoped = ips.filter((ip) => !hostFilter.value || ip.host === hostFilter.value);
      const shown = scoped.filter((ip) => (!stateFilter.value || ip.status === stateFilter.value) &&
        (!query || ip.ip.includes(query) || ip.users.some((user) => user.toLowerCase().includes(query))));
      const counts = scoped.reduce((totals, ip) => {
        totals[ip.status] = (totals[ip.status] || 0) + 1;
        return totals;
      }, {});
      $("#pool-stats").innerHTML = [metric(tr("Total"), scoped.length), ...Object.entries(IP_STATUS).map(([key, [label]]) =>
        metric(tr(label), counts[key] || 0, "", key === "banned" && counts[key] ? "metric-bad" : ""))].join("");
      $("#ip-count").textContent = tr("{visible} of {total} IPs", { visible: shown.length, total: scoped.length });
      const probes = new Map(topology.ips.map((ip) => [ip.ip, ip.probes]));
      $("#ip-table").innerHTML = ipTable(shown, probes, topology.now, true);
      bindIpActions(async () => {
        const request = ++refreshToken;
        await act(async () => {
          const [latestIps, latestTopology] = await Promise.all([api("GET", "/admin/ips"), api("GET", "/admin/topology")]);
          if (!current(token) || request !== refreshToken) return;
          ips = latestIps;
          topology = latestTopology;
          updateAlertCount(topology.alerts || []);
          draw();
        });
      });
    };
    const host = params.get("host");
    if (hosts.some((item) => item.name === host)) hostFilter.value = host;
    hostFilter.addEventListener("change", draw);
    stateFilter.addEventListener("change", draw);
    search.addEventListener("input", draw);
    draw();
  };

  // ---- users ----------------------------------------------------------------------------------------------
  PAGES.users = async (args, token) => {
    if (args[0]) return userDetail(args[0], token);
    setTitle(tr("Users"));
    const users = await api("GET", "/admin/users");
    if (!current(token)) return;
    $("#view").innerHTML = `<div class="toolbar"><input id="q" placeholder="${trHTML("Search users, hosts, or IPs")}" type="search"><span class="muted small" id="u-count"></span><span class="spacer"></span><button class="primary" id="add-user">${trHTML("Add user")}</button></div><div id="u-table"></div>`;
    const draw = () => {
      const q = $("#q").value.trim().toLowerCase();
      const shown = users.filter((u) => !q || [u.name, u.host, u.egress_ip].some((x) => (x || "").toLowerCase().includes(q)));
      $("#u-count").textContent = shown.length + " / " + users.length;
      $("#u-table").innerHTML = `<div class="table-wrap"><table><thead><tr><th>${trHTML("User")}</th><th>${trHTML("Mode")}</th><th>${trHTML("Egress host")}</th><th>${trHTML("Egress IP")}</th><th>${trHTML("Entry port")}</th><th>${trHTML("Devices")}</th><th>${trHTML("Last seen")}</th></tr></thead><tbody>` +
        (shown.map((u) => {
          const live = u.devices.filter((d) => !d.revoked);
          const seen = Math.max(0, ...live.map((d) => d.last_seen || 0));
          return '<tr><td><a href="#/users/' + enc(u.name) + '"><b>' + esc(u.name) + "</b></a></td><td>" + (u.mode === "shared" ? tr("Shared") : tr("Exclusive")) + "</td><td>" + (u.host ? '<a href="#/hosts/' + enc(u.host) + '">' + esc(u.host) + "</a>" : `<span class="badge warn">${trHTML("Unassigned")}</span>`) +
            '</td><td class="mono">' + esc(u.egress_ip || "—") + '</td><td class="mono">' + esc(u.port || "—") + "</td><td>" + live.length + " / " + u.max_devices + "</td><td>" + (seen ? ago(now() - seen) : "—") + "</td></tr>";
        }).join("") || `<tr><td colspan="7" class="empty">${trHTML("No users.")}</td></tr>`) + "</tbody></table></div>";
    };
    $("#q").oninput = draw;
    draw();
    $("#add-user").onclick = async () => {
      const hosts = await act(() => api("GET", "/admin/hosts"));
      if (!hosts) return;
      const r = await form(tr("Add user"), [
        { name: "name", label: tr("Username"), required: true, hint: tr("1–64 characters. Spaces and slashes are prohibited.") },
        { name: "password", label: tr("Password (optional)"), type: "password", hint: tr("Leave blank to generate a password shown once. Use at least 8 characters.") },
        { name: "mode", label: tr("Egress mode"), type: "select", value: "exclusive", options: [["exclusive", tr("Dedicated egress IP")], ["shared", tr("Share an egress IP with other shared-mode users")]] },
        { name: "max_devices", label: tr("Device limit"), type: "number", value: 5, required: true },
        { name: "host", label: tr("Assign an egress IP now"), type: "select", value: "", options: [["", tr("Assign later")]].concat(hosts.map((h) => [h.name, tr("Auto-assign · {host}", { host: h.name })])) },
      ], async (v) => {
        const body = { name: v.name, mode: v.mode, max_devices: Number(v.max_devices) };
        if (v.password) body.password = v.password;
        const made = await api("POST", "/admin/users", body);
        let assigned = null;
        if (v.host) assigned = await api("POST", "/admin/users/" + enc(v.name) + "/assign", { host: v.host });
        return { made, assigned };

        ip: r.assigned.egress_ip, entry: endpoint(r.assigned.entry.host, r.assigned.entry.port),

  async function userDetail(name, token) {
    setTitle(tr("User · {name}", { name }));
    const [users, hosts] = await Promise.all([api("GET", "/admin/users"), api("GET", "/admin/hosts")]);
    if (!current(token)) return;
    const u = users.find((x) => x.name === name);
    if (!u) { $("#view").innerHTML = `<div class="empty">${trHTML("User not found.")} <a href="#/users">${trHTML("Back to list")}</a></div>`; return; }
    const live = u.devices.filter((d) => !d.revoked);
    const entry = u.host ? hosts.find((h) => h.name === u.host) : null;
    $("#view").innerHTML =
      `<div class="toolbar"><a href="#/users">${trHTML("← All users")}</a><span class="spacer"></span><button id="pw">${trHTML("Reset password")}</button><button id="mode">${trHTML("Egress mode")}</button><button id="limit">${trHTML("Device limit")}</button><button class="danger" id="del">${trHTML("Delete user")}</button></div>` +
      `<div class="grid2 section"><div class="card"><h2>${trHTML("Egress assignment")}</h2><dl class="kv">` +
      `<dt>${trHTML("Egress host")}</dt><dd>` + (u.host ? '<a href="#/hosts/' + enc(u.host) + '">' + esc(u.host) + "</a>" : `<span class="badge warn">${trHTML("Unassigned")}</span>`) + "</dd>" +
      `<dt>${trHTML("Egress IP")}</dt><dd class="mono">` + esc(u.egress_ip || "—") + "</dd>" +
      `<dt>${trHTML("Client entry")}</dt><dd class="mono">` + (entry ? esc(publicEntryLabel(entry, u.port)) : "—") + "</dd>" +

      '<div class="toolbar" style="margin:14px 0 0">' + (u.egress_ip ? `<button id="reassign">${trHTML("Change egress")}</button><button class="danger" id="release">${trHTML("Release egress")}</button>` : `<button class="primary" id="assign">${trHTML("Assign egress")}</button>`) + "</div></div>" +
      `<div class="card"><h2>${trHTML("Account")}</h2><dl class="kv"><dt>${trHTML("Username")}</dt><dd class="mono">${esc(u.name)}</dd><dt>${trHTML("Devices")}</dt><dd>${trHTML("{current} / {limit} active", { current: live.length, limit: u.max_devices })}</dd></dl>` +
      `<p class="small muted" style="margin:12px 0 0">${trHTML("The first sign-in on each computer registers a device for the account.")}</p></div></div>` +
      `<div class="section"><h2>${trHTML("Devices")} <span class="spacer"></span><button id="add-dev">${trHTML("Add headless device")}</button></h2><div class="table-wrap"><table><thead><tr><th>${trHTML("Devices")}</th><th>${trHTML("Platform")}</th><th>${trHTML("Last seen")}</th><th>${trHTML("Status")}</th><th></th></tr></thead><tbody>` +
      (u.devices.map((d) => '<tr><td class="mono">' + esc(d.name) + "</td><td>" + esc(d.platform || "—") + "</td><td>" + (d.last_seen ? ago(now() - d.last_seen) : tr("Never")) + "</td><td>" + (d.revoked ? `<span class="badge">${trHTML("Revoked")}</span>` : `<span class="badge ok">${trHTML("Active")}</span>`) + '</td><td class="actions">' +
        (d.revoked ? "" : '<button class="link danger" data-revoke="' + esc(d.name) + `">${trHTML("Revoke")}</button>`) + "</td></tr>").join("") ||
        `<tr><td colspan="5" class="empty">${trHTML("No devices have signed in.")}</td></tr>`) + "</tbody></table></div></div>";

    const assignForm = async (title) => {
      const ips = await act(() => api("GET", "/admin/ips"));
      if (!ips) return;
      const usable = ips.filter((e) => e.status === "available" || (e.status === "assigned" && u.mode === "shared" && e.users.every((x) => (users.find((y) => y.name === x) || {}).mode === "shared")));
      return form(title, [
        { name: "host", label: tr("Egress host"), type: "select", value: u.host || (hosts[0] || {}).name, options: hosts.map((h) => [h.name, h.name + " · " + publicEntryLabel(h)]) },
        { name: "ip", label: tr("Egress IP"), type: "select", value: "", options: [["", tr("Automatic: lowest available IP on the selected host")]].concat(usable.filter((e) => e.ip !== u.egress_ip).map((e) => {
          const holders = e.users.filter((x) => x !== name);
          return [e.ip, e.ip + " · " + e.host + (holders.length ? " " + tr("(shared with {users})", { users: holders.join(", ") }) : "")];
        })) },
        { name: "port", label: tr("Entry port (optional)"), type: "number", placeholder: tr("Leave blank for automatic assignment"), hint: tr("Choose an unused port within the host range.") },
      ], async (v) => {
        const body = { host: v.host };
        if (v.ip) { body.ip = v.ip; delete body.host; }
        if (v.port) body.port = Number(v.port);
        // A bound user moves in one step, so the client never sees "unassigned" and stays connected.
        return api("POST", "/admin/users/" + enc(name) + (u.egress_ip ? "/reassign" : "/assign"), body);
      }, tr("Assign"));
    };
    const afterAssign = (r) => {
      if (!r) return;
      const entry = r.entry ? endpoint(r.entry.host, r.entry.port) : tr("Waiting for Agent IPv4");
      toast(tr("Assigned {ip} · {entry}", { ip: r.egress_ip, entry }));
      route();
    };
    if ($("#assign")) $("#assign").onclick = async () => afterAssign(await assignForm(tr("Assign egress for {name}", { name })));
    if ($("#reassign")) $("#reassign").onclick = async () => afterAssign(await assignForm(tr("Change egress for {name}", { name })));
    if ($("#release")) $("#release").onclick = async () => {
      if (!(await confirmBox(tr("Release egress for {name}", { name }), trHTML("The client will disconnect. The IP enters cooldown and is unavailable for new assignments."), tr("Release")))) return;
      if (await act(() => api("POST", "/admin/users/" + enc(name) + "/release"), tr("Released."))) route();
    };
    $("#pw").onclick = async () => {
      const r = await form(tr("Reset password for {name}", { name }), [
        { name: "password", label: tr("New password (optional)"), type: "password", hint: tr("Leave blank to generate a password. Use at least 8 characters.") },
        { name: "revoke", label: tr("Revoke all devices"), type: "checkbox", value: true, hint: tr("Devices must sign in again with the new password.") },
      ], (v) => api("POST", "/admin/users/" + enc(name) + "/password", Object.assign({ revoke_devices: v.revoke }, v.password ? { password: v.password } : {})), tr("Reset"));

    $("#mode").onclick = async () => {

        { name: "mode", label: tr("Egress mode"), type: "select", value: u.mode, options: [["exclusive", tr("Exclusive: dedicated egress IP")], ["shared", tr("Shared: other Shared users may use the same egress IP")]], hint },
      ], (v) => v.mode === u.mode ? true : api("PUT", "/admin/users/" + enc(name), { mode: v.mode }));
      if (r) { toast(tr("Saved.")); route(); }
    };
    $("#limit").onclick = async () => {
      if (await form(tr("Device limit"), [{ name: "max", label: tr("Maximum active devices"), type: "number", value: u.max_devices, required: true }],
        (v) => api("PUT", "/admin/users/" + enc(name), { max_devices: Number(v.max) }))) { toast(tr("Saved.")); route(); }
    };
    $("#del").onclick = async () => {
      if (!(await confirmBox(tr("Delete user {name}", { name }), trHTML("This permanently removes the user and all devices, revokes client access immediately, and puts the egress IP into cooldown."), tr("Delete")))) return;

      const r = await form(tr("Add headless device"), [{ name: "name", label: tr("Device name"), required: true, hint: tr("For scripts and servers. The token authenticates config requests.") }],
        (v) => api("POST", "/admin/users/" + enc(name) + "/devices", { name: v.name }), tr("Add"));
      if (r) { reveal(tr("Token for {device}", { device: r.device }), tr("Send this token as Authorization: Bearer when calling GET /v1/config."), r.token); route(); }

    $$("[data-revoke]").forEach((b) => b.onclick = async () => {
      if (!(await confirmBox(tr("Revoke {device}", { device: b.dataset.revoke }), trHTML("The device credential expires immediately and the client disconnects and signs out."), tr("Revoke")))) return;
      if (await act(() => api("POST", "/admin/users/" + enc(name) + "/devices/" + enc(b.dataset.revoke) + "/revoke"), tr("Revoked"))) route();
    });
  }

  // ---- alerts ---------------------------------------------------------------------------------------------
  const RULES = { egress_probe_failing: "Egress probe failed", entry_unreachable: "Entry unreachable", agent_stale: "Egress host offline", singbox_down: "sing-box stopped", agent_out_of_sync: "Config out of sync", subscription_waiting_ip: "Paid customer waiting for an IP" };

      (a.notify_error ? `<div class="line" style="color:var(--bad)">${trHTML("Notification failed: {detail}", { detail: consoleMessage(a.notify_error) })}</div>` : "") + "</td><td>" + fmtTime(a.fired_at || a.started_at) + "</td><td>" + (a.state === "resolved" ? fmtTime(a.resolved_at) : a.state === "pending" ? `<span class="badge">${trHTML("Pending")}</span>` : `<span class="badge bad">${trHTML("Firing")}</span>`) + "</td></tr>";

      `<div class="section"><h2>${trHTML("Active alerts")}</h2><div class="table-wrap"><table>` + head + "<tbody>" + (firing.map(row).join("") || `<tr><td colspan="6" class="empty">${trHTML("No active alerts.")}</td></tr>`) + "</tbody></table></div></div>" +
      `<div class="section"><h2>${trHTML("History (30 days)")}</h2><div class="table-wrap"><table>` + head + "<tbody>" + (all.filter((a) => a.state !== "firing").map(row).join("") || `<tr><td colspan="6" class="empty">${trHTML("No records.")}</td></tr>`) + "</tbody></table></div></div>";

  // ---- settings -------------------------------------------------------------------------------------------
  const lines = (t) => t.split("\n").map((s) => s.trim()).filter(Boolean);
  PAGES.settings = async (_, token) => {

      field("domains", tr("Proxied domains"), (cp.domain_suffix || []).join("\n"), { area: true, ph: "example.com", hint: tr("Enter one domain or web URL per line. A URL adds its hostname and subdomains.") }) +
      field("direct_dns", tr("DNS for other domains"), cp.direct_dns || "dhcp", { hint: tr("Use dhcp for the DNS assigned by the local network, or enter an IP such as 223.5.5.5.") }) +
