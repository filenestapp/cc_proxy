      `<button class="primary" type="submit">${trHTML("Save routing policy")}</button><p class="small muted">${trHTML("Clients check for and apply updates every 30 seconds.")}</p></form>` +
      `<form class="card" id="s-ip"><h2>${trHTML("Egress IPs")}</h2>` + field("cooldown", tr("Cooldown after release (days)"), Math.round((s.cooldown_seconds || 0) / 86400 * 10) / 10, { type: "number", hint: tr("Released IPs stay out of the available pool during cooldown.") }) +
      `<button class="primary" type="submit">${trHTML("Save")}</button></form>` +
      `<form class="card" id="s-monitor"><h2>${trHTML("Health probes")}</h2>` +
      field("targets", tr("Egress probe targets"), (mon.egress_targets || []).join("\n"), { area: true, ph: "https://www.example.com/", hint: tr("One URL per line. The agent probes each URL from every egress IP on its configured interval. HTTP 403 and 429 count as failures.") }) +
      field("entries", tr("Additional entries"), (mon.entries || []).map((e) => e.name + " " + e.host + ":" + e.port).join("\n"), { area: true, ph: "hk-relay 192.0.2.1:443", hint: tr("Enter one name and address:port per line. Egress hosts are included automatically.") }) +
      `<button class="primary" type="submit">${trHTML("Save probe settings")}</button></form>` +
      `<form class="card" id="s-alerts"><h2>${trHTML("Alerts")}</h2>` +
      field("hooks", tr("Webhook"), (al.webhooks || []).map((w) => (w.format || "generic") + " " + w.url).join("\n"), { area: true, ph: "feishu https://open.feishu.cn/open-apis/bot/v2/hook/...", hint: tr("Enter one format and URL per line. Formats: generic, feishu, dingtalk, wecom, slack. Alerts include IPs and usernames.") }) +
      field("fails", tr("Alert after consecutive failures"), al.consecutive_failures ?? 3, { type: "number" }) +
      field("stale", tr("Host offline threshold (seconds)"), al.agent_stale_seconds ?? 120, { type: "number" }) +
      field("sync", tr("Config sync threshold (seconds)"), al.out_of_sync_seconds ?? 300, { type: "number" }) +
      field("repeat", tr("Alert repeat interval (seconds, 0 disables repeats)"), al.repeat_seconds ?? 0, { type: "number" }) +
      `<button class="primary" type="submit">${trHTML("Save alert settings")}</button></form></div>`;
    const save = (id, build, text) => {
      const formEl = $(id);
      formEl.noValidate = true;
      formEl.onsubmit = async (e) => {
        e.preventDefault();
        if (!validateForm(formEl, (message) => toast(message, true))) return;
        let body;
        try { body = build(); } catch (err) { return toast(err.message, true); }
        if (await act(() => api("PUT", "/admin/settings", body), text)) route();
      };
    };
    save("#s-policy", () => ({ client_policy: Object.assign({}, cp, { domain_suffix: lines($("#domains").value).map((d) => d.replace(/^\./, "").toLowerCase()), direct_dns: $("#direct_dns").value.trim() || "dhcp", block_quic: $("#block_quic").checked }) }), tr("Routing policy saved."));
    save("#s-ip", () => ({ cooldown_seconds: Math.round(Number($("#cooldown").value) * 86400) }), tr("Saved."));
    save("#s-monitor", () => ({ monitor: { egress_targets: lines($("#targets").value), entries: lines($("#entries").value).map((l) => {
      const m = l.match(/^(\S+)\s+(\S+):(\d+)$/); if (!m) throw new Error(tr("Invalid additional entry: {entry}", { entry: l })); return { name: m[1], host: m[2], port: Number(m[3]) }; }) } }), tr("Probe settings saved."));
    save("#s-alerts", () => ({ alerts: Object.assign({}, al, {
      webhooks: lines($("#hooks").value).map((l) => { const [f, ...rest] = l.split(/\s+/); const url = rest.join(" "); if (!url) return { url: f, format: "generic" }; return { format: f, url }; }),
      consecutive_failures: Number($("#fails").value), agent_stale_seconds: Number($("#stale").value), out_of_sync_seconds: Number($("#sync").value), repeat_seconds: Number($("#repeat").value) }) }), tr("Alert settings saved."));
  };

  // ---- usage ----------------------------------------------------------------------------------------------
  const UNITS = ["B", "KiB", "MiB", "GiB", "TiB", "PiB"];
  function fmtBytes(n) {
    let v = Number(n || 0), i = 0;
    while (v >= 1024 && i < UNITS.length - 1) { v /= 1024; i++; }
    return (i === 0 ? String(v) : v.toFixed(v < 10 ? 2 : v < 100 ? 1 : 0)) + " " + UNITS[i];
  }
  const exact = (n) => tr("{count} bytes", { count: Number(n || 0).toLocaleString(language) });
  const USAGE_STATUS = { complete: ["Measured", "ok"], incomplete: ["Incomplete", "warn"], unavailable: ["Not measured", ""] };
  const COLLECTOR_STATUS = { collecting: ["Collecting", "ok"], starting: ["Starting", "warn"], error: ["Error", "bad"], stale: ["Stale", "bad"], unavailable: ["Unavailable", ""] };
  // The API returns calendar dates in the reporting zone. Format the dates
  // as written so the browser's time zone never moves a period boundary.
  const formatUsageDate = (date, options) => date.toLocaleDateString(language, { timeZone: "UTC", ...options });
  function usageLabel(period, startDate, endDate) {
    const start = new Date(startDate + "T00:00:00Z");
    if (period === "month") return formatUsageDate(start, { year: "numeric", month: "long" });
    const shortDate = { month: "short", day: "numeric" };
    if (period === "week") {
      const first = formatUsageDate(start, shortDate);
      if (!endDate) return tr("Week of {date}", { date: first });
      const last = new Date(Date.parse(endDate + "T00:00:00Z") - 86400000);
      return tr("{start} – {end}", { start: first, end: formatUsageDate(last, { year: "numeric", ...shortDate }) });
    }
    return formatUsageDate(start, { weekday: "short", year: "numeric", ...shortDate });
  }

  PAGES.usage = async (_, token) => {
    setTitle(tr("Usage"));
    const params = new URLSearchParams(location.hash.split("?")[1] || "");
    const query = new URLSearchParams();
    for (const key of ["period", "date", "user", "device"]) if (params.get(key)) query.set(key, params.get(key));
    const r = await api("GET", "/admin/usage?" + query.toString());
    if (!current(token)) return;
    const go = (changes) => {
      const next = new URLSearchParams({ period: r.period, date: r.start });
      if (r.user) next.set("user", r.user);
      if (r.device) next.set("device", r.device);
      for (const [k, v] of Object.entries(changes)) { if (v) next.set(k, v); else next.delete(k); }
      location.hash = "#/usage?" + next.toString();
    };
    const measured = r.rows.filter((row) => row.status !== "unavailable").length;
    const incomplete = r.rows.filter((row) => row.status === "incomplete").length;
    const option = (value, label, selected) => `<option value="${esc(value)}"${selected ? " selected" : ""}>${esc(label)}</option>`;
    const row = (u) => {
      const [label, tone] = USAGE_STATUS[u.status] || [u.status, ""];
      const off = u.status === "unavailable";
      const state = u.device_state !== "active" ? ' <span class="badge ' + (u.device_state === "deleted" ? "bad" : "warn") + '">' + esc(u.device_state === "deleted" ? tr("Deleted") : tr("Revoked")) + "</span>" : "";
      const bytes = (n) => off ? `<td class="num muted" title="${trHTML("No collector measured this device in this period")}">—</td>` : `<td class="num" title="${esc(exact(n))}">${fmtBytes(n)}</td>`;
      return `<tr><td>${esc(u.user)}</td><td>${esc(u.device)}${state}</td>${bytes(u.upload)}${bytes(u.download)}${bytes(u.total)}` +
        `<td><span class="badge ${tone}">${trHTML(label)}</span>${u.reasons.length ? '<div class="usage-why">' + u.reasons.map((reason) => esc(consoleMessage(reason))).join("<br>") + "</div>" : ""}</td>` +
        `<td class="mono small nowrap">${u.hosts.map(esc).join(", ") || "—"}</td></tr>`;
    };
    const collector = (c) => {
      const [label, tone] = COLLECTOR_STATUS[c.status] || [c.status, ""];
      return `<tr><td class="nowrap"><a href="#/hosts/${enc(c.host)}">${esc(c.host)}</a></td><td><span class="badge ${tone}">${trHTML(label)}</span></td>` +
        `<td class="small">${esc(consoleMessage(c.note))}</td><td class="mono small">${esc(c.agent_version || "—")}</td>` +
        `<td class="mono small">${esc(c.singbox_version || "—")}</td><td>${c.last_report ? ago(now() - c.last_report) : "—"}</td></tr>`;
    };
    const lost = r.hosts.map((h) => `<tr><td class="nowrap">${esc(h.host)}</td><td class="num" title="${esc(exact(h.unattributed_upload))}">${fmtBytes(h.unattributed_upload)}</td>` +
      `<td class="num" title="${esc(exact(h.unattributed_download))}">${fmtBytes(h.unattributed_download)}</td>` +
      `<td class="num" title="${esc(exact(h.rejected_upload))}">${fmtBytes(h.rejected_upload)}</td><td class="num" title="${esc(exact(h.rejected_download))}">${fmtBytes(h.rejected_download)}</td>` +
      `<td class="num" title="${esc(exact(h.unresolved_upload))}">${fmtBytes(h.unresolved_upload)}</td><td class="num" title="${esc(exact(h.unresolved_download))}">${fmtBytes(h.unresolved_download)}</td></tr>`).join("");
    const recorded = r.recorded_periods.includes(r.start) ? r.recorded_periods : [r.start].concat(r.recorded_periods);
    $("#view").innerHTML = `
      <div class="table-toolbar">
        <select id="u-period" aria-label="${trHTML("Period")}">${option("day", tr("Day"), r.period === "day")}${option("week", tr("Week"), r.period === "week")}${option("month", tr("Month"), r.period === "month")}</select>
        <span class="usage-nav"><button id="u-prev" type="button" aria-label="${trHTML("Previous period")}">‹</button><b id="u-label">${esc(usageLabel(r.period, r.start, r.end))}</b>
          <button id="u-next" type="button" aria-label="${trHTML("Next period")}"${r.next ? "" : " disabled"}>›</button></span>
        <select id="u-recorded" aria-label="${trHTML("Recorded periods")}">${recorded.map((d) => option(d, usageLabel(r.period, d), d === r.start)).join("")}</select>
        <select id="u-user" aria-label="${trHTML("User")}">${option("", tr("All users"), !r.user)}${r.users.map((u) => option(u, u, u === r.user)).join("")}</select>
        <select id="u-device" aria-label="${trHTML("Device")}">${option("", tr("All devices"), !r.device)}${r.devices.map((d) => option(d, d, d === r.device)).join("")}</select>
        <span class="spacer"></span><button id="u-refresh" type="button">${icon("refresh")} ${trHTML("Refresh")}</button>
      </div>
      <div class="summary" aria-label="${trHTML("Usage summary")}">
        ${metric(tr("Upload"), fmtBytes(r.totals.upload), exact(r.totals.upload))}
        ${metric(tr("Download"), fmtBytes(r.totals.download), exact(r.totals.download))}
        ${metric(tr("Total"), fmtBytes(r.totals.total), r.in_progress ? tr("This period so far") : exact(r.totals.total))}
        ${metric(tr("Devices measured"), measured + " / " + r.rows.length, incomplete ? tr("{count} incomplete", { count: incomplete }) : "")}
      </div>
      <p class="small muted">${trHTML("Calendar periods in Asia/Singapore (UTC+8); weeks start on Monday. Each exit assigns traffic to the hour in which it observed it, so a boundary moves at most a fraction of a second of traffic. “Not measured” means no collector covered the device; a measured device with no traffic shows 0 B.")}</p>
      <div class="table-wrap"><table><thead><tr><th>${trHTML("User")}</th><th>${trHTML("Device")}</th><th class="num">${trHTML("Upload")}</th><th class="num">${trHTML("Download")}</th><th class="num">${trHTML("Total")}</th><th>${trHTML("Status")}</th><th>${trHTML("Exits")}</th></tr></thead><tbody>
        ${r.rows.map(row).join("") || `<tr><td colspan="7" class="empty">${trHTML("No devices match these filters.")}</td></tr>`}</tbody></table></div>
      ${lost ? `<section class="section"><h2>${trHTML("Traffic not attributed to a device")}</h2><div class="table-wrap"><table><thead><tr><th>${trHTML("Exit")}</th><th class="num">${trHTML("Unattributed upload")}</th><th class="num">${trHTML("Unattributed download")}</th><th class="num">${trHTML("Rejected upload")}</th><th class="num">${trHTML("Rejected download")}</th><th class="num">${trHTML("Unresolved upload")}</th><th class="num">${trHTML("Unresolved download")}</th></tr></thead><tbody>${lost}</tbody></table></div>
        <p class="small muted">${trHTML("Rejected bytes were reported for names the exit was never configured with. Unresolved bytes were reported under names that two devices had during the same hour (an account deleted and recreated); they are not assigned to either device.")}</p></section>` : ""}
      <section class="section"><h2>${trHTML("Usage collection by exit")}</h2><div class="table-wrap"><table><thead><tr><th>${trHTML("Exit")}</th><th>${trHTML("Collection")}</th><th>${trHTML("Details")}</th><th>${trHTML("Agent")}</th><th>sing-box</th><th>${trHTML("Last report")}</th></tr></thead><tbody>
        ${r.collectors.map(collector).join("") || `<tr><td colspan="6" class="empty">${trHTML("No exits.")}</td></tr>`}</tbody></table></div></section>`;
    $("#u-period").onchange = (e) => go({ period: e.target.value });
    $("#u-prev").onclick = () => go({ date: r.previous });
    $("#u-next").onclick = () => r.next && go({ date: r.next });
    $("#u-recorded").onchange = (e) => go({ date: e.target.value });
    $("#u-user").onchange = (e) => go({ user: e.target.value, device: "" });
    $("#u-device").onchange = (e) => go({ device: e.target.value });
    $("#u-refresh").onclick = route;
  };

  // ---- billing --------------------------------------------------------------------------------------------
  const money = (amount, currency = "cny") => new Intl.NumberFormat(language, { style: "currency", currency: currency.toUpperCase(), minimumFractionDigits: 2 }).format((amount || 0) / 100);
  function billingBadge(status) {
    const tone = { active: "ok", paid: "ok", past_due: "warn", pending: "warn", failed: "bad", cancelled: "bad", expired: "bad", refunded: "bad" }[status] || "";
    return statusBadge({ label: tr(status.replaceAll("_", " ")), tone });
  }

  function mailboxBadge(mailbox) {
    if (mailbox.setup_pending && !["deleting", "deleted"].includes(mailbox.status)) {
      return `<span class="badge warn">${trHTML("Setup pending")}</span>`;
    }
    return billingBadge(mailbox.status);
  }

  async function openMailboxForm(customerID, email, mailbox) {
    const result = await form(tr("Set up mailbox for {email}", { email }), [{
      name: "local_part", label: tr("Mailbox name"), required: true,
      value: mailbox?.address.split("@")[0], hint: tr("The address will end in @aifree.sg."),
    }], (values) => api("POST", "/admin/customers/" + enc(customerID) + "/mailbox", values), tr("Set up"));
    if (!result) return;
    reveal(tr("Mailbox created"), tr("Initial password for {email}", { email: result.mailbox.address }), result.initial_password);
    route();
  }

  PAGES.customers = async (_, token) => {
    setTitle(tr("Customers"));
    const customers = await api("GET", "/admin/customers");
    if (!current(token)) return;
    const rows = customers.map((c) => {
      const mailbox = c.mailbox;
      const setup = c.mailbox_entitled && (!mailbox || (mailbox.setup_pending && mailbox.status !== "deleting"));
      const next = c.status === "active" ? "suspended" : "active";
      return `<tr><td class="mono">${c.id}</td><td>${esc(c.email)}</td><td>${c.email_verified ? tr("Verified") : tr("Unverified")}</td>
        <td>${billingBadge(c.status)}</td><td class="mono">${esc(c.user_name || "—")}</td>
        <td>${mailbox ? '<span class="mono">' + esc(mailbox.address) + "</span> " + mailboxBadge(mailbox) : "—"}</td>
        <td class="actions">${setup ? '<button class="link" data-mailbox-create="' + c.id + '">' + (mailbox ? tr("Finish mailbox setup") : tr("Create mailbox")) + "</button>" : ""}
        <button class="link" data-customer-status="${next}" data-customer-id="${c.id}">${next === "suspended" ? tr("Suspend") : tr("Restore")}</button></td></tr>`;
    }).join("");
    $("#view").innerHTML = `<p class="small muted">${trHTML("Suspending revokes customer and device sessions and disables mailbox access. For billing changes, use Stripe.")}</p><div class="toolbar"><span class="muted">${trHTML("{count} customers", { count: customers.length })}</span><span class="spacer"></span><button id="refresh">${trHTML("Refresh")}</button></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>${trHTML("Email")}</th><th>${trHTML("Verification")}</th><th>${trHTML("Status")}</th><th>${trHTML("Proxy user")}</th><th>${trHTML("Mailbox")}</th><th></th></tr></thead><tbody>` + (rows || `<tr><td colspan="7" class="empty">${trHTML("No customers.")}</td></tr>`) + "</tbody></table></div>";
    $("#refresh").onclick = route;
    $$("[data-mailbox-create]").forEach((button) => button.onclick = () => {
      const customer = customers.find((c) => String(c.id) === button.dataset.mailboxCreate);
      return openMailboxForm(customer.id, customer.email, customer.mailbox);
    });
    $$('[data-customer-id]').forEach((button) => button.onclick = async () => {
      const status = button.dataset.customerStatus;
      if (await act(() => api("PUT", "/admin/customers/" + button.dataset.customerId, { status }), status === "suspended" ? tr("Customer suspended.") : tr("Customer restored."))) route();
    });
  };
  PAGES.mailboxes = async (_, token) => {
    setTitle(tr("Mailboxes"));
    const mailboxes = await api("GET", "/admin/mailboxes");
    if (!current(token)) return;
    const rows = mailboxes.map((m) => `<tr><td class="mono">${esc(m.address)}</td><td>${esc(m.customer_email)}</td>
      <td>${mailboxBadge(m)}</td><td>${fmtTime(m.reclaim_at)}</td><td class="actions">
        ${m.status === "active" ? '<button class="link" data-mailbox-action="disable" data-mailbox-id="' + m.id + `">${trHTML("Disable")}</button>` : ""}
        ${m.status === "disabled" && m.entitled ? '<button class="link" data-mailbox-action="enable" data-mailbox-id="' + m.id + `">${trHTML("Enable")}</button>` : ""}
        ${m.status !== "deleted" ? '<button class="link danger" data-mailbox-action="delete" data-mailbox-id="' + m.id + `">${trHTML("Delete")}</button>` : ""}
      </td></tr>`).join("");
    $("#view").innerHTML = `<div class="toolbar"><span class="spacer"></span><button id="refresh">${trHTML("Refresh")}</button></div><div class="table-wrap"><table><thead><tr><th>${trHTML("Mailbox")}</th><th>${trHTML("Customer")}</th><th>${trHTML("Status")}</th><th>${trHTML("Scheduled deletion")}</th><th></th></tr></thead><tbody>` + (rows || `<tr><td colspan="5" class="empty">${trHTML("No mailboxes.")}</td></tr>`) + "</tbody></table></div>";
    $("#refresh").onclick = route;
    $$("[data-mailbox-action]").forEach((button) => button.onclick = async () => {
      const m = mailboxes.find((entry) => String(entry.id) === button.dataset.mailboxId);
      const path = "/admin/mailboxes/" + enc(m.id);
      const action = button.dataset.mailboxAction;
      if (action === "delete") {
        const saved = await form(tr("Permanently delete mailbox"), [{
          name: "confirm", label: tr("Mailbox address"), required: true,
          hint: tr("Enter {email} to delete this mailbox and its messages.", { email: m.address }),
        }], async (values) => {
          await api("DELETE", path, values);
          return true;
        }, tr("Delete mailbox"));
        if (saved) route();
        return;
      }
      if (await act(async () => {
        await api("POST", path + "/" + action);
        return true;
      }, action === "disable" ? tr("Mailbox disabled.") : tr("Mailbox enabled."))) route();
    });
  };
  PAGES.plans = async (_, token) => {
    setTitle(tr("Plans"));
    const plans = await api("GET", "/admin/plans");
    if (!current(token)) return;
    const rows = plans.map((plan) => '<tr><td>' + esc(plan.name) + '</td><td>' + money(plan.amount, plan.currency) +
      '</td><td class="mono">' + esc(plan.stripe_price_id || "—") + '</td><td>' + (plan.active ? tr("Active") : tr("Hidden")) +
      '</td><td class="actions"><button class="link" data-edit-plan="' + esc(plan.code) + `">${trHTML("Edit")}</button></td></tr>`).join("");
    $("#view").innerHTML = `<div class="table-wrap"><table><thead><tr><th>${trHTML("Plan")}</th><th>${trHTML("Monthly price")}</th><th>${trHTML("Stripe Price ID")}</th><th>${trHTML("Availability")}</th><th></th></tr></thead><tbody>` + rows + '</tbody></table></div>';
    $$('[data-edit-plan]').forEach((button) => button.onclick = async () => {
      const plan = plans.find((entry) => entry.code === button.dataset.editPlan);
      const saved = await form(tr("Edit {plan}", { plan: plan.name }), [
        { name: "name", label: tr("Display name"), value: plan.name, required: true },
        { name: "price", label: tr("Monthly price (CNY)"), value: (plan.amount / 100).toFixed(2), required: true },
        { name: "stripe_price_id", label: tr("Stripe Price ID"), value: plan.stripe_price_id, hint: tr("Use a monthly CNY Price with the same amount.") },
        { name: "active", label: tr("Available for new subscriptions"), type: "checkbox", value: plan.active },
      ], (values) => {
        const amount = Math.round(Number(values.price) * 100);
        if (!/^\d+(\.\d{1,2})?$/.test(values.price) || amount < 1 || amount > 2147483647) {

  PAGES.subscriptions = async (_, token) => {

    const subscriptions = await api("GET", "/admin/subscriptions");
    if (!current(token)) return;

    $("#view").innerHTML = `<div class="toolbar"><span class="muted">${trHTML("{count} subscriptions", { count: subscriptions.length })}</span><span class="spacer"></span><button id="refresh">${trHTML("Refresh")}</button></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>${trHTML("Customer")}</th><th>${trHTML("Plan")}</th><th>${trHTML("Status")}</th><th>${trHTML("Period end")}</th><th>${trHTML("Renewal")}</th></tr></thead><tbody>` + (rows || `<tr><td colspan="6" class="empty">${trHTML("No subscriptions.")}</td></tr>`) + "</tbody></table></div>";
    $("#refresh").onclick = route;
  };
  PAGES.orders = async (_, token) => {
    setTitle(tr("Orders"));
    const orders = await api("GET", "/admin/orders");
    if (!current(token)) return;
    const rows = orders.map((o) => '<tr><td class="mono">' + o.id + '</td><td>' + esc(o.email) + "</td><td class=\"mono\">" + (o.subscription_id || "—") + "</td><td>" + money(o.amount, o.currency) + "</td><td>" + billingBadge(o.status) + "</td><td>" + fmtTime(o.paid_at) + "</td><td>" + (o.receipt_url ? '<a href="' + esc(o.receipt_url) + `" target="_blank" rel="noreferrer">${trHTML("Receipt")}</a>` : "—") + "</td></tr>").join("");
    $("#view").innerHTML = `<div class="toolbar"><span class="muted">${trHTML("{count} orders", { count: orders.length })}</span><span class="spacer"></span><button id="refresh">${trHTML("Refresh")}</button></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>${trHTML("Customer")}</th><th>${trHTML("Subscription")}</th><th>${trHTML("Amount")}</th><th>${trHTML("Status")}</th><th>${trHTML("Paid")}</th><th></th></tr></thead><tbody>` + (rows || `<tr><td colspan="7" class="empty">${trHTML("No orders.")}</td></tr>`) + "</tbody></table></div>";
    $("#refresh").onclick = route;
  };
  PAGES.provisioning = async (_, token) => {
    setTitle(tr("Provisioning queue"));
    const items = await api("GET", "/admin/provisioning");
    if (!current(token)) return;
    const rows = items.map((item) => '<tr><td class="mono">' + item.id + "</td><td>" + trHTML(item.kind.replaceAll("_", " ")) + "</td><td>" + esc(item.email) + "</td><td class=\"mono\">" + item.subscription_id + "</td><td>" + fmtTime(item.created_at) + '</td><td class="actions"><button class="link" data-done="' + item.id + `">${trHTML("Mark done")}</button></td></tr>`).join("");
    $("#view").innerHTML = `<div class="toolbar"><span class="muted">${trHTML("{count} items need action", { count: items.length })}</span><span class="spacer"></span><button id="refresh">${trHTML("Refresh")}</button></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>${trHTML("Type")}</th><th>${trHTML("Customer")}</th><th>${trHTML("Subscription")}</th><th>${trHTML("Queued")}</th><th></th></tr></thead><tbody>` + (rows || `<tr><td colspan="6" class="empty">${trHTML("No provisioning tasks.")}</td></tr>`) + "</tbody></table></div>";
    $("#refresh").onclick = route;
    $$('[data-done]').forEach((button) => button.onclick = async () => {
      const note = prompt(tr("Completion note (optional):")) ?? null;
      if (note === null) return;
      if (await act(() => api("POST", "/admin/provisioning/" + button.dataset.done + "/done", { note }), tr("Marked done."))) route();
    });
  };

  // ---- audit ----------------------------------------------------------------------------------------------
  PAGES.audit = async (_, token) => {
    setTitle(tr("Audit log"));
    let rows = [], done = false;
    $("#view").innerHTML = `<div class="toolbar"><input id="actor" placeholder="${trHTML("Filter by actor")}" type="search"><button id="apply">${trHTML("Filter")}</button><span class="spacer"></span><span class="muted small">${trHTML("Retained for 180 days. Sensitive values are omitted.")}</span></div><div id="a-table"></div><div class="toolbar" style="margin-top:12px"><button id="more">${trHTML("Load more")}</button></div>`;
    const draw = () => {
      $("#a-table").innerHTML = `<div class="table-wrap"><table><thead><tr><th>${trHTML("Time")}</th><th>${trHTML("Actor")}</th><th>${trHTML("Action")}</th><th>${trHTML("Subject")}</th><th>${trHTML("Details")}</th><th>${trHTML("Source")}</th></tr></thead><tbody>` +
        (rows.map((r) => "<tr><td>" + fmtTime(r.at) + "</td><td>" + esc(r.actor) + '</td><td class="mono small">' + trHTML(r.action) + '</td><td class="mono small">' + esc(r.target) + '</td><td class="mono small" style="max-width:360px;overflow-wrap:anywhere">' + esc(r.detail) + '</td><td class="mono small">' + esc(r.address) + "</td></tr>").join("") ||
          `<tr><td colspan="6" class="empty">${trHTML("No records.")}</td></tr>`) + "</tbody></table></div>";
      $("#more").hidden = done;
    };
    const load = async (reset) => {
      const actor = $("#actor").value.trim();
      const before = !reset && rows.length ? rows[rows.length - 1].id : "";
      const page = await api("GET", "/admin/audit?limit=100" + (before ? "&before=" + before : "") + (actor ? "&actor=" + enc(actor) : ""));
      if (!current(token)) return;
      rows = reset ? page : rows.concat(page);
      done = page.length < 100;
      draw();
    };
    $("#apply").onclick = () => act(() => load(true));
    $("#actor").onkeydown = (e) => { if (e.key === "Enter") act(() => load(true)); };
    $("#more").onclick = () => act(() => load(false));
    await load(true);
  };

  // ---- admins ---------------------------------------------------------------------------------------------
  PAGES.admins = async (_, token) => {
    setTitle(tr("Administrators"));
    const admins = await api("GET", "/admin/admins");
    if (!current(token)) return;
    $("#view").innerHTML = `<div class="toolbar"><span class="muted">${trHTML("Signed in as {name}", { name: me })}</span><span class="spacer"></span><button id="mypw">${trHTML("Change my password")}</button><button class="primary" id="add">${trHTML("Add administrator")}</button></div>` +
      `<div class="table-wrap"><table><thead><tr><th>${trHTML("Administrator")}</th><th>${trHTML("Created")}</th><th>${trHTML("Last sign-in")}</th><th>${trHTML("Active sessions")}</th><th></th></tr></thead><tbody>` +
      admins.map((a) => "<tr><td><b>" + esc(a.name) + "</b>" + (a.name === me ? ` <span class="badge info">${trHTML("You")}</span>` : "") + "</td><td>" + fmtTime(a.created_at) + "</td><td>" + fmtTime(a.last_login) + "</td><td>" + a.sessions + '</td><td class="actions">' +
        (a.name !== me ? '<button class="link" data-reset="' + esc(a.name) + `">${trHTML("Reset password")}</button><button class="link danger" data-del="` + esc(a.name) + `">${trHTML("Delete")}</button>` : "") + "</td></tr>").join("") + "</tbody></table></div>" +
      `<p class="small muted">${trHTML("CLI tools and scripts can authenticate with CP_ADMIN_TOKEN. The audit log records them as api-token.")}</p>`;
    $("#add").onclick = async () => {
      const r = await form(tr("Add administrator"), [{ name: "name", label: tr("Username"), required: true }, { name: "password", label: tr("Password (optional)"), type: "password", hint: tr("Leave blank to generate a password. Use at least 8 characters.") }],
        (v) => api("POST", "/admin/admins", Object.assign({ name: v.name }, v.password ? { password: v.password } : {})), tr("Add"));
      if (!r) return;
      if (r.password) reveal(tr("Created administrator {name}", { name: r.name }), tr("Initial password"), r.password); else toast(tr("Added."));
      route();
    };
    $("#mypw").onclick = async () => {
      const r = await form(tr("Change my password"), [{ name: "password", label: tr("New password"), type: "password", required: true, hint: tr("Use at least 8 characters. Sign in again after changing it.") }],
        (v) => api("POST", "/admin/admins/" + enc(me) + "/password", { password: v.password }));
      if (r) showLogin("Password changed. Sign in again.");
    };
    $$("[data-reset]").forEach((b) => b.onclick = async () => {
      if (!(await confirmBox(tr("Reset {name} password", { name: b.dataset.reset }), trHTML("Generate a new password and immediately revoke all of the administrator's sessions."), tr("Reset")))) return;
      const r = await act(() => api("POST", "/admin/admins/" + enc(b.dataset.reset) + "/password"));
      if (r) reveal(tr("New password"), tr("New password for {name}", { name: b.dataset.reset }), r.password);
    });
    $$("[data-del]").forEach((b) => b.onclick = async () => {
      if (!(await confirmBox(tr("Delete administrator {name}", { name: b.dataset.del }), trHTML("This administrator loses access immediately."), tr("Delete")))) return;
      if (await act(() => api("DELETE", "/admin/admins/" + enc(b.dataset.del)), tr("Deleted."))) route();
    });
  };

  bindLanguage();
  boot();
})();
</script>
</body>
</html>
