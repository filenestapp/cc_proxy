<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CC Proxy 管理后台</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --ink: #1c2330; --muted: #677285; --line: #dde1e8; --hover: #f0f2f6;
    --accent: #2f5bea; --accent-ink: #fff; --accent-soft: #e8eefe;
    --ok: #17803d; --ok-soft: #e5f4ea; --bad: #c8322b; --bad-soft: #fbe9e7;
    --warn: #a86400; --warn-soft: #fdf1dc; --idle: #8a93a3; --idle-soft: #eef0f3;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --side: 208px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b2029; --ink: #e6e9ef; --muted: #98a2b3; --line: #2f3643; --hover: #232a35;
      --accent: #5b82ff; --accent-soft: #1e2a4a;
      --ok: #4cc27a; --ok-soft: #173323; --bad: #ff6b62; --bad-soft: #3a1d1c;
      --warn: #f0b24a; --warn-soft: #3a2c13; --idle: #7d8696; --idle-soft: #232934;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 7px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
  button:hover { background: var(--hover); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.danger { color: var(--bad); border-color: var(--bad); }
  button.link { border: 0; background: none; color: var(--accent); padding: 2px 6px; }
  button.link.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; width: 100%; }
  textarea { min-height: 96px; font-family: var(--mono); font-size: 13px; }
  input[type=checkbox] { width: auto; }
  .mono { font-family: var(--mono); }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }

  /* layout */
  .shell { display: grid; grid-template-columns: var(--side) 1fr; min-height: 100vh; }
  nav.side { background: var(--panel); border-right: 1px solid var(--line); padding: 16px 10px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  nav.side .brand { font-weight: 700; font-size: 15px; padding: 4px 10px 16px; }
  nav.side a { display: block; color: var(--ink); padding: 8px 10px; border-radius: 7px; margin-bottom: 2px; }
  nav.side a:hover { background: var(--hover); text-decoration: none; }
  nav.side a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  nav.side .count { float: right; font-size: 11px; background: var(--bad); color: #fff; border-radius: 999px; padding: 0 6px; }
  .main { min-width: 0; }
  header.top { display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
  header.top h1 { font-size: 17px; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .content { padding: 20px 24px 48px; max-width: 1400px; }
  @media (max-width: 760px) {
    .shell { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    nav.side { position: static; height: auto; display: flex; gap: 4px; overflow-x: auto; padding: 8px; border-right: 0; border-bottom: 1px solid var(--line); }
    nav.side .brand { display: none; }
    nav.side a { margin: 0; white-space: nowrap; }
    header.top, .content { padding-left: 16px; padding-right: 16px; }
  }

  /* blocks */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .section { margin-bottom: 20px; }
  .section > h2, .card > h2 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .section > h2 .spacer, .toolbar .spacer { flex: 1; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar input, .toolbar select { width: auto; min-width: 160px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--bg); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--hover); }
  td.actions { white-space: nowrap; text-align: right; }
  .empty { color: var(--muted); padding: 18px; text-align: center; }
  .badge { font-size: 11px; border-radius: 999px; padding: 1px 8px; white-space: nowrap; background: var(--idle-soft); color: var(--idle); display: inline-block; }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.bad { background: var(--bad-soft); color: var(--bad); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.info { background: var(--accent-soft); color: var(--accent); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .form-row { margin-bottom: 12px; }
  .form-row label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .form-row .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .form-row.check label { display: flex; gap: 8px; align-items: center; color: var(--ink); font-size: 14px; }

  /* topology (overview) */
  .summary { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-width: 92px; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12px; }
  .tcard { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--idle); border-radius: 8px; padding: 10px 12px; min-width: 0; }
  .tcard.ok { border-left-color: var(--ok); } .tcard.bad { border-left-color: var(--bad); } .tcard.warn { border-left-color: var(--warn); }
  .tgrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .thead { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .thead .tcard { flex: 1 1 240px; }
  .ttitle { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .ttitle b { font-family: var(--mono); overflow-wrap: anywhere; }
  .line { color: var(--muted); font-size: 12px; margin-top: 3px; overflow-wrap: anywhere; }
  .big { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ok); }
  .probe { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line); }
  .target { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; margin-top: 0; }
  .hist { display: flex; gap: 2px; margin-top: 4px; flex-wrap: wrap; }
  .hist i { width: 6px; height: 10px; border-radius: 1px; background: var(--ok); }
  .hist i.f { background: var(--bad); }
  .alerts { display: grid; gap: 6px; margin-bottom: 16px; }
  .alert { border-radius: 8px; padding: 8px 12px; border: 1px solid var(--line); background: var(--warn-soft); }
  .alert.critical { background: var(--bad-soft); }

  /* overlays */
  .overlay { position: fixed; inset: 0; background: rgba(15, 20, 30, .45); display: flex; align-items: flex-start; justify-content: center; padding: 8vh 16px 16px; z-index: 20; overflow-y: auto; }
  .modal { background: var(--panel); border-radius: 12px; width: 100%; max-width: 520px; padding: 18px 20px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .modal h3 { margin: 0 0 14px; font-size: 16px; }
  .modal .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .modal .err { color: var(--bad); font-size: 13px; min-height: 1.3em; }
  .secret { font-family: var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 10px; overflow-wrap: anywhere; user-select: all; }
  pre.snippet { font-family: var(--mono); font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 10px; white-space: pre-wrap; overflow-wrap: anywhere; user-select: all; margin: 8px 0 0; }
  .toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 30; max-width: calc(100vw - 32px); }
  .toast { background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.2); max-width: 420px; }
  .toast.bad { background: var(--bad); color: #fff; }

  /* login */
  .login { max-width: 360px; margin: 14vh auto; padding: 0 16px; }
  .login .card { padding: 22px; }
  .login h1 { font-size: 18px; margin: 0 0 4px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="login" class="login" hidden>
  <form class="card" id="login-form">
    <h1>CC Proxy 管理后台</h1>
    <p class="muted small" style="margin:0 0 16px">使用管理员账号登录</p>
    <div class="form-row"><label for="l-user">用户名</label><input id="l-user" autocomplete="username" required></div>
    <div class="form-row"><label for="l-pass">密码</label><input id="l-pass" type="password" autocomplete="current-password" required></div>
    <div class="err small" id="l-err" role="alert" style="color:var(--bad);min-height:1.4em"></div>
    <button class="primary" style="width:100%;margin-top:6px" type="submit">登录</button>
  </form>
</div>

<div id="app" class="shell" hidden>
  <nav class="side" aria-label="主导航">
    <div class="brand">CC Proxy</div>
    <a href="#/" data-nav="overview">概览</a>
    <a href="#/hosts" data-nav="hosts">出口主机</a>
    <a href="#/ips" data-nav="ips">出口 IP</a>
    <a href="#/users" data-nav="users">用户</a>
    <a href="#/alerts" data-nav="alerts">告警 <span class="count" id="alert-count" hidden></span></a>
    <a href="#/settings" data-nav="settings">设置</a>
    <a href="#/audit" data-nav="audit">审计日志</a>
    <a href="#/admins" data-nav="admins">管理员</a>
  </nav>
  <div class="main">
    <header class="top">
      <h1 id="title">概览</h1>
      <span class="muted small" id="who"></span>
      <button id="logout" type="button">退出</button>
    </header>
    <div class="content" id="view"></div>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(() => {
  "use strict";
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const STALE = 180;
  let csrf = null, me = null, timer = null, routeToken = 0;

  // ---- helpers --------------------------------------------------------------------------------------------
  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  const enc = encodeURIComponent;
  const fmtTime = (t) => (t ? new Date(t * 1000).toLocaleString("zh-CN", { hour12: false }) : "—");
  function ago(sec) {
    if (sec == null) return "—";
    sec = Math.max(0, Math.round(sec));
    if (sec < 60) return sec + " 秒前";
    if (sec < 3600) return Math.round(sec / 60) + " 分钟前";
    if (sec < 86400) return Math.round(sec / 3600) + " 小时前";
    return Math.round(sec / 86400) + " 天前";
  }
  const ms = (v) => (v == null ? "—" : v < 1 ? "<1 ms" : Math.round(v) + " ms");
  const hist = (h) => '<div class="hist" title="最近 ' + h.length + ' 次">' + h.map((ok) => '<i class="' + (ok ? "" : "f") + '"></i>').join("") + "</div>";
  const IP_STATUS = { assigned: ["已分配", "info"], available: ["空闲", ""], cooldown: ["冷却中", "warn"], banned: ["已封禁", "bad"] };
  const ipBadge = (s) => '<span class="badge ' + (IP_STATUS[s] || ["", ""])[1] + '">' + esc((IP_STATUS[s] || [s])[0]) + "</span>";
  const now = () => Date.now() / 1000;

  function toast(text, bad) {
    const el = document.createElement("div");
    el.className = "toast" + (bad ? " bad" : "");
    el.textContent = text;
    $("#toasts").appendChild(el);
    setTimeout(() => el.remove(), bad ? 6000 : 3000);
  }

  class ApiError extends Error {}

  async function api(method, path, body) {
    const opts = { method, headers: {}, credentials: "same-origin", cache: "no-store" };
    if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
    if (method !== "GET" && csrf) opts.headers["X-CSRF-Token"] = csrf;
    let resp;
    try { resp = await fetch(path, opts); } catch (e) { throw new ApiError("无法连接控制端：" + e.message); }
    let data = null;
    try { data = await resp.json(); } catch (e) { /* empty body */ }
    if (resp.status === 401 && path !== "/admin/session") { showLogin("登录已过期，请重新登录"); throw new ApiError("未登录"); }
    if (!resp.ok) throw new ApiError((data && data.error) || "HTTP " + resp.status);
    return data;
  }

  // Wrap an action: report errors as toasts, success optionally.
  async function act(fn, okText) {
    try { const r = await fn(); if (okText) toast(okText); return r; }
    catch (e) { if (e.message !== "未登录") toast(e.message, true); return undefined; }
  }

  // ---- modals ---------------------------------------------------------------------------------------------
  function overlay(html) {
    const ov = document.createElement("div");
    ov.className = "overlay";
    ov.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + "</div>";
    document.body.appendChild(ov);
    const close = () => ov.remove();
    ov.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
    return { ov, close };
  }

  /* fields: [{name, label, type: text|password|number|select|textarea|checkbox, value, options:[[v,label]], hint, placeholder, required}]
     onSubmit(values) may throw; its return value resolves the promise. */
  function form(title, fields, onSubmit, submitText = "保存") {
    return new Promise((resolve) => {
      const rows = fields.map((f, i) => {
        const id = "f" + i, req = f.required ? " required" : "";
        let input;
        if (f.type === "select") {
          input = '<select id="' + id + '" name="' + f.name + '">' + f.options.map(([v, l]) =>
            '<option value="' + esc(v) + '"' + (String(v) === String(f.value ?? "") ? " selected" : "") + ">" + esc(l) + "</option>").join("") + "</select>";
        } else if (f.type === "textarea") {
          input = '<textarea id="' + id + '" name="' + f.name + '" placeholder="' + esc(f.placeholder || "") + '"' + req + ">" + esc(f.value ?? "") + "</textarea>";
        } else if (f.type === "checkbox") {
          return '<div class="form-row check"><label><input type="checkbox" id="' + id + '" name="' + f.name + '"' + (f.value ? " checked" : "") + "> " + esc(f.label) + "</label>" + (f.hint ? '<div class="hint">' + esc(f.hint) + "</div>" : "") + "</div>";
        } else {
          input = '<input id="' + id + '" name="' + f.name + '" type="' + (f.type || "text") + '" value="' + esc(f.value ?? "") + '" placeholder="' + esc(f.placeholder || "") + '"' + req + (f.type === "password" ? ' autocomplete="new-password"' : "") + ">";
        }
        return '<div class="form-row"><label for="' + id + '">' + esc(f.label) + "</label>" + input + (f.hint ? '<div class="hint">' + esc(f.hint) + "</div>" : "") + "</div>";
      }).join("");
      const { ov, close } = overlay('<h3>' + esc(title) + '</h3><form novalidate>' + rows + '<div class="err" role="alert"></div><div class="buttons"><button type="button" data-cancel>取消</button><button class="primary" type="submit">' + esc(submitText) + "</button></div></form>");
      const formEl = $("form", ov);
      $("[data-cancel]", ov).onclick = () => { close(); resolve(undefined); };
      formEl.onsubmit = async (e) => {
        e.preventDefault();
        if (!formEl.reportValidity()) return;
        const values = {};
        fields.forEach((f, i) => {
          const el = $("#f" + i, ov);
          values[f.name] = f.type === "checkbox" ? el.checked : el.value.trim();
        });
        const btn = $("button[type=submit]", ov);
        btn.disabled = true;
        try { const r = await onSubmit(values); close(); resolve(r === undefined ? true : r); }
        catch (err) { $(".err", ov).textContent = err.message; btn.disabled = false; }
      };
      const first = $("input,select,textarea", ov); if (first) first.focus();
    });
  }

  function confirmBox(title, text, okText = "确认", danger = true) {
    return new Promise((resolve) => {
      const { ov, close } = overlay("<h3>" + esc(title) + "</h3><p>" + text + '</p><div class="buttons"><button type="button" data-no>取消</button><button type="button" class="' + (danger ? "danger" : "primary") + '" data-yes>' + esc(okText) + "</button></div>");
      $("[data-no]", ov).onclick = () => { close(); resolve(false); };
      $("[data-yes]", ov).onclick = () => { close(); resolve(true); };
      $("[data-yes]", ov).focus();
    });
  }

  // Show a credential exactly once (it cannot be retrieved later).
  function reveal(title, label, secret, extraHtml = "") {
    const { ov, close } = overlay("<h3>" + esc(title) + '</h3><p class="small muted">' + esc(label) + '（只显示这一次，请现在保存）</p><div class="secret" id="secret">' + esc(secret) + "</div>" + extraHtml +
      '<div class="buttons"><button type="button" data-copy>复制</button><button type="button" class="primary" data-ok>我已保存</button></div>');
    $("[data-copy]", ov).onclick = async () => {
      try { await navigator.clipboard.writeText(secret); toast("已复制"); } catch (e) { toast("复制失败，请手动选中复制", true); }
    };
    $("[data-ok]", ov).onclick = close;
  }

  // ---- auth -----------------------------------------------------------------------------------------------
  function showLogin(msg) {
    clearInterval(timer);
    csrf = null; me = null;
    $("#app").hidden = true;
    $("#login").hidden = false;
    $("#l-err").textContent = msg || "";
    $("#l-user").focus();
  }

  async function boot() {
    try {
      const s = await api("GET", "/admin/session");
      csrf = s.csrf; me = s.admin;
      start();
    } catch (e) { showLogin(); }
  }

  function start() {
    $("#login").hidden = true;
    $("#app").hidden = false;
    $("#who").textContent = me;
    route();
  }

  $("#login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("#l-err").textContent = "";
    try {
      const s = await api("POST", "/admin/session", { username: $("#l-user").value.trim(), password: $("#l-pass").value });
      csrf = s.csrf; me = s.admin;
      $("#l-pass").value = "";
      start();
    } catch (err) { $("#l-err").textContent = err.message === "wrong username or password" ? "用户名或密码错误" : err.message; }
  });
  $("#logout").onclick = async () => { await act(() => api("DELETE", "/admin/session")); showLogin("已退出"); };

  // ---- router ---------------------------------------------------------------------------------------------
  const PAGES = {};
  function route() {
    clearInterval(timer);
    const parts = (location.hash.replace(/^#\/?/, "") || "").split("/").map(decodeURIComponent);
    const page = parts[0] || "overview";
    const fn = PAGES[page] || PAGES.overview;
    $$("nav.side a").forEach((a) => a.classList.toggle("active", a.dataset.nav === (PAGES[page] ? page : "overview")));
    const token = ++routeToken;
    $("#view").innerHTML = '<div class="empty">加载中…</div>';
    fn(parts.slice(1), token).catch((e) => { if (token === routeToken && e.message !== "未登录") $("#view").innerHTML = '<div class="empty">加载失败：' + esc(e.message) + "</div>"; });
  }
  window.addEventListener("hashchange", () => { if (me) route(); });
  const setTitle = (t) => { $("#title").textContent = t; document.title = t + " · CC Proxy"; };
  const current = (token) => token === routeToken;
  function refreshEvery(sec, fn, token) { timer = setInterval(() => { if (current(token)) fn(); }, sec * 1000); }

  function updateAlertCount(alerts) {
    const n = alerts.filter((a) => a.state === "firing").length;
    $("#alert-count").hidden = !n;
    $("#alert-count").textContent = n;
  }

  // ---- overview (topology) --------------------------------------------------------------------------------
  function entryCard(e, t, title) {
    const best = e.best;
    const stale = !e.probes.length || e.probes.every((p) => t - p.at > STALE);
    const allBad = e.probes.length && e.probes.every((p) => !p.ok);
    const cls = !e.probes.length ? "" : allBad ? "bad" : stale ? "warn" : "ok";
    const rows = e.probes.map((p) => '<div class="line"><span class="mono">' + esc(p.source) + "</span> " +
      (p.ok ? ms(p.latency_ms) : '<span style="color:var(--bad)">不可达</span>') + " · " + ago(t - p.at) + hist(p.history) + "</div>").join("");
    return '<div class="tcard ' + cls + '"><div class="ttitle"><b>' + esc(title || e.name) + '</b><span class="badge ' + cls + '">' +
      (cls === "ok" ? "正常" : cls === "bad" ? "不可达" : cls === "warn" ? "数据过期" : "无数据") + "</span></div>" +
      '<div class="line mono">' + esc(e.host) + ":" + esc(e.port) + "</div>" +
      (best ? '<div class="big">' + ms(best.latency_ms) + ' <span class="line">最快 · ' + esc(best.source) + "</span></div>" : "") +

  function agentCard(a) {

  // Expand "a.b.c.d", "a.b.c.d-e", "a.b.c.d-a.b.c.e" and "a.b.c.d/n" (n >= 22) into addresses.
  function expandIps(text) {
    const toInt = (s) => { const p = s.split(".").map(Number); if (p.length !== 4 || p.some((x) => !(x >= 0 && x <= 255) || isNaN(x))) throw new Error("不是 IPv4 地址：" + s); return ((p[0] << 24) >>> 0) + (p[1] << 16) + (p[2] << 8) + p[3]; };
    const toStr = (n) => [n >>> 24, (n >> 16) & 255, (n >> 8) & 255, n & 255].join(".");
    const out = [];
    for (const raw of text.split(/[\s,]+/).filter(Boolean)) {
      let lo, hi;
      if (raw.includes("/")) {
        const [ip, bits] = raw.split("/"); const b = Number(bits);
        if (!(b >= 22 && b <= 32)) throw new Error("CIDR 前缀需在 /22 到 /32 之间：" + raw);
        const size = 2 ** (32 - b); lo = Math.floor(toInt(ip) / size) * size; hi = lo + size - 1;
      } else if (raw.includes("-")) {
        const [a, b] = raw.split("-"); lo = toInt(a); hi = b.includes(".") ? toInt(b) : (lo - (lo & 255)) + Number(b);
        if (!(hi >= lo)) throw new Error("范围不对：" + raw);
      } else { lo = hi = toInt(raw); }
      for (let n = lo; n <= hi; n++) { out.push(toStr(n)); if (out.length > 1024) throw new Error("一次最多添加 1024 个"); }
    }
    return out;
  }
  async function addIps(host) {

      hint: "每行一个，支持单个地址、末段范围（.10-20）、完整范围和 /22–/32 网段。这些地址必须已经由机房路由到这台主机；agent 会自动把它们加到网卡上。" }],
    (v) => api("POST", "/admin/hosts/" + enc(host) + "/ips", { ips: expandIps(v.ips) }), "添加");
    if (r) { toast("新增 " + r.added.length + " 个 IP"); route(); }

        (v) => api("POST", "/admin/admins/" + enc(me) + "/password", { password: v.password }));
      if (r) showLogin("密码已修改，请重新登录");
    };
    $$("[data-reset]").forEach((b) => b.onclick = async () => {
      if (!(await confirmBox("重置 " + b.dataset.reset + " 的密码", "生成一个新密码，对方的所有会话立即失效。", "重置"))) return;
      const r = await act(() => api("POST", "/admin/admins/" + enc(b.dataset.reset) + "/password"));
      if (r) reveal("新密码", b.dataset.reset + " 的新密码", r.password);
    });
    $$("[data-del]").forEach((b) => b.onclick = async () => {
      if (!(await confirmBox("删除管理员 " + b.dataset.del, "对方立即无法登录。", "删除"))) return;
      if (await act(() => api("DELETE", "/admin/admins/" + enc(b.dataset.del)), "已删除")) route();
    });
  };

  boot();
})();
</script>
</body>
</html>
