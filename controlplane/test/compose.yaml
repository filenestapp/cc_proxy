# Control-plane e2e (v2): two exit hosts, password sign-in, per-user entry ports.
#   lan 10.88.0.0/24  user side          wan 10.99.0.0/24  "the internet"
#   cp        lan 10.88.0.5   Go control plane; dashboard on 127.0.0.1:18443
#   db        data network   PostgreSQL; its volume is reset by run-e2e.sh
#   egress-hk lan 10.88.0.2   wan 10.99.0.2  + egress IPs 10.99.0.3-.6   (host hk-1, entry ports 20000-20099)
#   egress-jp lan 10.88.0.3   wan 10.99.0.12 + egress IPs 10.99.0.13-.14 (host jp-1, entry ports 30000-30099)
#   clients   lan 10.88.0.30  signs every device in, keeps its config current, one SOCKS port per device
#   probe     lan 10.88.0.40  egress/test/probe.py helpers; also prober.py as vantage point "user-lan"
#   sink      lan 10.88.0.50  webhook receiver for alerts
#   desktop   lan 10.88.0.60  the aifree client (client/cli) running a TUN, default route via egress-hk
#   echo      wan 10.99.0.10  target site; /strict refuses 10.99.0.6     decoy wan 10.99.0.20  Reality handshake
name: cp-e2e

x-node: &node
  image: egress-e2e-tunclient     # python + sing-box, built from egress/test/Dockerfile.tunclient
  build: { context: ../../egress/test, dockerfile: Dockerfile.tunclient }

x-agent: &agent
  <<: *node
  cap_add: [NET_ADMIN]
  entrypoint: ["/bin/sh", "-c"]
  command:
    - |
      set -e
      wan=$$(ip -o -4 addr | awk '/ 10\.99\.0\./ {print $$2; exit}')
      mkdir -p /etc/sing-box
      exec python3 -u /src/controlplane/agent.py --cp http://10.88.0.5:8443 --iface "$$wan" \
        --config /etc/sing-box/config.json --state-dir /var/lib/agent --interval 1 --settle 3 --max-delay 20 \
        --probe-interval 5 --run
  volumes: ["../:/src/controlplane:ro", "../../egress:/src/egress:ro"]
  profiles: [agents]   # started by run-e2e.sh once the hosts (and their agent tokens) exist

services:
  db:
    image: postgres:16
    environment: { POSTGRES_DB: controlplane, POSTGRES_USER: controlplane, POSTGRES_PASSWORD: e2e-postgres }
    volumes: ["db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "controlplane", "-d", "controlplane"]
      interval: 1s
      retries: 30
    networks: [data]

  cp:
    build: { context: .. }
    environment:
      DATABASE_URL: postgres://controlplane:e2e-postgres@db:5432/controlplane?sslmode=disable
      CP_ADMIN_TOKEN: "${CP_ADMIN_TOKEN}"
      CP_PROBE_TOKEN: "${CP_PROBE_TOKEN}"
    ports: ["127.0.0.1:18443:8443"]
    depends_on: { db: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cc-controlplane init --settings /out/settings.json
        exec cc-controlplane serve --listen 0.0.0.0
    volumes: ["./out:/out:ro"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8443/healthz"]
      interval: 1s
      retries: 30
    networks: { lan: { ipv4_address: 10.88.0.5 }, data: {} }

  decoy:
    image: caddy:2.10.2-alpine
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile"]
    volumes: ["../../egress/test/Caddyfile:/etc/caddy/Caddyfile:ro"]
    networks: { wan: { ipv4_address: 10.99.0.20 } }

  echo:
    image: python:3.12-alpine
    environment: { BLOCK_IPS: 10.99.0.6 }   # /strict refuses frank's IP, as a site blocking one egress IP would
    cap_add: [NET_ADMIN]
    entrypoint: ["/bin/sh", "-c"]
    # Route back to the user LAN through egress-hk, which doubles as the LAN's internet router (direct traffic).
    command: ["ip route add 10.88.0.0/24 via 10.99.0.2 && exec python -u /app/echo.py"]
    volumes: ["../../egress/test/echo.py:/app/echo.py:ro"]
    networks:
      wan:
        ipv4_address: 10.99.0.10
        aliases: [target.test, other.test]

  egress-hk:
    <<: *agent
    environment: { CP_AGENT_TOKEN: "${HK_TOKEN}" }
    sysctls: { net.ipv4.ip_forward: 1 }   # also the LAN's router to the wan, for the desktop client's direct traffic
    networks:
      lan: { ipv4_address: 10.88.0.2 }
      wan: { ipv4_address: 10.99.0.2 }

  egress-jp:
    <<: *agent
    environment: { CP_AGENT_TOKEN: "${JP_TOKEN}" }
    networks:
      lan: { ipv4_address: 10.88.0.3 }
      wan: { ipv4_address: 10.99.0.12 }

  clients:
    <<: *node
    profiles: [clients]          # started by run-e2e.sh after users exist
    entrypoint: ["python3", "-u", "/app/clients.py"]
    volumes: ["./clients.py:/app/clients.py:ro", "./out/creds:/creds:ro"]
    healthcheck: { test: ["CMD", "test", "-f", "/tmp/ready"], interval: 1s, retries: 30 }
    networks: { lan: { ipv4_address: 10.88.0.30 } }

  # The real client: aifree (client/cli) built for Linux, running a TUN in app mode as root.
  desktop:
    build: { context: ../../client, dockerfile: test/Dockerfile }
    image: cp-e2e-ccproxy
    profiles: [desktop]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    extra_hosts: ["other.test:10.99.0.10"]   # a non-rule name the client must leave alone
    init: true   # reap exited aifree processes so pgrep sees them gone
    # Like a real OS: the system resolver is an upstream server reached via the default route (here an off-link
    # address), so the TUN can hijack its queries. Docker's 127.0.0.11 is loopback and would bypass the TUN.
    command: ["/bin/sh", "-c", "ip route replace default via 10.88.0.2 && echo 'nameserver 192.0.2.53' > /etc/resolv.conf && exec sleep infinity"]
    volumes: ["../../client/test/desktop_probe.py:/app/desktop_probe.py:ro"]
    networks: { lan: { ipv4_address: 10.88.0.60 } }

  sink:
    image: python:3.12-alpine
    command: ["python", "-u", "/app/sink.py"]
    volumes: ["./sink.py:/app/sink.py:ro"]
    networks: { lan: { ipv4_address: 10.88.0.50 } }

  probe:
    image: python:3.12-alpine
    environment: { CP_PROBE_TOKEN: "${CP_PROBE_TOKEN}" }
    command: ["python", "-u", "/src/controlplane/prober.py", "--cp", "http://10.88.0.5:8443", "--vantage", "user-lan", "--interval", "5"]
    volumes: ["../../egress/test/probe.py:/app/probe.py:ro", "./cp_probe.py:/app/cp_probe.py:ro", "../:/src/controlplane:ro"]
    depends_on: { cp: { condition: service_healthy } }
    networks: { lan: { ipv4_address: 10.88.0.40 } }

networks:
  data:
    internal: true
  lan:
    ipam:
      config: [{ subnet: 10.88.0.0/24, gateway: 10.88.0.1, ip_range: 10.88.0.128/25 }]
  wan:
    ipam:
      config: [{ subnet: 10.99.0.0/24, gateway: 10.99.0.1, ip_range: 10.99.0.128/25 }]

volumes:
  db-data:
