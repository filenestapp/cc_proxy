<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>{{.Subject}}</title>
  <style>
    @media (prefers-color-scheme: dark) {
      .email-background { background-color: #0B1426 !important; }
      .email-card { background-color: #192741 !important; border-color: #3A4860 !important; }
      .email-heading { color: #F5F1EA !important; }
      .email-copy { color: #D7DCE5 !important; }
      .email-link { color: #FF9B82 !important; }
      .email-note { border-color: #3A4860 !important; }
    }
  </style>
</head>
<body class="email-background" style="margin:0;padding:0;background-color:#FAF7F2;">
  <span style="display:none;max-height:0;max-width:0;overflow:hidden;opacity:0;mso-hide:all;">{{.Intro}}</span>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="email-background" bgcolor="#FAF7F2" style="width:100%;background-color:#FAF7F2;">
    <tr>
      <td align="center" style="padding:32px 12px;">
        <!--[if mso]><table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="email-card" bgcolor="#FFFDF9" style="width:100%;max-width:600px;table-layout:fixed;background-color:#FFFDF9;border:1px solid #E7E3DA;">
          <tr>
            <td bgcolor="#14213D" style="padding:20px 28px;border-top:4px solid #F2643D;background-color:#14213D;color:#F5F1EA;font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:700;line-height:30px;letter-spacing:-0.6px;">
              aifree
            </td>
          </tr>
          <tr>
            <td style="padding:28px;font-family:Arial,Helvetica,sans-serif;">
              <h1 class="email-heading" style="margin:0 0 12px;color:#14213D;font-size:28px;line-height:34px;letter-spacing:-0.5px;">{{.Heading}}</h1>
              <p class="email-copy" style="margin:0 0 24px;color:#5B6577;font-size:16px;line-height:24px;">{{.Intro}}</p>
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td bgcolor="#F2643D" style="border-radius:6px;background-color:#F2643D;mso-padding-alt:13px 24px;">
                    <a href="{{.Link}}" style="display:block;padding:13px 24px;border-radius:6px;color:#14213D;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;line-height:20px;text-decoration:none;">{{.Action}}</a>
                  </td>
                </tr>
              </table>
              <p class="email-copy" style="margin:12px 0 20px;color:#5B6577;font-size:14px;line-height:21px;">{{.Expiry}}</p>
              <p class="email-copy" style="margin:0;color:#5B6577;font-size:14px;line-height:21px;">
                You can also open this link<br>
                <a class="email-link" href="{{.Link}}" style="color:#C2451F;text-decoration:underline;word-break:break-all;overflow-wrap:anywhere;">{{.Link}}</a>
              </p>
              <p class="email-copy email-note" style="margin:24px 0 0;padding-top:16px;border-top:1px solid #E7E3DA;color:#5B6577;font-size:14px;line-height:21px;">{{.Note}}</p>
            </td>
          </tr>
        </table>
        <!--[if mso]></td></tr></table><![endif]-->
      </td>
    </tr>
  </table>
</body>
</html>
