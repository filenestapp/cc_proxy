# Produce signed desktop updater artifacts after an explicit release decision on main.
name: desktop-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version to publish, for example 0.2.0
        required: true
        type: string
      notes:
        description: Optional customer-facing update notes
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      RUSTUP_TOOLCHAIN: stable
    defaults:
      run:
        shell: bash
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - name: Validate release credentials
        env:
          UPDATER_PUBLIC_KEY: ${{ secrets.AIFREE_UPDATER_PUBLIC_KEY }}
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$UPDATER_PUBLIC_KEY" && test -n "$SIGNING_KEY"
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup target add ${{ matrix.target }}
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sidecars
        env:
          AIFREE_RELEASE_VERSION: ${{ inputs.version }}
        run: desktop/scripts/fetch-binaries.sh ${{ matrix.target }}
      - name: Render release-only updater configuration
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          AIFREE_UPDATER_PUBLIC_KEY: ${{ secrets.AIFREE_UPDATER_PUBLIC_KEY }}
        run: node desktop/scripts/release-config.mjs desktop/src-tauri/tauri.conf.json desktop/src-tauri/tauri.release.conf.json "$RELEASE_VERSION" "$AIFREE_UPDATER_PUBLIC_KEY" https://downloads.aifree.sg/desktop/stable.json
      - name: Build signed updater artifacts
        working-directory: client/desktop/src-tauri
        env:
          AIFREE_UPDATER_PUBLIC_KEY: ${{ secrets.AIFREE_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: npx --yes @tauri-apps/cli@2.12.6 build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config tauri.release.conf.json -- --locked
      - name: Sign Debian updater packages when Tauri does not create their signatures
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          shopt -s nullglob
          for package in target/${{ matrix.target }}/release/bundle/deb/*.deb; do
            test -f "$package.sig" || npx --yes @tauri-apps/cli@2.12.6 signer sign --app-version "$RELEASE_VERSION" "$package"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: aifree-update-${{ matrix.target }}
          path: |
            client/target/${{ matrix.target }}/release/bundle/**/*.tar.gz
            client/target/${{ matrix.target }}/release/bundle/**/*.dmg
            client/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            client/target/${{ matrix.target }}/release/bundle/**/*.deb
            client/target/${{ matrix.target }}/release/bundle/**/*.sig
          if-no-files-found: error
          retention-days: 30

  macos:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: macos-15
    environment: release
    timeout-minutes: 35
    env:
      RUSTUP_TOOLCHAIN: stable
    defaults:
      run:
        shell: bash
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sidecars
        env:
          AIFREE_RELEASE_VERSION: ${{ inputs.version }}
        run: desktop/scripts/fetch-binaries.sh universal-apple-darwin
      - name: Render release-only updater configuration
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          AIFREE_UPDATER_PUBLIC_KEY: ${{ secrets.AIFREE_UPDATER_PUBLIC_KEY }}
        run: node desktop/scripts/release-config.mjs desktop/src-tauri/tauri.conf.json desktop/src-tauri/tauri.release.conf.json "$RELEASE_VERSION" "$AIFREE_UPDATER_PUBLIC_KEY" https://downloads.aifree.sg/desktop/stable.json
      - name: Build universal application
        working-directory: client/desktop/src-tauri
        run: npx --yes @tauri-apps/cli@2.12.6 build --target universal-apple-darwin --bundles app --no-sign --config tauri.release.conf.json -- --locked
      - name: Sign and notarize the macOS release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
          MACOS_SIGNING_CERTIFICATES_P12: ${{ secrets.MACOS_SIGNING_CERTIFICATES_P12 }}
          MACOS_SIGNING_CERTIFICATES_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATES_PASSWORD }}
          MACOS_NOTARY_PRIVATE_KEY: ${{ secrets.MACOS_NOTARY_PRIVATE_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: desktop/scripts/sign-macos-release.sh target/universal-apple-darwin/release/bundle "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: aifree-update-universal-apple-darwin
          path: |
            client/target/universal-apple-darwin/release/bundle/macos/aifree.app.tar.gz
            client/target/universal-apple-darwin/release/bundle/macos/aifree.app.tar.gz.sig
            client/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

  windows:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: windows-2022
    environment: release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    timeout-minutes: 35
    env:
      RUSTUP_TOOLCHAIN: stable
    defaults:
      run:
        shell: bash
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup target add ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Sidecars
        env:
          AIFREE_RELEASE_VERSION: ${{ inputs.version }}
        run: desktop/scripts/fetch-binaries.sh ${{ matrix.target }}
      - name: Render release-only updater configuration
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          AIFREE_UPDATER_PUBLIC_KEY: ${{ secrets.AIFREE_UPDATER_PUBLIC_KEY }}
        run: node desktop/scripts/release-config.mjs desktop/src-tauri/tauri.conf.json desktop/src-tauri/tauri.release.conf.json "$RELEASE_VERSION" "$AIFREE_UPDATER_PUBLIC_KEY" https://downloads.aifree.sg/desktop/stable.json
      - name: Build Windows executable
        working-directory: client/desktop/src-tauri
        run: npx --yes @tauri-apps/cli@2.12.6 build --target ${{ matrix.target }} --no-bundle --no-sign --config tauri.release.conf.json -- --locked
      - name: Collect Windows executables
        id: executables
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          $release = Join-Path $PWD "target/$env:RELEASE_TARGET/release"
          $sidecars = Join-Path $PWD "desktop/src-tauri/binaries"
          $files = @((Join-Path $release "ccproxy-desktop.exe"))
          foreach ($name in "aifree", "sing-box", "frpc") {
            $files += Join-Path $sidecars "${name}-$($env:RELEASE_TARGET).exe"
          }
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing Windows executable $file"
            }
          }
          "files<<AIFREE_EXECUTABLES" >> $env:GITHUB_OUTPUT
          $files >> $env:GITHUB_OUTPUT
          "AIFREE_EXECUTABLES" >> $env:GITHUB_OUTPUT
      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Windows executables
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ steps.executables.outputs.files }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-azure-cli-credential: false
          exclude-interactive-browser-credential: true
      - name: Verify executable signatures
        shell: pwsh
        env:
          SIGNED_FILES: ${{ steps.executables.outputs.files }}
        run: |
          foreach ($file in ($env:SIGNED_FILES -split '\r?\n')) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne "Valid" -or -not $signature.TimeStamperCertificate) {
              throw "Windows signature verification failed for $file ($($signature.Status))"
            }
          }
      - name: Bundle signed Windows installer
        working-directory: client/desktop/src-tauri
        run: npx --yes @tauri-apps/cli@2.12.6 bundle --target ${{ matrix.target }} --bundles nsis --config tauri.release.conf.json --no-sign
      - name: Collect Windows installer
        id: installer
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          $directory = Join-Path $PWD "target/$env:RELEASE_TARGET/release/bundle/nsis"
          $installers = @(Get-ChildItem -LiteralPath $directory -Filter "*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected one Windows installer, found $($installers.Count)"
          }
          "file=$($installers[0].FullName)" >> $env:GITHUB_OUTPUT
      - name: Sign Windows installer
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ steps.installer.outputs.file }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-azure-cli-credential: false
          exclude-interactive-browser-credential: true
      - name: Verify installer and sign updater artifact
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SIGNED_INSTALLER: ${{ steps.installer.outputs.file }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath $env:SIGNED_INSTALLER
          if ($signature.Status -ne "Valid" -or -not $signature.TimeStamperCertificate) {
            throw "Windows installer signature verification failed ($($signature.Status))"
          }
          npx --yes @tauri-apps/cli@2.12.6 signer sign --app-version $env:RELEASE_VERSION $env:SIGNED_INSTALLER
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath "$env:SIGNED_INSTALLER.sig" -PathType Leaf)) {
            throw "The Windows updater signature was not produced"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: aifree-update-${{ matrix.target }}
          path: |
            ${{ steps.installer.outputs.file }}
            ${{ steps.installer.outputs.file }}.sig
          if-no-files-found: error
          retention-days: 30

  cli:
    if: ${{ github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            arch: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: stable
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux musl toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Package the standalone CLI
        run: client/cli/package-linux.sh "$RELEASE_VERSION" ${{ matrix.target }} dist
      - name: Verify the archive and version
        working-directory: dist
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          package="aifree-cli-$RELEASE_VERSION-linux-$ARCH"
          sha256sum -c "$package.tar.gz.sha256"
          tar -xzf "$package.tar.gz"
          "$package/aifree" --version | grep -Fx "aifree $RELEASE_VERSION"
          "$package/aifree" --help
          "$package/sing-box" version
          "$package/frpc" --version
      - uses: actions/upload-artifact@v4
        with:
          name: aifree-cli-${{ inputs.version }}-linux-${{ matrix.arch }}
          path: dist/*.tar.gz*
          if-no-files-found: error
          retention-days: 30

  manifest:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [build, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: aifree-update-*
          path: artifacts
      - name: Build the stable update manifest
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: node client/desktop/scripts/release-manifest.mjs artifacts "$RELEASE_VERSION" https://downloads.aifree.sg/desktop stable.json "$RELEASE_NOTES"
      - uses: actions/upload-artifact@v4
        with:
          name: aifree-stable-update-${{ inputs.version }}
          path: |
            artifacts
            stable.json
          retention-days: 30
