name: PR 99 installer QA

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  windows:
    if: ${{ github.event.pull_request.number == 99 }}
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the Windows installer
        shell: bash
        working-directory: client
        run: |
          export AIFREE_RELEASE_VERSION=$(node -p 'require("./desktop/src-tauri/tauri.conf.json").version')
          desktop/scripts/fetch-binaries.sh x86_64-pc-windows-msvc
          cd desktop/src-tauri
          npx --yes @tauri-apps/cli@2.12.6 build --debug --target x86_64-pc-windows-msvc --bundles nsis -- --locked
      - name: Install, reinstall, and uninstall the terminal command
        shell: pwsh
        working-directory: client
        run: |
          function Get-RawUserPath {
            $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
            if ($null -eq $key) { return '' }
            try {
              return [string]$key.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
            } finally {
              $key.Dispose()
            }
          }
          function Run-Installer($File, $Arguments) {
            $result = Start-Process -FilePath $File -ArgumentList $Arguments -Wait -PassThru
            if ($result.ExitCode -ne 0) { throw "Installer exited with code $($result.ExitCode)" }
          }
          $installer = @(Get-ChildItem 'target/x86_64-pc-windows-msvc/debug/bundle/nsis' -Filter '*.exe' -File)
          if ($installer.Count -ne 1) { throw 'Expected one Windows installer' }
          $original = Get-RawUserPath
          Run-Installer $installer[0].FullName '/S'
          $installedPath = Get-RawUserPath
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'User') + ';' + $env:Path
          $command = Get-Command aifree -CommandType Application -ErrorAction Stop
          & $command.Source --version
          if ($LASTEXITCODE -ne 0) { throw 'The CLI failed to start' }
          Run-Installer $installer[0].FullName @('/S', '/UPDATE')
          if ((Get-RawUserPath) -cne $installedPath) { throw 'Reinstallation altered the terminal PATH entry' }
          $uninstaller = Join-Path (Split-Path $command.Source) 'uninstall.exe'
          Run-Installer $uninstaller '/S'
          if ((Get-RawUserPath) -cne $original) { throw 'Uninstall did not restore the original user PATH' }

  macos:
    if: ${{ github.event.pull_request.number == 99 }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the macOS app and installer
        shell: bash
        working-directory: client
        run: |
          target=$(rustc -vV | awk '/^host:/ {print $2}')
          export AIFREE_RELEASE_VERSION=$(node -p 'require("./desktop/src-tauri/tauri.conf.json").version')
          desktop/scripts/fetch-binaries.sh "$target"
          (cd desktop/src-tauri && npx --yes @tauri-apps/cli@2.12.6 build --debug --target "$target" --bundles app -- --locked)
          desktop/scripts/package-macos-installer.sh "target/$target/debug/bundle/macos/aifree.app" "$RUNNER_TEMP/aifree-qa.dmg"
      - name: Install and run the terminal command
        shell: bash
        run: |
          mount=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$RUNNER_TEMP/aifree-qa.dmg"
          trap 'hdiutil detach "$mount"' EXIT
          sudo installer -pkg "$mount/Install aifree.pkg" -target /
          test "$(readlink /usr/local/bin/aifree)" = /Applications/aifree.app/Contents/MacOS/aifree
          /usr/local/bin/aifree --version
          sudo installer -pkg "$mount/Install aifree.pkg" -target /
          aifree --version
