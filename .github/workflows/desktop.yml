name: Issue 73 published installer smoke tests
on: workflow_dispatch

permissions:
  contents: read

jobs:
  macos:
    name: macOS install and launch
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      MAC_ARCH: ${{ matrix.arch }}
      PACKAGE_URL: https://downloads.aifree.sg/desktop/0.2.2/darwin-universal/aifree_0.2.2_universal.dmg
      PACKAGE_SHA: 4206c337cabec96c9c80bcde1681be578338a06b8a52245a718f8223858726b0
    steps:
      - name: Check CPU and download the published package
        run: |
          set -euo pipefail
          sw_vers
          test "$(uname -m)" = "$MAC_ARCH"
          cpu=$(sysctl -n machdep.cpu.brand_string)
          printf 'macOS architecture %s, CPU %s\n' "$MAC_ARCH" "$cpu"
          qa_dir="$RUNNER_TEMP/aifree-intel"
          mkdir "$qa_dir"
          candidate="$qa_dir/aifree_0.2.2_universal.dmg"
          curl -fsSL --retry 3 --max-time 160 "$PACKAGE_URL" -o "$candidate"
          printf '%s  %s\n' "$PACKAGE_SHA" "$candidate" | shasum -a 256 --check
      - name: Verify the DMG and install the app
        run: |
          set -euo pipefail
          qa_dir="$RUNNER_TEMP/aifree-intel"
          candidate="$qa_dir/aifree_0.2.2_universal.dmg"
          installed=/Applications/aifree.app
          mount_dir="$qa_dir/mount"
          hdiutil verify "$candidate"
          xcrun stapler validate "$candidate"
          codesign --verify --verbose=2 "$candidate"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$candidate"
          test ! -e "$installed"
          mkdir "$mount_dir"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$candidate"
          trap 'hdiutil detach "$mount_dir" >/dev/null 2>&1 || true' EXIT
          sudo ditto "$mount_dir/aifree.app" "$installed"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$installed/Contents/Info.plist")" = 0.2.2
          xcrun stapler validate "$installed"
          codesign --verify --deep --strict --all-architectures --verbose=2 "$installed"
          spctl --assess --type execute --verbose=2 "$installed"
          main=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$installed/Contents/Info.plist")
          for program in "$main" ccproxy sing-box frpc; do
            executable="$installed/Contents/MacOS/$program"
            lipo "$executable" -verify_arch x86_64
            lipo "$executable" -verify_arch arm64
            printf '%s %s\n' "$program" "$(lipo -archs "$executable")"
          done

      - name: Start the installed app and confirm a visible window
        run: |
          set -euo pipefail
          qa_dir="$RUNNER_TEMP/aifree-intel"
          installed=/Applications/aifree.app
          main=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$installed/Contents/Info.plist")
          executable="$installed/Contents/MacOS/$main"
          arch "-$MAC_ARCH" "$installed/Contents/MacOS/ccproxy" --version
          arch "-$MAC_ARCH" "$installed/Contents/MacOS/sing-box" version
          arch "-$MAC_ARCH" "$installed/Contents/MacOS/frpc" --version
          launchctl print "gui/$(id -u)" >/dev/null
          cat > "$qa_dir/window-check.swift" <<'SWIFT'
          import AppKit
          import CoreGraphics
          import Foundation

          guard CommandLine.arguments.count == 2,
                let processID = Int32(CommandLine.arguments[1]),
                let app = NSRunningApplication(processIdentifier: processID),
                app.isFinishedLaunching, !app.isTerminated else { exit(1) }

          let windows = CGWindowListCopyWindowInfo(
              [.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID
          ) as? [[String: Any]] ?? []
          let hasVisibleWindow = windows.contains { window in
              guard (window[kCGWindowOwnerPID as String] as? NSNumber)?.int32Value == processID,
                    (window[kCGWindowLayer as String] as? NSNumber)?.intValue == 0,
                    let bounds = window[kCGWindowBounds as String] as? [String: NSNumber],
                    let width = bounds["Width"], let height = bounds["Height"] else { return false }
              return width.doubleValue >= 300 && height.doubleValue >= 350
          }
          if hasVisibleWindow { print("Installed aifree window is visible") }
          exit(hasVisibleWindow ? 0 : 1)
          SWIFT
          xcrun swiftc "$qa_dir/window-check.swift" -o "$qa_dir/window-check"
          /usr/bin/open -na "$installed"
          for attempt in {1..30}; do
            app_pid=$(ps -axo pid=,command= | awk -v app="$executable" '$2 == app { print $1; exit }')
            if [[ -n "$app_pid" ]] && "$qa_dir/window-check" "$app_pid"; then
              sleep 3
              kill -0 "$app_pid"
              printf 'Installed aifree 0.2.2 launched natively on %s as PID %s\n' "$MAC_ARCH" "$app_pid"
              printf 'The notarized 0.2.2 DMG installed in /Applications and opened a visible window.\n' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 1
          done
          printf 'No visible window after %s checks.' "$attempt"
          /usr/bin/log show --last 2m --predicate 'process == "ccproxy-desktop"' --style compact | tail -30
          exit 1

  windows:
    name: Windows x64 NSIS install and launch
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      PACKAGE_URL: https://downloads.aifree.sg/desktop/0.2.2/windows-x86_64/aifree_0.2.2_x64-setup.exe
      PACKAGE_SHA: a35e620c7656d601fe8ef4dd136ac872ed75e933bb2e98438f090eaebb48ce0f
    steps:
      - name: Download, install, and launch the signed Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          if ($env:PROCESSOR_ARCHITECTURE -ne "AMD64") { throw "Expected a Windows AMD64 runner" }
          $package = Join-Path $env:RUNNER_TEMP "aifree_0.2.2_x64-setup.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "aifree-installed"
          Invoke-WebRequest -Uri $env:PACKAGE_URL -OutFile $package -MaximumRetryCount 3
          if ((Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:PACKAGE_SHA) { throw "Installer SHA-256 mismatch" }
          $auth = Get-AuthenticodeSignature $package
          if ($auth.Status -ne "Valid" -or !$auth.TimeStamperCertificate -or $auth.SignerCertificate.Subject -notlike "*TENSOR SHIFT PTE. LTD.*") {
            throw "The published installer did not pass its publisher and timestamp checks"
          }
          $installer = Start-Process -FilePath $package -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "NSIS exited with code $($installer.ExitCode)" }
          $program = @(Get-ChildItem -LiteralPath $installDir -Filter "ccproxy-desktop.exe" -Recurse -File)
          if ($program.Count -ne 1) { throw "The installer did not create the aifree desktop executable" }
          $binary = $program[0].FullName
          $version = $program[0].VersionInfo.ProductVersion
          if ($version -notmatch '^0\.2\.2(?:$|[.+-])') { throw "Installed product version differs from 0.2.2: $version" }
          $reader = [System.IO.BinaryReader]::new([System.IO.File]::OpenRead($binary))
          try {
            $reader.BaseStream.Position = 60
            $offset = $reader.ReadUInt32()
            $reader.BaseStream.Position = $offset + 4
            if ($reader.ReadUInt16() -ne 0x8664) { throw "The installed program is not an x64 PE binary" }
          } finally {
            $reader.Dispose()
          }
          if ((Get-AuthenticodeSignature $binary).Status -ne "Valid") { throw "Installed app signature is invalid" }
          $app = Start-Process -FilePath $binary -WorkingDirectory (Split-Path -Parent $binary) -PassThru
          try {
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              $app.Refresh()
              if ($app.HasExited) { throw "aifree exited before displaying a window ($($app.ExitCode))" }
              if ($app.MainWindowHandle -ne 0) {
                Start-Sleep -Seconds 3
                $app.Refresh()
                if ($app.HasExited) { throw "aifree closed after displaying its initial window" }
                Write-Output "The installed Windows x64 aifree $version opened its main window."
                exit 0
              }
              Start-Sleep -Seconds 1
            }
            throw "The installed process did not display a main window"
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id -ErrorAction SilentlyContinue }
          }

  linux:
    name: Linux x64 package launch
    runs-on: ubuntu-22.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            url: https://downloads.aifree.sg/desktop/0.2.2/linux-x86_64-deb/aifree_0.2.2_amd64.deb
            sha: 09021603725c3f4d3ae299c8c6833a4f9e1ac34c3aa37e00f2b47bbe3b2a6bcd
          - format: AppImage
            url: https://downloads.aifree.sg/desktop/0.2.2/linux-x86_64-appimage/aifree_0.2.2_amd64.AppImage
            sha: cb1d7eb12946221a008a8a4295e99d82eec93976758ff5cb986832186a8fa446
    env:
      PACKAGE_FORMAT: ${{ matrix.format }}
      PACKAGE_URL: ${{ matrix.url }}
      PACKAGE_SHA: ${{ matrix.sha }}
    steps:
      - name: Install Linux runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-0 libayatana-appindicator3-1 libgtk-3-0 xvfb xauth xdotool dbus-x11
      - name: Verify and launch the published Linux package
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          qa_dir="$RUNNER_TEMP/aifree-linux"
          mkdir "$qa_dir"
          package="$qa_dir/$(basename "$PACKAGE_URL")"
          curl -fsSL --retry 3 --max-time 160 "$PACKAGE_URL" -o "$package"
          printf '%s  %s\n' "$PACKAGE_SHA" "$package" | sha256sum --check
          if [[ "$PACKAGE_FORMAT" = deb ]]; then
            test "$(dpkg-deb -f "$package" Version)" = 0.2.2
            test "$(dpkg-deb -f "$package" Architecture)" = amd64
            sudo apt-get install -y "$package"
            executable=$(dpkg -L aifree | awk '/^\/usr\/bin\/(aifree|ccproxy-desktop)$/ {print; exit}')
          else
            chmod +x "$package"
            executable="$package"
          fi
          test -x "$executable"
          file "$executable" | grep -F x86-64
          export GTK_USE_PORTAL=0 WEBKIT_DISABLE_COMPOSITING_MODE=1 APPIMAGE_EXTRACT_AND_RUN=1
          dbus-run-session -- xvfb-run -a bash -s -- "$executable" "$PACKAGE_FORMAT" <<'LINUX_WINDOW'
          set -euo pipefail
          app_log=$(mktemp)
          "$1" > "$app_log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..45}; do
            if ! kill -0 "$app_pid" 2>/dev/null; then break; fi
            if xdotool search --onlyvisible --name '^aifree$' >/dev/null 2>&1; then
              sleep 3
              kill -0 "$app_pid"
              printf 'aifree 0.2.2 opened a visible Linux x64 window using %s.\n' "$2"
              exit 0
            fi
            sleep 1
          done
          printf 'No visible aifree window after %s checks.\n' "$attempt" >&2
          tail -50 "$app_log" >&2
          exit 1
          LINUX_WINDOW
