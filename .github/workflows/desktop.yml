name: Desktop tray reopen verification

on: workflow_dispatch

permissions:
  contents: read

jobs:
  updates:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the desktop and core Rust tests
        working-directory: client
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
        run: cargo test --workspace --locked
      - name: Run the desktop JavaScript tests
        run: node --test client/desktop/tests/*.test.mjs
