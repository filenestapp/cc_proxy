name: Signed macOS Intel install and launch
on: workflow_dispatch

permissions:
  contents: write

jobs:
  install-and-launch:
    runs-on: macos-15-intel
    timeout-minutes: 12
    steps:
      - name: Verify Intel environment and download the signed candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sw_vers
          test "$(uname -m)" = x86_64
          cpu=$(sysctl -n machdep.cpu.brand_string)
          printf 'Architecture x86_64, CPU %s\n' "$cpu"
          case "$cpu" in *Intel*) ;; *) exit 1 ;; esac
          qa_dir="$RUNNER_TEMP/aifree-intel"
          mkdir "$qa_dir"
          candidate="$qa_dir/aifree_0.2.1_universal.dmg"
          curl --fail --location --silent --show-error --retry 3 --max-time 180 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/assets/794259209" \
            -o "$candidate"
          printf '8087d4bf9feca28a743bdc4902b1a05eeebba0601a55ac08a770f23b0feb034e  %s\n' "$candidate" | shasum -a 256 --check

      - name: Verify the DMG and install the app
        run: |
          set -euo pipefail
          qa_dir="$RUNNER_TEMP/aifree-intel"
          candidate="$qa_dir/aifree_0.2.1_universal.dmg"
          installed=/Applications/aifree.app
          mount_dir="$qa_dir/mount"
          hdiutil verify "$candidate"
          xcrun stapler validate "$candidate"
          codesign --verify --verbose=2 "$candidate"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$candidate"
          test ! -e "$installed"
          mkdir "$mount_dir"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$candidate"
          trap 'hdiutil detach "$mount_dir" >/dev/null 2>&1 || true' EXIT
          sudo ditto "$mount_dir/aifree.app" "$installed"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$installed/Contents/Info.plist")" = 0.2.1
          xcrun stapler validate "$installed"
          codesign --verify --deep --strict --all-architectures --verbose=2 "$installed"
          spctl --assess --type execute --verbose=2 "$installed"
          main=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$installed/Contents/Info.plist")
          for program in "$main" ccproxy sing-box frpc; do
            executable="$installed/Contents/MacOS/$program"
            lipo "$executable" -verify_arch x86_64
            lipo "$executable" -verify_arch arm64
            printf '%s %s\n' "$program" "$(lipo -archs "$executable")"
          done

      - name: Start the installed app and confirm a visible window
        run: |
          set -euo pipefail
          qa_dir="$RUNNER_TEMP/aifree-intel"
          installed=/Applications/aifree.app
          main=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$installed/Contents/Info.plist")
          executable="$installed/Contents/MacOS/$main"
          arch -x86_64 "$installed/Contents/MacOS/ccproxy" --version
          arch -x86_64 "$installed/Contents/MacOS/sing-box" version
          arch -x86_64 "$installed/Contents/MacOS/frpc" --version
          launchctl print "gui/$(id -u)" >/dev/null
          cat > "$qa_dir/window-check.swift" <<'SWIFT'
          import AppKit
          import CoreGraphics
          import Foundation

          guard CommandLine.arguments.count == 2,
                let processID = Int32(CommandLine.arguments[1]),
                let app = NSRunningApplication(processIdentifier: processID),
                app.isFinishedLaunching, !app.isTerminated else { exit(1) }

          let windows = CGWindowListCopyWindowInfo(
              [.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID
          ) as? [[String: Any]] ?? []
          let hasVisibleWindow = windows.contains { window in
              guard (window[kCGWindowOwnerPID as String] as? NSNumber)?.int32Value == processID,
                    (window[kCGWindowLayer as String] as? NSNumber)?.intValue == 0,
                    let bounds = window[kCGWindowBounds as String] as? [String: NSNumber],
                    let width = bounds["Width"], let height = bounds["Height"] else { return false }
              return width.doubleValue >= 300 && height.doubleValue >= 350
          }
          if hasVisibleWindow { print("Installed aifree window is visible") }
          exit(hasVisibleWindow ? 0 : 1)
          SWIFT
          xcrun swiftc "$qa_dir/window-check.swift" -o "$qa_dir/window-check"
          /usr/bin/open -na "$installed"
          for attempt in {1..30}; do
            app_pid=$(ps -axo pid=,command= | awk -v app="$executable" '$2 == app { print $1; exit }')
            if [[ -n "$app_pid" ]] && "$qa_dir/window-check" "$app_pid"; then
              sleep 3
              kill -0 "$app_pid"
              printf 'Installed aifree 0.2.1 launched natively on Intel as PID %s\n' "$app_pid"
              printf 'The notarized 0.2.1 DMG installed in /Applications and opened a visible window on macos-15-intel.\n' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 1
          done
          printf 'No visible window after %s checks.' "$attempt"
          /usr/bin/log show --last 2m --predicate 'process == "ccproxy-desktop"' --style compact | tail -30
          exit 1
