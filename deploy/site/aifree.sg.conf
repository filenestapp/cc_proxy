# aifree.sg marketing site (static files from site/), served by the BaoTa nginx
# on the control-plane server. Installed as /www/server/panel/vhost/nginx/aifree.sg.conf.
# Cloudflare proxies both names (SSL mode "Full"); the origin certificate is
# Let's Encrypt via webroot, see deploy/site/README.md.

server {
    listen 80;
    server_name aifree.sg www.aifree.sg;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/aifree-site/acme;
        try_files $uri =404;
    }
    location / {
        return 301 https://aifree.sg$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.aifree.sg;

    ssl_certificate /etc/letsencrypt/live/aifree.sg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aifree.sg/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/aifree-site/acme;
        try_files $uri =404;
    }
    location / {
        return 301 https://aifree.sg$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name aifree.sg;

    ssl_certificate /etc/letsencrypt/live/aifree.sg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aifree.sg/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /home/ubuntu/macmini/shared/nginx/cloudflare-realip.conf;
    access_log /www/wwwlogs/aifree.sg.access.log;
    error_log /www/wwwlogs/aifree.sg.error.log warn;

    root /www/wwwroot/aifree.sg;
    index index.html;
    absolute_redirect off;
    client_max_body_size 16k;

    # Same headers as site/_headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://app.aifree.sg https://downloads.aifree.sg; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/aifree-site/acme;
        try_files $uri =404;
    }

    location = /_headers { return 404; }
    location = /README.md { return 404; }

    location /assets/ {
        expires 1d;
        try_files $uri =404;
    }

    location / {
        expires 5m;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
