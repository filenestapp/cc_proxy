# app.aifree.sg: customer center (/account) and /v1/account/* API on the control plane.
# Installed as /www/server/panel/vhost/nginx/app.aifree.sg.conf next to ccproxy.macmini.sg.conf.
# Cloudflare proxies the name (SSL mode "Full"); origin certificate is Let's Encrypt via webroot.

# Forward only the customer session cookie, as ccproxy.macmini.sg.conf does for cp_session.
map $cookie_aifree_session $aifree_app_upstream_cookie {
    "" "";
    default "aifree_session=$cookie_aifree_session";
}

server {
    listen 80;
    server_name app.aifree.sg;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/aifree-site/acme;
        try_files $uri =404;
    }
    location / {
        return 301 https://app.aifree.sg$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name app.aifree.sg;

    ssl_certificate /etc/letsencrypt/live/app.aifree.sg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.aifree.sg/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /home/ubuntu/macmini/shared/nginx/cloudflare-realip.conf;
    access_log /www/wwwlogs/app.aifree.sg.access.log;
    error_log /www/wwwlogs/app.aifree.sg.error.log warn;
    client_max_body_size 1m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/aifree-site/acme;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:18452;
        proxy_cache off;
        gzip off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $aifree_app_upstream_cookie;
    }
}
